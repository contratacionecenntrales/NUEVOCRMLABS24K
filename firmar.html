<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin">
<meta name="theme-color" content="#F1F5F9">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='6' y1='6' x2='58' y2='58' gradientUnits='userSpaceOnUse'><stop stop-color='%232DD4C4'/><stop offset='.55' stop-color='%2317C8C0'/><stop offset='1' stop-color='%231A7F9C'/></linearGradient></defs><rect width='64' height='64' rx='14' fill='%230B0F19'/><g stroke='url(%23g)' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round' fill='none'><path d='M12 20 L32 9 L44 16'/><path d='M52 24 V42 L43 47'/><path d='M32 55 L12 43 V26'/><path d='M20 41 h9 l4 4'/><path d='M39 20 V40'/></g><g fill='url(%23g)'><circle cx='20' cy='41' r='4.6'/><circle cx='39' cy='42' r='5'/><rect x='45' y='11' width='8' height='8' rx='2'/><rect x='55' y='21' width='5' height='5' rx='1.4' opacity='.75'/></g></svg>">
<title>Firmar contrato | Labs24k</title>
<style>
/* ==========================================================================
   MODULO DE PRESUPUESTOS: catalogo, documento formal y hoja de ruta
   ========================================================================== */
.pack-list{padding-right:2px}
.pack{background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:13px;
  margin-bottom:9px;cursor:pointer;transition:.15s}
.pack:hover{border-color:#31435E}
.pack.on{border-color:var(--blue);background:rgba(8,145,178,.22);box-shadow:0 8px 22px -14px rgba(23,200,192,.9)}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:.94em;letter-spacing:.01em}
.btn.on-tab{background:var(--blue);color:#fff;border-color:var(--blue)}
.rec{color:#86EFAC}

/* ---------- DOCUMENTO ---------- */
/* HOJA EN BLANCO
   El documento es papel, no interfaz: se ve igual en pantalla que impreso.
   En lugar de repintar cada elemento, se redefinen los colores del sistema
   solo dentro del documento, así todo lo que hay dentro —tablas, chips,
   isotipo, gráficos— cambia de una vez y no queda nada heredado del modo
   oscuro. */
.doc.pdf{
  --bg:#FFFFFF; --panel:#FFFFFF; --card:#FFFFFF; --card-2:#F8FAFC;
  --line:#E2E8F0; --line-soft:#E7EDF4;
  --txt:#0F172A; --txt-2:#475569; --txt-3:#64748B;
  --blue:#0F766E; --blue-d:#115E59; --cyan:#0E9C96;
  --green:#047857; --amber:#B45309; --red:#B91C1C; --violet:#5B21B6;
  --iso-1:#12B7B0; --iso-2:#1A7F9C; --iso-3:#16324F;
  --shadow:0 10px 34px -20px rgba(15,23,42,.45);
  background:#FFFFFF;
  color:#0F172A;
  border:1px solid #E2E8F0;
  border-radius:var(--r);
  padding:34px;
  box-shadow:var(--shadow);
}
.doc.pdf .muted{color:#64748B}
.doc.pdf .w,.doc.pdf strong,.doc.pdf h1,.doc.pdf h2,.doc.pdf h3,.doc.pdf h4{color:#0F172A}
.doc.pdf .tbl th{color:#475569;background:#F8FAFC}
.doc.pdf .tbl td{border-color:#E2E8F0}
.doc.pdf .chip{border-color:#CBD5E1}
.doc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding-bottom:16px;border-bottom:2px solid var(--blue)}
.doc-brand{font-size:20px;font-weight:800;letter-spacing:.14em;color:var(--blue)}
.doc-brand span{color:var(--txt)}
.doc-kicker{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}
.doc-title{font-size:22px;line-height:1.25;font-weight:700;color:var(--txt);margin:22px 0 6px;
  text-wrap:balance;max-width:62ch}
.doc-lead{font-size:13px;color:var(--txt-2);max-width:72ch;margin:0 0 18px}
.doc-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:14px 0;margin:16px 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.doc-meta .k,.doc-parties .k,.doc-sign .k{display:block;font-size:10px;text-transform:uppercase;
  letter-spacing:.09em;color:var(--txt-3);margin-bottom:4px}
.doc-meta .v{font-size:13px;font-weight:600;color:var(--txt)}
.doc-parties{display:grid;grid-template-columns:1fr 1fr;gap:16px;background:var(--card-2);
  border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:20px}
.doc-parties .v.big{font-size:15px;font-weight:700;color:var(--txt)}
.doc-parties .tel{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
  color:var(--blue);margin:3px 0 2px}
.doc-hero{text-align:center;border:1px solid rgba(23,200,192,.4);border-radius:14px;padding:20px;
  margin:6px 0 24px;background:linear-gradient(180deg,rgba(23,200,192,.14),rgba(23,200,192,0))}
.doc-hero .amount{font-size:36px;font-weight:800;color:var(--txt);letter-spacing:-.02em;margin:6px 0 4px;
  font-variant-numeric:tabular-nums}
.doc-sec{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;color:var(--txt-2);margin:26px 0 12px}
.doc-sec .n{width:22px;height:22px;border-radius:6px;background:var(--blue);color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:12px;letter-spacing:0}
.doc-tbl td{vertical-align:top}
.doc-tbl td,.doc-tbl th{font-variant-numeric:tabular-nums}
.doc-sum{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.doc-sum .l{display:flex;justify-content:space-between;gap:16px;padding:11px 16px;font-size:13px;
  border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.doc-sum .l:last-child{border-bottom:none}
.doc-sum .l.tot{background:var(--card-2);font-size:16px;font-weight:800;color:var(--txt);
  border-top:2px solid var(--blue)}
.doc-box{background:var(--card-2);border:1px solid var(--line);border-left:3px solid var(--blue);
  border-radius:10px;padding:15px;margin-bottom:16px}
.doc-box .bt{font-size:12.5px;font-weight:700;color:var(--txt);margin-bottom:8px}
.doc-box .li{font-size:12.5px;color:var(--txt-2);margin-bottom:5px}
.doc-note{font-size:11.5px;color:var(--txt-3);line-height:1.6;padding:12px 0;border-top:1px dashed var(--line)}
.doc-why{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.doc-why>div{text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px}
.doc-why .ok{color:var(--green);display:flex;justify-content:center;margin-bottom:8px}
.doc-why .t{font-size:12.5px;font-weight:700;color:var(--txt);margin-bottom:4px}
.doc-sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin:28px 0 10px}
.doc-sign .line{height:34px;border-bottom:1px solid var(--txt-3);margin:6px 0 8px}
.doc-sign .v{font-size:13px;font-weight:600;color:var(--txt)}
.doc-foot{font-size:10.5px;color:var(--txt-3);text-align:center;padding-top:14px;
  border-top:1px solid var(--line);margin-top:16px;line-height:1.6}

/* ---------- HOJA DE RUTA ---------- */
.week{background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:16px}
.week .wh{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.week .wn{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:var(--blue);color:#fff;
  font-weight:800;display:flex;align-items:center;justify-content:center}
.week .wt{font-size:14px;font-weight:700;color:var(--txt)}
.week .wl{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--txt-2);margin:8px 0}
.week .wl svg{flex:0 0 auto;color:var(--green);margin-top:2px}
.week .wr{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;
  font-weight:600;color:var(--blue)}

@media(max-width:1000px){
  .doc-meta,.doc-why{grid-template-columns:repeat(2,1fr)}
  .doc-parties,.doc-sign{grid-template-columns:1fr}
}
@media(max-width:600px){
  .doc.pdf{padding:18px}
  .doc-meta,.doc-why{grid-template-columns:1fr}
  .doc-hero .amount{font-size:27px}
  .doc-title{font-size:18px}
}

/* ==========================================================================
   IMPRESION / EXPORTACION A PDF: solo el documento, sobre papel blanco
   ========================================================================== */
@media print{
  @page{size:A4;margin:12mm}
  :root{
    --bg:#fff; --panel:#fff; --card:#fff; --card-2:#F8FAFC; --line:#D9E0EA;
    --line-soft:#E5EAF1; --txt:#0B0F19; --txt-2:#475569; --txt-3:#64748B;
  }
  html,body{background:#fff!important;color:#0B0F19!important}
  .app{display:block}
  .main,.content,.view{display:block;padding:0!important;margin:0!important;max-width:none}
  .stack,.grid{display:block!important}
  /* se declara despues para ganar a las reglas de display anteriores */
  .sidebar,.topbar,.toast,.scrim,.no-print,.no-print *{display:none!important}
  .doc.pdf{border:none!important;border-radius:0;padding:0!important;background:#fff!important;
    box-shadow:none;break-inside:auto}
  .doc-hero{background:#ECFEFF!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc-sec .n,.week .wn{background:#17C8C0!important;color:#fff!important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc-top{border-bottom-color:#17C8C0!important}
  .doc-sum .l.tot{background:#F1F5F9!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tbl th{background:#F1F5F9!important;color:#31435E!important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .chip{border-color:#CBD5E1!important;background:#F8FAFC!important;color:#31435E!important}
  .doc-sec,.doc-sign,.doc-why,.doc-box,.week,tr{break-inside:avoid}
  .doc-sec{break-after:avoid}
  .doc-why{display:grid!important;grid-template-columns:repeat(4,1fr)!important;gap:10px}
  .doc-sign,.doc-parties{display:grid!important;grid-template-columns:1fr 1fr!important}
  .doc-meta{display:grid!important;grid-template-columns:repeat(2,1fr)!important;gap:10px 24px}
  /* compactado para que la propuesta entre en el minimo de paginas */
  body{font-size:12px}
  .doc-title{font-size:19px;margin:16px 0 4px}
  .doc-hero{padding:14px;margin:4px 0 16px}
  .doc-hero .amount{font-size:30px}
  .doc-sec{margin:18px 0 9px}
  .tbl td{padding:9px 10px}
  .tbl th{padding:8px 10px}
  .doc-sum .l{padding:8px 12px}
  .doc-sign{margin:20px 0 8px}
  /* texto blanco del tema oscuro: en papel debe ser tinta */
  .doc .w,.doc-tbl .w,.tbl .w{color:#0B0F19!important}
  .rec{color:#047857!important}
  a{color:#0F766E!important;text-decoration:none}
}

/* Cabecera de marca de los documentos: isotipo y logotipo alineados por su
   eje óptico, con el mismo aire arriba y abajo. */
.doc-brand-row{display:flex;align-items:center;gap:15px}
.doc-brand-row .marca-txt{display:block;margin-bottom:3px}
.doc-brand-row > div{display:flex;flex-direction:column;justify-content:center;min-width:0}

/* Los controles que viven dentro de la hoja (quitar línea, etc.) también son
   claros: en papel blanco un botón oscuro canta. */
.doc.pdf .btn-s{background:#F1F5F9;color:#475569;border:1px solid #CBD5E1}
.doc.pdf .btn-s:hover{background:#E2E8F0;color:#0F172A}
.doc.pdf .rec{color:#047857}
.doc.pdf .doc-parties{background:#F8FAFC;border:1px solid #E2E8F0}
.doc.pdf .doc-hero{background:#F0FDFA;border-color:#99F6E4}
.doc.pdf .doc-sec .n{background:#0F766E;color:#fff}
.doc.pdf .tel{color:#0F766E}

/* =========================================================================
   RANKING · MISSION CONTROL · CONTROL POR VOZ · CONTRATOS
   ====================================================================== */

/* ---------------------------- PODIO ---------------------------------- */
.card-podio{padding-bottom:0;overflow:hidden}
.podio{display:flex;align-items:flex-end;justify-content:center;gap:16px;
  margin-top:22px;flex-wrap:wrap}
.pod{flex:1 1 180px;max-width:240px;text-align:center;padding:18px 14px 0;
  border:1px solid var(--line);border-radius:14px 14px 0 0;background:var(--card-2);
  position:relative;display:flex;flex-direction:column;align-items:center;gap:5px}
.pod-1{border-color:rgba(23,200,192,.5);
  background:linear-gradient(180deg,rgba(23,200,192,.12),var(--card-2) 70%)}
.pod-2{border-color:rgba(148,163,184,.35)}
.pod-3{border-color:rgba(180,83,9,.35)}
.pod-medalla{position:absolute;top:-13px;left:50%;transform:translateX(-50%);
  width:26px;height:26px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:800;color:#04231F;background:#94A3B8;
  border:2px solid var(--panel)}
.pod-1 .pod-medalla{background:var(--blue)}
.pod-3 .pod-medalla{background:#B45309;color:#fff}
.pod-av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:#fff;font-weight:700;font-size:18px;margin-top:6px}
.pod-n{font-weight:600;color:#fff;font-size:13.5px;line-height:1.3}
.pod-vol{font-size:20px;font-weight:800;color:var(--txt);letter-spacing:-.01em;margin-top:4px}
.pod-barra{width:100%;margin-top:12px;border-radius:8px 8px 0 0;background:rgba(23,200,192,.16)}
.pod-1 .pod-barra{height:56px;background:rgba(23,200,192,.3)}
.pod-2 .pod-barra{height:38px}
.pod-3 .pod-barra{height:26px}

.rk-pos{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
  border-radius:8px;background:var(--card-2);border:1px solid var(--line);
  font-size:12px;font-weight:700;color:var(--txt-2)}
.rk-pos.top{background:rgba(23,200,192,.15);border-color:rgba(23,200,192,.4);color:#99F6E4}

/* ------------------------ MISSION CONTROL ---------------------------- */
.ag-rejilla{gap:14px}
.ag{display:flex;flex-direction:column}
.ag-off{opacity:.82;border-style:dashed}
.ag-acciones{display:flex;flex-direction:column;gap:8px;padding-top:11px;
  border-top:1px solid var(--line);min-height:52px}
.ag-acc{display:flex;gap:9px;align-items:flex-start}
.ag-punto{width:6px;height:6px;border-radius:50%;background:var(--blue);flex:0 0 auto;
  margin-top:5px;box-shadow:0 0 0 3px rgba(23,200,192,.14)}

/* ------------------------- CONTROL POR VOZ --------------------------- */
.vz-card{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:34px 22px;text-align:center;min-height:340px}
.vz-onda{display:flex;align-items:center;justify-content:center;gap:5px;height:56px}
.vz-onda i{width:5px;height:12px;border-radius:3px;background:var(--line);display:block}
.vz-onda.on i{background:var(--blue);animation:vzsalta 1s ease-in-out infinite}
@keyframes vzsalta{0%,100%{height:10px}50%{height:44px}}
.vz-boton{width:92px;height:92px;border-radius:50%;border:1px solid var(--line);
  background:var(--card-2);color:var(--txt-2);cursor:pointer;display:flex;
  align-items:center;justify-content:center;transition:transform .15s}
.vz-boton:hover:not(:disabled){transform:scale(1.04);color:var(--blue);
  border-color:rgba(23,200,192,.5)}
.vz-boton:disabled{opacity:.45;cursor:not-allowed}
.vz-boton.on{background:var(--blue);color:#04231F;border-color:var(--blue);
  box-shadow:0 0 0 8px rgba(23,200,192,.14)}
.vz-estado{font-size:13px;color:var(--txt-2)}
.vz-ultimo{font-size:15px;color:#fff;font-style:italic;max-width:32ch}
.vz-ordenes{display:flex;flex-wrap:wrap;gap:7px}
.vz-h{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;
  background:var(--card-2);border:1px solid var(--line)}
.vz-h svg{flex:0 0 auto;margin-top:1px;color:var(--green)}
.vz-h-no svg{color:var(--amber)}

@media(prefers-reduced-motion:reduce){
  .vz-onda.on i{animation:none;height:24px}
  .vz-boton{transition:none}
}

/* ---------------------------- CONTRATO -------------------------------- */
.doc.pdf.contrato .ct-p{font-size:13px;line-height:1.75;color:#334155;margin:0 0 14px;
  text-align:justify}
.doc.pdf .hueco{background:#FEF3C7;color:#92400E;border-radius:4px;padding:1px 6px;
  font-style:italic;font-weight:600}

/* Subtítulo del contrato (la línea larga bajo el título) */
.doc.pdf .doc-sub{font-size:13.5px;line-height:1.55;color:#475569;font-weight:600;
  margin:0 0 20px;max-width:70ch}

/* Epígrafes sin número: REUNIDOS · EXPONEN · CLÁUSULAS · ANEXO I */
.doc.pdf .ct-hito{justify-content:center;text-align:center;letter-spacing:.2em;
  font-size:12.5px;color:#0F766E;border-top:1px solid #E2E8F0;border-bottom:1px solid #E2E8F0;
  padding:9px 0;margin:26px 0 16px}

/* Listas de las cláusulas segunda, tercera, sexta, séptima y novena */
.doc.pdf .ct-ul{margin:0 0 14px;padding-left:20px;list-style:disc}
.doc.pdf .ct-ul li{font-size:13px;line-height:1.7;color:#334155;margin-bottom:7px;
  text-align:justify}
.doc.pdf .ct-ul li::marker{color:#0F766E}

/* Tabla orientativa de inversión publicitaria (cláusula cuarta) */
.doc.pdf .ct-tabla{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:12.5px}
.doc.pdf .ct-tabla th{text-align:left;font-weight:700;color:#0F172A;background:#F1F5F9;
  border:1px solid #E2E8F0;padding:9px 11px}
.doc.pdf .ct-tabla td{border:1px solid #E2E8F0;padding:9px 11px;color:#334155;
  font-variant-numeric:tabular-nums}

/* Cuadro resumen del precio (se usa aquí y en el formulario) */
.sum-l{display:flex;justify-content:space-between;gap:16px;padding:11px 16px;font-size:13px;
  border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.sum-l:last-child{border-bottom:none}
.sum-l.tot{background:var(--card-2);font-size:16px;font-weight:800;color:var(--txt);
  border-top:2px solid var(--blue)}

/* Anexo I: empieza en página nueva al imprimir */
.doc.pdf .ct-anexo{margin-top:34px;padding-top:8px}

/* Enlace de firma copiable */
.copiable{background:var(--card-2);border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;overflow-wrap:anywhere}
.copiable code{font-size:12.5px;color:var(--blue);font-family:ui-monospace,SFMono-Regular,
  Menlo,Consolas,monospace}

@media print{
  .doc.pdf .ct-anexo{break-before:page}
  .doc.pdf .ct-ul li,.doc.pdf .ct-tabla tr,.doc.pdf .ct-p{break-inside:avoid}
}
.doc-sign{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:32px}
.doc.pdf .firma{height:56px;border-bottom:1px solid #94A3B8;margin:10px 0 7px}
.doc.pdf .doc-sign .k{color:#64748B}

@media(max-width:700px){
  .doc-sign{grid-template-columns:1fr}
  .pod{max-width:none}
}

/* =========================================================================
   PÁGINA DE FIRMA DEL CLIENTE  ·  firmar.html
   Fondo claro y sobrio: quien la abre es un cliente que va a firmar un
   contrato, no un comercial usando el panel. Nada de modo oscuro aquí.
   ====================================================================== */
html,body{background:#F1F5F9}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color:#0F172A;margin:0;padding:0;line-height:1.6;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}

.fx-wrap{max-width:820px;margin:0 auto;padding:18px 14px 60px;display:flex;
  flex-direction:column;gap:16px}

/* ------------------------------ cabecera ------------------------------- */
.fx-cab{background:#FFFFFF;border:1px solid #E2E8F0;border-radius:14px;padding:18px}
.fx-marca{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.fx-mini{font-size:11.5px;color:#64748B;line-height:1.55}
.fx-nota{font-size:13.5px;color:#475569;border-top:1px solid #E2E8F0;padding-top:12px}
.fx-nota strong{color:#0F172A}

/* --------------------------- cajas de estado --------------------------- */
.fx-caja{background:#FFFFFF;border:1px solid #E2E8F0;border-radius:14px;padding:26px 22px;
  text-align:center}
.fx-caja h2{font-size:19px;margin:0 0 8px;color:#0F172A}
.fx-caja p{font-size:14px;color:#475569;margin:0;max-width:52ch;margin-inline:auto}
.fx-caja.ok{border-color:#A7F3D0;background:linear-gradient(180deg,#ECFDF5,#FFFFFF 65%)}
.fx-caja.ok h2{color:#047857}
.fx-caja.espera h2{color:#475569;font-weight:600}
.fx-caja .fx-boton{max-width:280px;margin:18px auto 0}

/* --------------------------- panel de firma ---------------------------- */
.fx-panel{background:#FFFFFF;border:1px solid #E2E8F0;border-radius:14px;padding:22px}
.fx-panel h2{font-size:17px;margin:0 0 16px;color:#0F172A}
.fx-campos{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.fx-panel label{display:block;font-size:12.5px;font-weight:600;color:#334155}
.fx-panel input[type=text]{display:block;width:100%;margin-top:6px;padding:11px 12px;
  font-size:15px;font-family:inherit;color:#0F172A;background:#F8FAFC;
  border:1px solid #CBD5E1;border-radius:10px}
.fx-panel input[type=text]:focus{outline:2px solid #0F766E;outline-offset:1px;
  border-color:#0F766E;background:#FFFFFF}

.fx-lienzo-cab{display:flex;justify-content:space-between;align-items:baseline;
  font-size:12.5px;font-weight:600;color:#334155;margin-bottom:6px}
.fx-link{background:none;border:none;padding:0;font:inherit;font-size:12.5px;
  font-weight:600;color:#0F766E;cursor:pointer;text-decoration:underline}
.fx-lienzo{width:100%;height:150px;display:block;background:#F8FAFC;
  border:1px dashed #94A3B8;border-radius:10px;touch-action:none;cursor:crosshair}

.fx-check{display:flex!important;gap:11px;align-items:flex-start;margin:18px 0;
  font-size:12.5px;font-weight:400!important;color:#475569;line-height:1.6}
.fx-check input{width:20px;height:20px;flex:0 0 auto;margin-top:1px;accent-color:#0F766E}

.fx-boton{display:block;width:100%;padding:15px;font:inherit;font-size:15.5px;
  font-weight:700;color:#FFFFFF;background:#0F766E;border:none;border-radius:11px;
  cursor:pointer;transition:background .15s}
.fx-boton:hover:not(:disabled){background:#0B5D57}
.fx-boton:disabled{background:#CBD5E1;color:#64748B;cursor:not-allowed}
.fx-aviso{margin-top:12px;padding:11px 13px;border-radius:10px;font-size:13px;
  background:#FEF2F2;border:1px solid #FECACA;color:#991B1B}

/* Firma ya trazada dentro del documento */
.doc.pdf .firma.trazada{border-bottom:1px solid #94A3B8;display:flex;align-items:flex-end;
  justify-content:center;overflow:hidden}
.doc.pdf .firma.trazada img{max-height:56px;max-width:100%;object-fit:contain}
.ct-sello{margin-top:14px;padding:11px 13px;border-radius:8px;font-size:11.5px;
  color:#0F766E;background:#F0FDFA;border:1px solid #99F6E4;line-height:1.6}

@media(max-width:620px){
  .fx-campos{grid-template-columns:1fr}
  .fx-wrap{padding:12px 10px 48px}
  .doc.pdf{padding:20px 16px}
}

@media print{
  .fx-cab,.fx-panel,.fx-caja{display:none!important}
  .fx-wrap{padding:0;max-width:none}
  body{background:#FFFFFF}
  .doc.pdf{border:none!important;padding:0!important}
}
</style>

/* --------------------------- LOGOTIPO TIPOGRÁFICO ----------------------- */
/* «Labs24K» con el degradado de marca. Va en SVG y no en HTML porque el
   recorte de degradado sobre texto (background-clip) se pierde al imprimir en
   varios navegadores, y estas letras acaban en propuestas y presupuestos. */
function marcaTexto(alto, claro){
  var id = 'mt' + (++_logoN);
  /* La caja se ajusta a la altura real de las letras: «Labs24K» no tiene
     ningún trazo descendente, así que recortar el hueco de abajo hace que el
     logotipo se alinee solo con el isotipo, sin cuadrar márgenes a mano. */
  var ancho = Math.round(alto * 5);
  /* textLength fija el ancho del logotipo: aunque el ordenador del cliente no
     tenga Roboto y caiga en Arial o en la fuente del sistema, la marca ocupa
     exactamente lo mismo y no se recorta ni baila. Es la diferencia entre un
     logotipo y un texto que casualmente pone el nombre. */
  return '<svg class="marca-txt" width="'+ancho+'" height="'+alto+'" viewBox="0 0 420 84" '+
    'role="img" aria-label="Labs24K">'+
    '<defs>'+_grad(id, claro, 0, 0, 420, 0)+'</defs>'+
    '<text x="4" y="76" fill="url(#'+id+')" font-size="96" font-weight="800" '+
      'textLength="412" lengthAdjust="spacingAndGlyphs" '+
      'font-family="Roboto,\'Segoe UI\',system-ui,-apple-system,'+
      'Helvetica,Arial,sans-serif">Labs24K</text></svg>';
}

/* ------------------------------ BLOQUE COMPLETO ------------------------- */
/* opc.lema  añade el lema debajo · opc.claro  versión para fondo claro
   opc.fila  isotipo y texto en horizontal (por defecto) o apilados */
function logotipo(alto, opc){
  opc = opc || {};
  var iso = logo(Math.round(alto * (opc.lema ? 1.05 : 1)), opc.claro);
  var txt = marcaTexto(Math.round(alto * 0.52), opc.claro);
  var lema = opc.lema
    ? '<div class="marca-lema'+(opc.claro?' claro':'')+'">'+esc(MARCA.lema)+'</div>' : '';
  return '<div class="marca'+(opc.apilado?' apilada':'')+'">'+
    iso + '<div class="marca-col">' + txt + lema + '</div></div>';
}

function eur(n){ return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0,useGrouping:true}).format(n); }
function num(n){ return new Intl.NumberFormat('es-ES',{useGrouping:true}).format(n); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
/* Solo se acepta https://. Corta javascript: y data: si alguien manipula la
   configuracion guardada en el navegador. */
function urlSegura(u){
  u = String(u||'').trim();
  return /^https:\/\/[a-z0-9.-]+\.[a-z]{2,}([/?#].*)?$/i.test(u) ? u : '';
}
function q(s){ return document.querySelector(s); }
function qa(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
/* los avisos se guardan aparte: renderApp() reescribe el body y los borraria */
var TOASTS = [];
function toast(msg){
  var t = document.createElement('div'); t.className='toast'; t.innerHTML = ic('check',16)+' '+esc(msg);
  t.style.display='flex'; t.style.alignItems='center'; t.style.gap='9px';
  TOASTS.push(t); document.body.appendChild(t);
  setTimeout(function(){
    t.remove();
    var i = TOASTS.indexOf(t); if(i>-1) TOASTS.splice(i,1);
  }, 3600);
}
function reponerToasts(){
  TOASTS.forEach(function(t, i){
    t.style.bottom = (20 + i*58) + 'px';
    document.body.appendChild(t);
  });
}
function delta(v){
  var up = v >= 0;
  return '<span class="delta '+(up?'up':'down')+'">'+ic(up?'arrowUp':'arrowDown',11)+(up?'+':'')+v+'%</span>';
}

/* ------------------------------ GRAFICOS SVG ---------------------------- */
function areaChart(data, opt){
  opt = opt || {}; var w = 100, h = opt.h || 34, pad = 2;
  var max = Math.max.apply(null,data), min = Math.min.apply(null,data);
  var rng = (max-min)||1, id = 'g'+Math.random().toString(36).slice(2,8);
  var col = opt.color || '#4ADE80';
  var pts = data.map(function(v,i){
    var x = (i/(data.length-1))*w;
    var y = h-pad-((v-min)/rng)*(h-pad*2);
    return [x,y];
  });
  var line = pts.map(function(p,i){ return (i?'L':'M')+p[0].toFixed(2)+' '+p[1].toFixed(2); }).join(' ');
  var area = line+' L'+w+' '+h+' L0 '+h+' Z';
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="width:100%;height:'+(opt.px||70)+'px">'+
    '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+col+'" stop-opacity=".38"/>'+
    '<stop offset="100%" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#'+id+')"/>'+
    '<path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="1.4" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>'+
    '</svg>';
}
function barChart(data, labels, opt){
  opt = opt||{}; var col = opt.color||'#FBBF24', h = opt.px||120;
  var max = Math.max.apply(null,data)||1;
  var bars = data.map(function(v,i){
    var pct = Math.max(4,(v/max)*100);
    return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0">'+
      '<div style="width:100%;height:'+h+'px;display:flex;align-items:flex-end">'+
      '<div title="'+esc(labels[i]+': '+num(v))+'" style="width:100%;height:'+pct.toFixed(1)+'%;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,'+col+',rgba(0,0,0,0));opacity:'+(0.55+0.45*(v/max)).toFixed(2)+'"></div></div>'+
      '<span style="font-size:10px;color:var(--txt-3)" class="trunc">'+esc(labels[i])+'</span></div>';
  }).join('');
  return '<div style="display:flex;align-items:flex-end;gap:6px">'+bars+'</div>';
}
function donut(pct, color, size, label){
  size = size||64; color = color||'#17C8C0';
  var r = 26, c = 2*Math.PI*r, off = c*(1-pct/100);
  return '<div style="position:relative;width:'+size+'px;height:'+size+'px">'+
    '<svg width="'+size+'" height="'+size+'" viewBox="0 0 64 64" style="transform:rotate(-90deg)">'+
    '<circle cx="32" cy="32" r="'+r+'" fill="none" stroke="rgba(148,163,184,.16)" stroke-width="7"/>'+
    '<circle cx="32" cy="32" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="7" stroke-linecap="round" '+
    'stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg>'+
    '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:'+(size/4.6).toFixed(0)+'px;font-weight:700;color:#fff">'+(label||pct+'%')+'</div></div>';
}
function progressRow(name, val, max, color, right){
  var pct = Math.min(100,(val/max)*100);
  return '<div class="rank-it"><div style="flex:1;min-width:0">'+
    '<div style="display:flex;justify-content:space-between;margin-bottom:6px">'+
    '<span class="nm trunc">'+esc(name)+'</span><span class="vl">'+esc(right!=null?right:num(val))+'</span></div>'+
    '<div class="bar"><i style="width:'+pct.toFixed(1)+'%;background:'+(color||'#17C8C0')+'"></i></div></div></div>';
}

/* Calculo del precio a partir de la base imponible y el tipo de IVA. */
function ctrCuentas(C){
  var base = Number(C.base) || 0;
  var iva  = Number(C.iva); if(isNaN(iva)) iva = 21;
  var mes  = Number(C.mensual) || 0;
  var ivaImporte = base * iva / 100;
  var total = base + ivaImporte;
  return {base:base, mes:mes, tipoIva:iva, ivaImporte:ivaImporte,
          total:total, mitad:total/2, mesConIva:mes*(1+iva/100)};
}

/* Fecha del encabezamiento: «a 5 de septiembre de 2026». */

  var d = C && C.fecha ? new Date(C.fecha + 'T12:00:00') : null;

  return {dia:d.getDate(), mes:MESES_ES[d.getMonth()], anio:d.getFullYear()};

/* ==========================================================================
   PÁGINA DE FIRMA DEL CLIENTE  ·  firmar.html
   La abre el cliente desde el enlace que le llega por WhatsApp o correo. No
   tiene cuenta ni contraseña: lo único que le identifica es el token de la
   dirección, que caduca y solo sirve una vez.

   Esta página NO da acceso a nada del panel: habla con dos funciones de la
   base de datos que solo devuelven el contrato de ese token.
   ========================================================================== */

var F = {
  token:null, datos:null, error:null, cargando:true,
  paso:'contrato',          // contrato · datos · firma · hecho
  nombre:'', dni:'', acepta:false, trazos:0, enviando:false, ts:null
};

/* --------------------------- CONEXIÓN ---------------------------------- */
/* El proyecto es el de _sb.js. Si en ESTE navegador el panel apunta a otro
   (un proyecto de pruebas), se respeta: es la misma configuración y el mismo
   origen. En el móvil de un cliente esa preferencia no existe y se usa el
   proyecto de producción. */
function firmaProyecto(){
  try{
    var g = JSON.parse(localStorage.getItem('labs24k.supabase') || 'null');
    if(g && g.url && g.clave) return g;
  }catch(e){}
  return SB_DEFECTO;
}

function firmaRpc(fn, args){
  var P = firmaProyecto();
  return fetch(P.url + '/rest/v1/rpc/' + fn, {
    method:'POST',
    headers:{'Content-Type':'application/json',
             'apikey': P.clave,
             'Authorization':'Bearer ' + P.clave},
    body: JSON.stringify(args || {})
  }).then(function(r){
    return r.text().then(function(t){
      var j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){}
      if(!r.ok) throw new Error((j && (j.message || j.hint)) || ('HTTP ' + r.status));
      return j;
    });
  });
}

/* Huella del texto que el cliente tiene delante al firmar. Si algún día se
   discute qué firmó exactamente, esto lo resuelve. */
function huellaTexto(txt){
  if(!(window.crypto && window.crypto.subtle)) return Promise.resolve(null);
  return window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt))
    .then(function(b){
      return Array.prototype.map.call(new Uint8Array(b), function(x){
        return ('0' + x.toString(16)).slice(-2); }).join('');
    }).catch(function(){ return null; });
}

/* Traduce lo que devuelve la base de datos al objeto que entiende
   contratoHTML(). */
function firmaContrato(){
  var d = F.datos || {}, x = d.datos || {};
  return {
    ciudad: x.ciudad || '', fecha: (d.fecha || '').slice(0,10),
    cliente: d.cliente || '', cif: d.cif || '', dir: d.dir || '',
    rep: F.nombre || d.rep || '', dni: F.dni || '',
    mail: d.mail || '', tel: d.tel || '',
    refPresu: x.refPresu || '', base: Number(d.base) || 0,
    iva: d.iva === null || d.iva === undefined ? 21 : Number(d.iva),
    iban: x.iban || '', plazo: x.plazo || '',
    servicio: d.servicio || '', mensual: Number(d.mensual) || 0,
    anexo: x.anexo || '', firmanteLabs: x.firmanteLabs || '', obs: x.obs || ''
  };
}

/* ------------------------------ PINTADO --------------------------------- */
function pintaFirma(){
  var app = document.getElementById('app');

  if(F.cargando){ app.innerHTML = cajaMensaje('Cargando el contrato...', '', 'espera'); return; }

  if(F.error){ app.innerHTML = cajaError(F.error); return; }

  if(F.paso === 'hecho'){
    app.innerHTML =
      '<div class="fx-wrap">'+ cajaHecho() +
      '<div class="doc pdf contrato">'+'</div></div>';
    var caja = app.querySelector('.doc');
    caja.outerHTML = contratoHTML(firmaContrato(), {
      codigo: F.datos.codigo, firma: F.firmaImg,
      sello: 'Firmado electrónicamente por ' + F.nombre + ' (DNI ' + F.dni + ') el ' +
             new Date(F.ts || Date.now()).toLocaleString('es-ES') +
             ' · contrato ' + F.datos.codigo
    });
    var imp = document.getElementById('fx-imprimir');
    if(imp) imp.onclick = function(){ window.print(); };
    return;
  }

  app.innerHTML =
    '<div class="fx-wrap">'+
      cabeceraFirma()+
      '<div class="doc pdf contrato" id="fx-doc"></div>'+
      panelFirma()+
    '</div>';

  document.getElementById('fx-doc').outerHTML =
    contratoHTML(firmaContrato(), {codigo: F.datos.codigo});

  eventosFirma();
}

/* ------------------------- LIENZO DE FIRMA ------------------------------ */
function montaLienzo(){
  var c = document.getElementById('fx-lienzo');
  if(!c) return;
  var r = window.devicePixelRatio || 1;
  var ancho = c.clientWidth || 320, alto = 150;
  c.width = ancho * r; c.height = alto * r; c.style.height = alto + 'px';
  var g = c.getContext('2d');
  g.scale(r, r);
  g.lineWidth = 2.2; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#0F172A';
  if(F.firmaImg){                        // repintar tras un renderizado
    var im = new Image();
    im.onload = function(){ g.drawImage(im, 0, 0, ancho, alto); };
    im.src = F.firmaImg;
  }

  var pintando = false;
  function punto(e){
    var b = c.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    return {x: t.clientX - b.left, y: t.clientY - b.top};
  }
  function empieza(e){ e.preventDefault(); pintando = true;
    var p = punto(e); g.beginPath(); g.moveTo(p.x, p.y); }
  function mueve(e){ if(!pintando) return; e.preventDefault();
    var p = punto(e); g.lineTo(p.x, p.y); g.stroke(); }
  function termina(){
    if(!pintando) return;
    pintando = false;
    F.firmaImg = c.toDataURL('image/png');
    var antes = F.trazos; F.trazos++;
    if(!antes) refrescaBoton();
  }

  c.addEventListener('mousedown', empieza);
  c.addEventListener('mousemove', mueve);
  window.addEventListener('mouseup', termina);
  c.addEventListener('touchstart', empieza, {passive:false});
  c.addEventListener('touchmove', mueve, {passive:false});
  c.addEventListener('touchend', termina);

  var lim = document.getElementById('fx-limpiar');
  if(lim) lim.onclick = function(){
    g.clearRect(0, 0, c.width, c.height);
    F.trazos = 0; F.firmaImg = null; refrescaBoton();
  };
}

function refrescaBoton(){
  var b = document.getElementById('fx-firmar');
  if(!b) return;
  b.disabled = !(F.nombre.trim().length > 2 && F.dni.trim().length > 7 &&
                 F.trazos > 0 && F.acepta) || F.enviando;
}

/* ------------------------------ EVENTOS --------------------------------- */
function eventosFirma(){
  montaLienzo();
  var n = document.getElementById('fx-nombre');
  var d = document.getElementById('fx-dni');
  var a = document.getElementById('fx-acepta');
  if(n) n.oninput = function(){ F.nombre = n.value; refrescaBoton(); };
  if(d) d.oninput = function(){ F.dni = d.value; refrescaBoton(); };
  if(a) a.onchange = function(){ F.acepta = a.checked; refrescaBoton(); };

  var b = document.getElementById('fx-firmar');
  if(b) b.onclick = function(){
    if(b.disabled) return;
    F.enviando = true; F.aviso = ''; b.disabled = true; b.textContent = 'Enviando...';

    var doc = document.querySelector('.doc.pdf.contrato');
    huellaTexto(doc ? doc.innerText : '').then(function(huella){
      return firmaRpc('firma_contrato', {
        p_token: F.token, p_nombre: F.nombre.trim(), p_dni: F.dni.trim(),
        p_firma: F.firmaImg, p_huella: huella, p_datos: {}
      });
    }).then(function(r){
      F.enviando = false;
      if(r && r.error){ F.aviso = mensajeError(r.error); pintaFirma(); return; }
      F.ts = (r && r.ts) || new Date().toISOString();
      F.paso = 'hecho'; pintaFirma();
      window.scrollTo(0, 0);
    }).catch(function(){
      F.enviando = false;
      F.aviso = 'No se ha podido enviar la firma. Comprueba tu conexión y vuelve a intentarlo.';
      pintaFirma();
    });
  };
}

function mensajeError(e){
  var M = {'falta-nombre':'Escribe tu nombre y apellidos completos.',
           'falta-dni':'Revisa el DNI: parece incompleto.',
           'falta-firma':'Dibuja tu firma en el recuadro antes de enviar.',
           'firma-demasiado-grande':'La firma ha salido demasiado grande. Bórrala y hazla más simple.',
           'ya-firmado':'Este contrato ya estaba firmado.',
           'caducado':'El enlace ha caducado. Pide uno nuevo a Labs24k.',
           'anulado':'Este contrato está anulado.',
           'no-existe':'El enlace no es válido.'};
  return M[e] || 'No se ha podido registrar la firma.';
}

/* ------------------------------ ARRANQUE -------------------------------- */
function arrancaFirma(){
  var m = /[#&?]t=([0-9a-f-]{36})/i.exec(window.location.hash || window.location.search);
  F.token = m ? m[1] : null;
  if(!F.token){ F.cargando = false; F.error = 'sin-token'; pintaFirma(); return; }
  pintaFirma();

  firmaRpc('contrato_para_firma', {p_token: F.token})
    .then(function(r){
      F.cargando = false;
      if(!r || r.error){ F.error = (r && r.error) || 'no-existe'; pintaFirma(); return; }
      F.datos = r;
      F.nombre = r.rep || '';
      pintaFirma();
    })
    .catch(function(){ F.cargando = false; F.error = 'red'; pintaFirma(); });
}

document.addEventListener('DOMContentLoaded', arrancaFirma);
window.addEventListener('resize', function(){
  clearTimeout(window.__fxR);
  window.__fxR = setTimeout(function(){ if(F.paso === 'contrato' && F.datos) montaLienzo(); }, 200);
});
