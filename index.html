/* ============================== EVENTOS ================================= */
function leeFicha(){
  var u = USU.draft; if(!u) return;
  function v(id){ var e = q(id); return e ? e.value : null; }
  if(q('#fi-nom')){
    u.nom = v('#fi-nom'); u.ape = v('#fi-ape'); u.n = (u.nom+' '+u.ape).trim();
    u.pre = v('#fi-pre'); u.num = v('#fi-num'); u.ext = v('#fi-ext');
    // En la cuenta de raíz estos dos campos no se dibujan: se dejan como están.
    if(q('#fi-mail')) u.mail = v('#fi-mail');
    if(q('#fi-est'))  u.est  = v('#fi-est');
  }
  if(q('#fl-ext')){
    u.pref.llam.ext = v('#fl-ext'); u.pref.llam.desvio = v('#fl-des');
    u.pref.llam.saludo = v('#fl-sal');
  }
  if(q('#fd-ini')){
    u.pref.disp.ini = v('#fd-ini'); u.pref.disp.fin = v('#fd-fin');
    u.pref.disp.zona = v('#fd-zona');
  }
  if(q('#fc-dur')){
    u.pref.cal.dur = parseInt(v('#fc-dur'),10) || 30;
    u.pref.cal.margen = parseInt(v('#fc-mar'),10) || 0;
    u.pref.cal.antel = parseInt(v('#fc-ant'),10) || 0;
    u.pref.cal.enlace = v('#fc-enl');
  }
}
function refrescaFicha(){ leeFicha(); setTimeout(renderApp,0); }

function detalleEventos(){
  if(!USU.det || !q('.ficha')) return;
  var u = USU.draft;

  qa('[data-ftab]').forEach(function(b){ b.onclick = function(){
    leeFicha(); USU.tab = b.dataset.ftab; renderApp(); }; });
  q('#ft-x').onclick = function(){ USU.det = null; USU.draft = null; renderApp(); };
  q('#ft-cancel').onclick = function(){ USU.det = null; USU.draft = null;
    toast('Cambios descartados.'); renderApp(); };

  qa('[data-cp]').forEach(function(b){ b.onclick = function(e){
    e.stopPropagation(); copia(b.dataset.cp, 'Copiado al portapapeles.'); }; });

  /* --- información --- */
  ['#fi-nom','#fi-ape','#fi-mail','#fi-pre','#fi-num','#fi-ext'].forEach(function(id){
    if(q(id)) q(id).onchange = function(){ leeFicha(); }; });
  if(q('#fi-est')) q('#fi-est').onchange = function(){ refrescaFicha(); };

  if(q('#ft-foto')) q('#ft-foto').onchange = function(){
    var f = this.files && this.files[0]; if(!f) return;
    if(!/^image\/(png|jpeg|webp)$/.test(f.type)){ toast('Solo se admiten PNG, JPG o WebP.'); return; }
    if(f.size > AV_MAX){ toast('La imagen pesa '+(f.size/1048576).toFixed(1)+' MB. El máximo son 2,5 MB.'); return; }
    var r = new FileReader();
    r.onload = function(){ leeFicha(); USU.draft.avatar = r.result;
      toast('Foto cargada. Recuerda guardar los cambios.'); renderApp(); };
    r.onerror = function(){ toast('No se ha podido leer la imagen.'); };
    r.readAsDataURL(f);
  };
  if(q('#ft-foto-x')) q('#ft-foto-x').onclick = function(){
    leeFicha(); USU.draft.avatar = null; renderApp(); };

  /* --- permisos --- */
  if(q('#fp-rol')) q('#fp-rol').onchange = function(){
    u.rol = this.value; u.perms = permisosDeRol(u.rol);
    toast('Permisos reescritos con los de fábrica del rol '+ROLES[u.rol].label+'.');
    setTimeout(renderApp,0); };
  if(q('#fp-reset')) q('#fp-reset').onclick = function(){
    u.perms = permisosDeRol(u.rol); toast('Excepciones eliminadas.'); renderApp(); };
  qa('[data-perm]').forEach(function(el){ el.onclick = function(){
    if(esRaiz(u)){ toast(vetoRaiz(u,'permisos')); return; }
    if(u.rol === 'admin'){ toast('El administrador conserva todos los permisos.'); return; }
    var k = el.dataset.perm; u.perms[k] = !u.perms[k]; renderApp(); }; });

  /* --- interruptores --- */
  qa('[data-sw]').forEach(function(el){ el.onclick = function(){
    var id = el.dataset.sw, p = u.pref;
    leeFicha();
    if(id==='fl-grabar') p.llam.grabar = !p.llam.grabar;
    if(id==='fl-buzon')  p.llam.buzon  = !p.llam.buzon;
    if(id==='fn-correo') p.notif.correo = !p.notif.correo;
    if(id==='fn-push')   p.notif.push   = !p.notif.push;
    if(id==='fn-wsp')    p.notif.wsp    = !p.notif.wsp;
    if(id==='fn-resumen')p.notif.resumen= !p.notif.resumen;
    if(id==='fn-altas')  p.notif.altas  = !p.notif.altas;
    if(id==='fn-incidencias') p.notif.incidencias = !p.notif.incidencias;
    if(id==='fs-cambiar') u.cambiar = !u.cambiar;
    if(id==='fs-2fa')     u.dobleF  = !u.dobleF;
    if(id==='fs-google')  u.google  = !u.google;
    renderApp(); }; });

  qa('[data-dia]').forEach(function(b){ b.onclick = function(){
    leeFicha(); var d = b.dataset.dia;
    u.pref.disp.dias[d] = !u.pref.disp.dias[d]; renderApp(); }; });

  /* --- seguridad --- */
  if(q('#fs-tok-ver')) q('#fs-tok-ver').onclick = function(){
    USU.verTok = !USU.verTok; renderApp(); };
  if(q('#fs-tok-rot')) q('#fs-tok-rot').onclick = function(){
    u.tok = tokenApi(); USU.verTok = true;
    toast('Token rotado. Guarda los cambios para aplicarlo.'); renderApp(); };
  if(q('#fs-cerrar-todo')) q('#fs-cerrar-todo').onclick = function(){
    u.ses = []; toast('Sesiones cerradas al guardar.'); renderApp(); };
  qa('[data-ses]').forEach(function(b){ b.onclick = function(){
    u.ses.splice(parseInt(b.dataset.ses,10), 1); renderApp(); }; });
  if(q('#fs-clave')) q('#fs-clave').onclick = function(){
    var real = usuarioPorId(u.id);
    real.pass = claveFuerte(); real.cambiar = true; real.ses = [];
    u.pass = real.pass; u.cambiar = true; u.ses = [];
    auditar(real, 'Contraseña restablecida', 'Restablecida desde la ficha del usuario. Sesiones cerradas.');
    USU.creado = real; USU.aviso = 'Contraseña restablecida'; renderApp(); };

  /* --- guardar --- */
  q('#ft-save').onclick = function(){
    leeFicha();
    var real = usuarioPorId(u.id), cambios = [];
    /* Red de seguridad: por mucho que se haya tocado el borrador, la raíz sale
       de aquí activa, administradora, con su correo y con todos los permisos.
       Igual que hace el servidor antes de guardar. */
    if(esRaiz(real)){
      u.est = 'Activo'; u.rol = 'admin'; u.mail = real.mail;
      u.perms = permisosDeRol('admin'); u.dobleF = true;
    }
    if(!u.nom || u.nom.trim().length < 2){ toast('El nombre es obligatorio.'); return; }
    if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(String(u.mail).trim())){
      toast('El correo no tiene un formato válido.'); return; }
    var otro = usuarioPorMail(u.mail);
    if(otro && otro.id !== u.id){ toast('Ya existe otra cuenta con ese correo.'); return; }
    if(u.pre && !/^\+\d{1,3}$/.test(String(u.pre).trim())){
      toast('El prefijo debe ser internacional, como +34.'); return; }
    if(u.pref.cal.enlace && !urlSegura(u.pref.cal.enlace)){
      toast('El enlace de reserva debe ser una dirección https válida.'); return; }
    if(real.rol === 'admin' && (u.rol !== 'admin' || u.est !== 'Activo') && adminsActivos() <= 1){
      toast('No puedes dejar el sistema sin ningún administrador activo.'); return; }

    if(real.n !== (u.nom+' '+u.ape).trim()) cambios.push('nombre');
    if(real.mail !== String(u.mail).toLowerCase().trim()) cambios.push('correo');
    if(real.rol !== u.rol) cambios.push('rol → '+ROLES[u.rol].label);
    if(real.est !== u.est) cambios.push('estado → '+u.est);
    if(real.google !== u.google) cambios.push(u.google ? 'Google autorizado' : 'Google revocado');
    if(real.dobleF !== u.dobleF) cambios.push(u.dobleF ? 'doble factor activado' : 'doble factor desactivado');
    if(real.tok !== u.tok) cambios.push('token de API rotado');
    if(real.ses.length !== u.ses.length) cambios.push('sesiones cerradas');
    var dif = todasLasClaves().filter(function(k){ return !!real.perms[k] !== !!u.perms[k]; });
    if(dif.length) cambios.push(dif.length+' permiso'+(dif.length>1?'s':'')+' modificado'+(dif.length>1?'s':''));

    real.nom = u.nom.trim(); real.ape = String(u.ape||'').trim();
    real.n = (real.nom+' '+real.ape).trim();
    real.mail = String(u.mail).toLowerCase().trim();
    real.pre = String(u.pre||'+34').trim(); real.num = String(u.num||'').trim();
    real.tel = (real.pre+' '+real.num).trim(); real.ext = String(u.ext||'').trim();
    real.est = u.est; real.rol = u.rol; real.google = u.google; real.dobleF = u.dobleF;
    real.cambiar = u.cambiar; real.avatar = u.avatar; real.tok = u.tok;
    real.perms = u.perms; real.pref = u.pref;
    real.ses = (real.est === 'Activo') ? u.ses : [];

    /* Con Supabase conectado, la base de datos manda: si un disparador
       reimpone algo —los permisos de la raíz, por ejemplo— la ficha vuelve
       con ese valor y es el que se queda. */
    sbGuardaUsuario(real).then(function(r){
      if(!r.ok){ toast(r.mensaje); return; }
      auditar(real, cambios.length ? 'Ficha actualizada' : 'Ficha revisada sin cambios',
              cambios.length ? cambios.join(', ') : '');
      USU.det = null; USU.draft = null;
      toast(cambios.length ? 'Ficha de '+real.n+' actualizada.' : 'No había cambios que guardar.');
      renderApp();
    });
  };
}

/* ==========================================================================
   CONEXIÓN CON SUPABASE
   Labs Command Center 360™ · Labs24k

   Sin librerías ni CDN: todo con fetch nativo contra la API REST y la de
   autenticación de Supabase. Así el panel sigue siendo un único archivo, la
   CSP puede seguir prohibiendo scripts externos y no hay nada que actualizar.

   Qué hace cada clave:
     · publicable (sb_publishable_…)  va en el navegador, es pública a
       propósito y NO da acceso a nada por sí sola: cada consulta la filtran
       las políticas RLS según el rol de quien ha iniciado sesión.
     · de servicio (sb_secret_…)      se salta las políticas. Vive únicamente
       en la Edge Function, nunca aquí.

   Si no hay conexión —proyecto sin montar, sin red, credenciales mal— el
   panel sigue funcionando con los datos de ejemplo y lo dice claramente.
   ========================================================================== */

/* SB_DEFECTO vive en _sb.js: lo comparten el panel y la pagina de firma del
   cliente, para que la direccion del proyecto no pueda quedar duplicada y
   descoordinada entre las dos. */
var SB = {
  url: '', clave: '', activo: true,
  sesion: null,          // {access_token, refresh_token, expires_at}
  perfil: null,          // fila de perfiles del usuario que ha entrado
  estado: 'sin probar',  // sin probar · conectado · sin conexión · demostración
  detalle: '',
  cargando: false
};

var SB_LS_CFG = 'labs24k.supabase', SB_LS_SES = 'labs24k.sesion';

function sbGuardaLocal(clave, valor){
  try { localStorage.setItem(clave, JSON.stringify(valor)); } catch(e){}
}
function sbLeeLocal(clave){
  try { var v = localStorage.getItem(clave); return v ? JSON.parse(v) : null; } catch(e){ return null; }
}

function sbCfgCarga(){
  var g = sbLeeLocal(SB_LS_CFG) || {};
  SB.url    = g.url    || SB_DEFECTO.url;
  SB.clave  = g.clave  || SB_DEFECTO.clave;
  SB.activo = g.activo === undefined ? SB_DEFECTO.activo : !!g.activo;
  SB.sesion = sbLeeLocal(SB_LS_SES);
}
function sbCfgGuarda(){
  sbGuardaLocal(SB_LS_CFG, {url:SB.url, clave:SB.clave, activo:SB.activo});
}
function sbConfigurado(){
  var u = String(SB.url||'').trim();
  /* Proyecto en la nube, o el Supabase local que levanta la CLI durante el
     desarrollo (supabase start → http://localhost:54321). */
  var valida = /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(u) ||
               /^http:\/\/(localhost|127\.0\.0\.1):\d{2,5}$/.test(u);
  return SB.activo && valida && String(SB.clave||'').length > 20;
}

/* ---------------------------- LLAMADAS BASE ----------------------------- */
function sbCabeceras(conSesion){
  var h = {'apikey': SB.clave, 'Content-Type': 'application/json'};
  if(conSesion !== false && SB.sesion && SB.sesion.access_token){
    h['Authorization'] = 'Bearer ' + SB.sesion.access_token;
  } else {
    /* Sin sesión, Supabase espera la clave publicable también en Authorization:
       es lo que hace su propio cliente oficial. Con solo `apikey` algunos
       proyectos responden 401 y parece un fallo de credenciales cuando en
       realidad falta la cabecera. */
    h['Authorization'] = 'Bearer ' + SB.clave;
  }
  return h;
}

/* Envoltorio único de fetch: añade cabeceras, corta a los 15 s y traduce el
   error de red a algo legible. Nada de excepciones sueltas por el código. */
function sbFetch(ruta, opciones){
  opciones = opciones || {};
  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var corte = ctrl ? setTimeout(function(){ ctrl.abort(); }, 15000) : null;

  return fetch(SB.url + ruta, {
    method: opciones.method || 'GET',
    headers: Object.assign(sbCabeceras(opciones.conSesion), opciones.headers || {}),
    body: opciones.body ? JSON.stringify(opciones.body) : undefined,
    signal: ctrl ? ctrl.signal : undefined
  }).then(function(r){
    if(corte) clearTimeout(corte);
    return r.text().then(function(t){
      var datos = null;
      try { datos = t ? JSON.parse(t) : null; } catch(e){ datos = {mensaje:t}; }
      return {ok: r.ok, estado: r.status, datos: datos};
    });
  }, function(err){
    if(corte) clearTimeout(corte);
    return {ok:false, estado:0, datos:{message:
      err && err.name === 'AbortError' ? 'La conexión ha tardado demasiado.'
                                       : 'No se ha podido contactar con Supabase.'}};
  });
}

/* Mensaje de error presentable a partir de lo que devuelve Supabase. */
function sbMensaje(r){
  var d = r && r.datos;
  if(!d) return 'Error desconocido.';
  return d.error_description || d.msg || d.message || d.error || d.hint ||
         d.mensaje || ('Error ' + r.estado);
}

/* Reintenta una vez tras renovar el token si la sesión ha caducado. */
function sbConSesion(hacer){
  return hacer().then(function(r){
    if(r.estado !== 401 || !SB.sesion || !SB.sesion.refresh_token) return r;
    return sbRefresca().then(function(ok){ return ok ? hacer() : r; });
  });
}

/* --------------------------- AUTENTICACIÓN ------------------------------ */
function sbGuardaSesion(d){
  if(!d || !d.access_token){ return false; }
  SB.sesion = {
    access_token:  d.access_token,
    refresh_token: d.refresh_token,
    expira: Date.now() + ((d.expires_in || 3600) * 1000),
    uid: d.user && d.user.id
  };
  sbGuardaLocal(SB_LS_SES, SB.sesion);
  return true;
}
function sbBorraSesion(){
  SB.sesion = null; SB.perfil = null;
  try { localStorage.removeItem(SB_LS_SES); } catch(e){}
}

function sbEntrar(email, password){
  return sbFetch('/auth/v1/token?grant_type=password', {
    method:'POST', conSesion:false, body:{email:email, password:password}
  }).then(function(r){
    if(!r.ok || !sbGuardaSesion(r.datos)){
      return {ok:false, mensaje: r.estado === 400
        ? 'Credenciales incorrectas. Si no recuerdas tu acceso, avisa al administrador.'
        : sbMensaje(r)};
    }
    return {ok:true};
  });
}

function sbRefresca(){
  if(!SB.sesion || !SB.sesion.refresh_token) return Promise.resolve(false);
  return sbFetch('/auth/v1/token?grant_type=refresh_token', {
    method:'POST', conSesion:false, body:{refresh_token: SB.sesion.refresh_token}
  }).then(function(r){
    if(!r.ok || !sbGuardaSesion(r.datos)){ sbBorraSesion(); return false; }
    return true;
  });
}

function sbSalir(){
  var fin = SB.sesion
    ? sbFetch('/auth/v1/logout', {method:'POST'}).then(function(){ return true; },
                                                       function(){ return true; })
    : Promise.resolve(true);
  return fin.then(function(){ sbBorraSesion(); return true; });
}

/* --------------------------- LECTURA Y ESCRITURA ------------------------ */
function sbSelect(tabla, consulta){
  return sbConSesion(function(){
    return sbFetch('/rest/v1/' + tabla + (consulta ? '?' + consulta : ''));
  });
}
function sbUpdate(tabla, filtro, cambios){
  return sbConSesion(function(){
    return sbFetch('/rest/v1/' + tabla + '?' + filtro, {
      method:'PATCH', headers:{'Prefer':'return=representation'}, body:cambios});
  });
}
function sbInsert(tabla, filas){
  return sbConSesion(function(){
    return sbFetch('/rest/v1/' + tabla, {
      method:'POST', headers:{'Prefer':'return=representation'}, body:filas});
  });
}
function sbDelete(tabla, filtro){
  return sbConSesion(function(){
    return sbFetch('/rest/v1/' + tabla + '?' + filtro, {method:'DELETE'});
  });
}
/* Edge Function: lo que necesita la clave de servicio. */
function sbFuncion(ruta, metodo, cuerpo){
  return sbConSesion(function(){
    return sbFetch('/functions/v1/admin-usuarios' + (ruta||''), {
      method: metodo || 'POST', body: cuerpo});
  });
}

    nom: f.nombre || '', ape: f.apellidos || '',

    mail: f.email, pre: f.prefijo || '+34', num: f.telefono || '', ext: f.extension || '',
    tel: ((f.prefijo || '+34') + ' ' + (f.telefono || '')).trim(),
    rol: f.rol, rel: f.rel, est: f.estado,
    google: !!f.google, dobleF: !!f.doble_factor, cambiar: !!f.debe_cambiar,
    avatar: f.avatar_url || null, tok: f.api_token || '',
    modvis: Array.isArray(f.modulos_visibles) ? f.modulos_visibles : null,
    rolPersId: f.rol_personalizado_id || null,
    alta: f.alta ? new Date(f.alta).toLocaleDateString('es-ES') : '',
    ultMs: f.ultimo_acceso ? new Date(f.ultimo_acceso).getTime() : null,

  };
  todasLasClaves().forEach(function(k){ u.perms[k] = !!(f.permisos && f.permisos[k]); });
  var p = f.preferencias || {};
  u.pref = {
    llam: {ext:(p.llamadas&&p.llamadas.extension)||'', desvio:(p.llamadas&&p.llamadas.desvio)||'',
           grabar:!p.llamadas || p.llamadas.grabar !== false,
           buzon:!p.llamadas || p.llamadas.buzon !== false,
           saludo:(p.llamadas&&p.llamadas.saludo)||
             'Has llamado a Labs24k. Deja tu mensaje y te devolvemos la llamada.'},
    disp: {dias:(p.disponibilidad&&p.disponibilidad.dias)||
             {L:true,M:true,X:true,J:true,V:true,S:false,D:false},
           ini:(p.disponibilidad&&p.disponibilidad.desde)||'09:00',
           fin:(p.disponibilidad&&p.disponibilidad.hasta)||'18:00',
           zona:(p.disponibilidad&&p.disponibilidad.zona)||'Europe/Madrid'},
    cal:  {dur:(p.calendario&&p.calendario.duracion)||30,
           margen:(p.calendario&&p.calendario.margen)||10,
           antel:(p.calendario&&p.calendario.antelacion)||4,
           enlace:(p.calendario&&p.calendario.enlace)||''},
    notif:{correo:!p.notificaciones || p.notificaciones.correo !== false,

  u.color = AV_COL[(i||0) % AV_COL.length];

function aFila(u){

    prefijo: u.pre, telefono: u.num, extension: u.ext,

/* --------------------------- CARGA DEL PANEL ---------------------------- */
function sbCargaPerfil(){
  return sbSelect('perfiles', 'id=eq.' + SB.sesion.uid + '&select=*').then(function(r){
    if(!r.ok || !r.datos || !r.datos.length){
      return {ok:false, mensaje: r.estado === 0 ? sbMensaje(r)
        : 'Tu cuenta existe en Supabase pero no tiene ficha en la tabla «perfiles». '+
          'Ejecuta el archivo 02-cuenta-raiz.sql o pide el alta a tu administrador.'};
    }
    SB.perfil = r.datos[0];
    if(SB.perfil.estado !== 'Activo'){
      return {ok:false, mensaje:'Tu cuenta está ' + SB.perfil.estado.toLowerCase() +
        '. Contacta con tu administrador.'};
    }
    return {ok:true};
  });
}

/* Trae el directorio y la bitácora y los deja en las mismas variables que ya
   usaba el panel, para que las vistas no tengan que cambiar. */
function sbCargaDatos(){
  var tareas = [
    sbSelect('perfiles', 'select=*&order=raiz.desc,nombre.asc'),
    sbSelect('bitacora', 'select=*&order=ts.desc&limit=80'),
    sbSelect('sesiones', 'select=*&order=inicio.desc')
  ];
  return Promise.all(tareas).then(function(res){
    var perfiles = res[0], bitacora = res[1], sesiones = res[2];
    if(perfiles.ok && Array.isArray(perfiles.datos) && perfiles.datos.length){
      USUARIOS = perfiles.datos.map(deFila);
      /* Cada sesión abierta se cuelga de su usuario, para que la pestaña de
         seguridad de la ficha muestre los dispositivos de verdad. */
      if(sesiones.ok && Array.isArray(sesiones.datos)){
        sesiones.datos.forEach(function(s){
          var u = USUARIOS.filter(function(x){ return x.id === s.usuario_id; })[0];
          if(u) u.ses.push({id:s.id, d:s.dispositivo || 'Sesión', ip:s.ip || '',
                            loc:s.ubicacion || '', ms:new Date(s.inicio).getTime(),
                            act:true});
        });
      }
    }
    if(bitacora.ok && Array.isArray(bitacora.datos)){
      AUDIT = bitacora.datos.map(function(a){
        return {ts:new Date(a.ts).getTime(), quien:a.actor_nombre || 'sistema',
                rol:a.actor_rol || '', a:a.destino_nombre || '—', aId:a.destino_id || '',
                accion:a.accion, det:a.detalle || ''};
      });
    }
    return true;
  });
}

/* Registra la sesión abierta y, si es la cuenta de raíz, el acceso forense. */
function sbRegistraEntrada(){
  var tareas = [
    sbInsert('sesiones', {usuario_id: SB.perfil.id, dispositivo: navegadorActual(),
                          ubicacion: ''}),
    sbUpdate('perfiles', 'id=eq.' + SB.perfil.id, {ultimo_acceso: new Date().toISOString()})
  ];
  if(SB.perfil.raiz){
    tareas.push(sbInsert('accesos_raiz', {evento:'ENTRADA', usuario:SB.perfil.id,
      email:SB.perfil.email, agente:navegadorActual()}));
  }
  return Promise.all(tareas).then(function(){ return true; }, function(){ return true; });
}

/* ------------------------ ENTRADA COMPLETA AL PANEL --------------------- */
function sbAbrePanel(){
  return sbCargaPerfil().then(function(r){
    if(!r.ok) return r;
    return sbCargaDatos().then(function(){
      SB.estado = 'conectado';
      var u = deFila(SB.perfil, 0);
      var enLista = USUARIOS.filter(function(x){ return x.id === u.id; })[0];
      S.logged = true; S.name = u.n; S.phone = u.tel || (u.pre+' '+u.num).trim();
      S.email = u.mail; S.role = u.rol; S.raiz = u.raiz; S.view = 'dashboard';
      S.modulosVisibles = u.modvis;
      CUENTAS.forEach(function(c){ c.activa = false; });
      if(!CUENTAS.filter(function(c){ return c.mail === u.mail; })[0]){
        CUENTAS.unshift({id:'cu-'+u.id, n:u.n, mail:u.mail, rel:u.rel, rol:u.rol, activa:true});
      }
      sbRegistraEntrada();
      renderApp();
      if((enLista || u).cambiar){
        toast('Tu contraseña es provisional: cámbiala desde tu ficha de usuario.');
      }
      return {ok:true};
    });
  });
}

/* ============================ ARRANQUE ================================== */
function boot(){
  cfgCarga();
  sbCfgCarga();

  if(!sbConfigurado()){
    SB.estado = 'sin conexión';
    renderLogin();
    return;
  }
  if(!SB.sesion){ renderLogin(); return; }

  /* Hay sesión guardada: se comprueba antes de enseñar nada. */
  SB.cargando = true; renderLogin();
  var previo = (SB.sesion.expira && SB.sesion.expira < Date.now() + 60000)
    ? sbRefresca() : Promise.resolve(true);

  previo.then(function(ok){
    if(!ok){ SB.cargando = false; sbBorraSesion(); renderLogin(); return; }
    return sbAbrePanel().then(function(r){
      SB.cargando = false;
      if(!r.ok){ sbBorraSesion(); LOGIN.error = r.mensaje; renderLogin(); }
    });
  }).catch(function(){
    SB.cargando = false; sbBorraSesion();
    SB.estado = 'sin conexión';
    renderLogin();
  });
}

/* ===================== PORTAL DE ACCESO CON SUPABASE ===================== */
function loginEventos(){
  var conectado = sbConfigurado();

  function ocupado(si){
    var b = q('#lg-entrar');
    if(!b) return;
    b.disabled = si;
    b.innerHTML = si ? ic('refresh',16)+' Comprobando...'
                     : ic('logout',16)+' Entrar al Command Center';
  }

  function intenta(){
    var m = q('#lg-mail').value.trim(), p = q('#lg-pass').value;
    LOGIN.mail = m; LOGIN.pass = p;
    if(!m || !p){ LOGIN.error = 'Introduce tu correo corporativo y tu contraseña.'; renderLogin(); return; }

    /* Sin base de datos no hay acceso. No existe ninguna vía alternativa:
       el panel no guarda ni compara contraseñas por su cuenta. */
    if(!conectado){
      LOGIN.error = 'El acceso necesita conexión con la base de datos. '+
        'Si el problema persiste, avisa al administrador.';
      renderLogin(); return;
    }

    ocupado(true);
    /* normalizaMail resuelve los alias de la cuenta de raíz. */
    sbEntrar(normalizaMail(m), p).then(function(r){
      if(!r.ok){
        ocupado(false);
        LOGIN.error = r.mensaje;
        LOGIN.pass = '';
        /* Deja rastro del intento fallido contra la cuenta que lo puede todo. */
        if(normalizaMail(m) === RAIZ_MAIL) registraRaiz('FALLIDO');
        renderLogin();
        return;
      }
      LOGIN.error = ''; LOGIN.pass = '';
      return sbAbrePanel().then(function(res){
        if(!res.ok){ ocupado(false); sbBorraSesion(); LOGIN.error = res.mensaje; renderLogin(); }
      });
    });
  }

  if(q('#lg-form'))   q('#lg-form').onsubmit = function(e){ e.preventDefault(); intenta(); };
  if(q('#lg-entrar')) q('#lg-entrar').onclick = function(e){ e.preventDefault(); intenta(); };
  if(q('#lg-ver'))    q('#lg-ver').onclick = function(){
    LOGIN.mail=q('#lg-mail').value; LOGIN.pass=q('#lg-pass').value;
    LOGIN.ver = !LOGIN.ver; renderLogin(); };

  if(q('#lg-google')) q('#lg-google').onclick = function(){
    /* Google se activa en Supabase: Authentication -> Providers -> Google,
       con la lista blanca de correos de Labs24k. Hasta entonces no se finge
       que funciona ni se abre ninguna vía alternativa. */
    LOGIN.error = conectado
      ? 'El acceso con Google se activa en Supabase (Authentication → Providers → Google).'
      : 'El acceso necesita conexión con la base de datos.';
    renderLogin();
  };

  if(q('#lg-olvido')) q('#lg-olvido').onclick = function(){
    LOGIN.error=''; LOGIN.vista='olvido'; renderLogin(); };
  if(q('#ol-volver')) q('#ol-volver').onclick = function(){
    LOGIN.error=''; LOGIN.vista='acceso'; renderLogin(); };
  if(q('#ol-env')) q('#ol-env').onclick = function(){
    var m = q('#ol-mail').value.trim();
    if(!m){ LOGIN.error='Escribe tu correo corporativo.'; renderLogin(); return; }
    LOGIN.error=''; LOGIN.vista='acceso'; renderLogin();
    /* Mismo mensaje exista o no la cuenta: no se revela quién está dado de alta. */
    if(conectado){
      sbFetch('/auth/v1/recover', {method:'POST', conSesion:false, body:{email:normalizaMail(m)}});
    }
    toast('Si esa cuenta existe, el administrador ha recibido el aviso.');
  };
  if(q('#lg-help')) q('#lg-help').onclick = function(){
    SOPORTE.abierto = true; SOPORTE.vista='inicio'; renderLogin(); };
  if(q('#lg-diag')) q('#lg-diag').onclick = function(e){
    e.preventDefault();
    sbDiagnostico(q('#lg-mail') ? q('#lg-mail').value : '');
  };
  if(q('#lg-reset')) q('#lg-reset').onclick = function(e){
    e.preventDefault(); diagRestablece();
  };
  insertaEstadoConexion();
  hubEventos();
  if(q('#lg-mail') && !LOGIN.mail) q('#lg-mail').focus();
}

/* Distintivo de conexión bajo la tarjeta de acceso. Informa del estado; no
   ofrece ninguna forma de entrar. */
function insertaEstadoConexion(){
  var pie = q('#lg-pie'); if(!pie) return;
  var conectado = sbConfigurado();
  var proyecto = (String(SB.url).match(/https:\/\/([a-z0-9-]+)\./i) || [])[1] || '';

      : [ic('alert',13), 'Sin conexión con la base de datos · el acceso no está disponible', 'sb-demo'];

/* ============ ESCRITURAS DEL MÓDULO DE USUARIOS CONTRA SUPABASE ========== */
/* El panel llama a estas tres funciones; cada una decide si va a la base de
   datos o se queda en memoria, según haya conexión o no. */

function sbGuardaUsuario(u){
  if(SB.estado !== 'conectado') return Promise.resolve({ok:true, local:true});
  return sbUpdate('perfiles', 'id=eq.' + u.id, aFila(u)).then(function(r){
    if(!r.ok){
      /* Rechazado: se recupera la fila tal y como está en la base para que la
         pantalla no se quede enseñando un cambio que no llegó a aplicarse. */
      return sbSelect('perfiles', 'id=eq.' + u.id + '&select=*').then(function(v){
        if(v.ok && Array.isArray(v.datos) && v.datos[0]){
          var j = USUARIOS.map(function(x){ return x.id; }).indexOf(u.id);
          if(j > -1) USUARIOS[j] = deFila(v.datos[0], j);
        }
        return {ok:false, mensaje: sbMensaje(r)};
      });
    }
    if(Array.isArray(r.datos) && r.datos[0]){
      /* La base de datos manda: si un disparador ha reimpuesto algo —los
         permisos de la cuenta de raíz, por ejemplo— se refleja aquí. */
      var i = USUARIOS.map(function(x){ return x.id; }).indexOf(u.id);
      if(i > -1) USUARIOS[i] = deFila(r.datos[0], i);
    }
    return {ok:true};
  });
}

function sbAltaUsuario(datos){
  if(SB.estado !== 'conectado') return Promise.resolve({ok:true, local:true});
  return sbFuncion('', 'POST', datos).then(function(r){
    if(!r.ok) return {ok:false, mensaje: sbMensaje(r)};
    return {ok:true, usuario: r.datos.usuario, password: r.datos.passwordInicial};
  });
}

function sbResetClave(id){
  if(SB.estado !== 'conectado') return Promise.resolve({ok:true, local:true});
  return sbFuncion('/' + id + '/password', 'POST', {}).then(function(r){
    if(!r.ok) return {ok:false, mensaje: sbMensaje(r)};
    return {ok:true, password: r.datos.passwordInicial};
  });
}

function sbBorraUsuario(id){
  if(SB.estado !== 'conectado') return Promise.resolve({ok:true, local:true});
  return sbFuncion('/' + id, 'DELETE').then(function(r){
    return r.ok ? {ok:true} : {ok:false, mensaje: sbMensaje(r)};
  });
}

function sbRecarga(){
  if(SB.estado !== 'conectado') return Promise.resolve(false);
  return sbCargaDatos().then(function(){ renderApp(); return true; });
}

/* ==========================================================================
   INFORMES Y DESCARGAS
   Labs Command Center 360™ · Labs24k

   Aquí vive lo que hasta ahora solo enseñaba un aviso: la generación real del
   informe de auditoría, las exportaciones a CSV y la descarga de los
   documentos guardados en Supabase Storage.

   Cómo se descarga un archivo sin servidor ni librerías: se construye un Blob
   en memoria, se le pide al navegador una URL temporal y se pincha un enlace
   con el atributo `download`. Funciona en alojamiento compartido porque no
   interviene el servidor: el archivo se fabrica en el propio navegador.
   ========================================================================== */

/* ------------------------- DESCARGA DE UN ARCHIVO ------------------------ */
function nombreArchivo(base, ext){
  var f = new Date(), dos = function(n){ return (n<10?'0':'')+n; };
  var limpio = String(base).normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase();
  return limpio + '_' + f.getFullYear() + dos(f.getMonth()+1) + dos(f.getDate()) + '.' + ext;
}

function descargaArchivo(nombre, contenido, mime){
  try {
    var blob = new Blob([contenido], {type: (mime || 'text/plain') + ';charset=utf-8'});

    /* Internet Explorer y Edge antiguo no admiten el enlace con `download`. */
    if(navigator.msSaveBlob){ navigator.msSaveBlob(blob, nombre); return true; }

    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = nombre; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    /* Se libera la URL cuando el navegador ya ha empezado la descarga: si se
       revoca de inmediato, Firefox cancela el archivo a medias. */
    setTimeout(function(){
      URL.revokeObjectURL(url);
      if(a.parentNode) a.parentNode.removeChild(a);
    }, 1500);
    toast('Descargando ' + nombre);
    return true;
  } catch(e){
    toast('El navegador ha bloqueado la descarga: ' + (e && e.message ? e.message : 'motivo desconocido'));
    return false;
  }
}

/* ------------------------------ CSV ------------------------------------- */
/* Separador «;» y BOM al principio: es lo que espera Excel en español. Con
   coma, Excel mete toda la fila en la primera columna. */
function csvDe(cabeceras, filas){
  function celda(v){
    if(v === null || v === undefined) return '';
    var s = String(v);
    /* El punto y coma, las comillas y los saltos de línea obligan a entrecomillar. */
    return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }
  var lineas = [cabeceras.map(celda).join(';')];
  filas.forEach(function(f){ lineas.push(f.map(celda).join(';')); });
  return '﻿' + lineas.join('\r\n');
}
function descargaCSV(base, cabeceras, filas){
  if(!filas.length){ toast('No hay datos que exportar con los filtros actuales.'); return; }
  descargaArchivo(nombreArchivo(base,'csv'), csvDe(cabeceras, filas), 'text/csv');
}

/* ==================== DOCUMENTOS EN SUPABASE STORAGE ===================== */
var BUCKET_DOCS = 'documentos';

/* Descarga autenticada: el archivo no es público, así que se pide con el token
   de sesión y se entrega como Blob. Si aún no está subido, se dice claramente
   en lugar de fingir una descarga. */
function descargaDocumento(nombre, ruta){
  if(SB.estado !== 'conectado'){
    toast('Los archivos se guardan en Supabase Storage. Conecta la base de datos para descargarlos.');
    return;
  }
  if(!ruta){
    toast('«'+nombre+'» todavía no tiene archivo subido: solo está registrado en el expediente.');
    return;
  }
  toast('Recuperando '+nombre+'...');
  sbConSesion(function(){
    return fetch(SB.url + '/storage/v1/object/authenticated/' + BUCKET_DOCS + '/' + ruta, {
      headers: {'apikey': SB.clave, 'Authorization': 'Bearer ' + (SB.sesion||{}).access_token}
    }).then(function(r){
      if(!r.ok) return {ok:false, estado:r.status, datos:null};
      return r.blob().then(function(b){ return {ok:true, estado:200, blob:b}; });
    }, function(){ return {ok:false, estado:0, datos:null}; });
  }).then(function(r){
    if(!r.ok){
      toast(r.estado === 404
        ? 'El archivo «'+nombre+'» no está en el almacén: vuelve a subirlo desde el expediente.'
        : r.estado === 0 ? 'No se ha podido contactar con el almacén de archivos.'
        : 'No tienes permiso para descargar este documento.');
      return;
    }
    var url = URL.createObjectURL(r.blob);
    var a = document.createElement('a');
    a.href = url; a.download = nombre; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); if(a.parentNode) a.parentNode.removeChild(a); }, 1500);
    toast('Descargando '+nombre);
  });
}

/* Recursos de la Academia: mismo almacén, carpeta propia. */
function descargaRecurso(nombre, ruta){
  if(!ruta){
    toast('«'+nombre+'» es material de ejemplo del catálogo: todavía no hay archivo subido.');
    return;
  }
  descargaDocumento(nombre, 'academia/' + ruta);
}

function generaAgentesRanking(n){
  var out = [];
  for(var i=0; i<n; i++){

    var ap1 = RANK_APELLIDOS[(i*7) % RANK_APELLIDOS.length];
    var ap2 = RANK_APELLIDOS[(i*13 + 5) % RANK_APELLIDOS.length];
    var vol = 32000 + Math.round(Math.random()*178000);
    out.push({
      id:'rk-'+i, n: nombre+' '+ap1+' '+ap2, zona: RANK_ZONAS[i % RANK_ZONAS.length],
      vol: vol, cierres: 6 + Math.floor(Math.random()*38),
      com: Math.round(vol*0.1), var: Math.round((Math.random()*44 - 12)*10)/10, activo:true
    });
  }
  return out;
}

function rankOrdenado(){
  return RANKING.slice().sort(function(a,b){ return b.vol - a.vol; })

function rankTendenciaEmoji(v){
  if(v >= 20) return '🚀'; if(v >= 8) return '📈'; if(v >= 0) return '🔥'; return '';
}
/* Frases del ticker de ventas recientes simuladas. */

    '</strong> con ' + esc(cli) + ' · <span class="w">' + eur(importe) + '</span> ' + rankTendenciaEmoji(25);

/* Mueve 2-3 agentes al azar cada tick y repinta solo sus celdas: nada de
   reconstruir la tabla entera cada pocos segundos. */
function rankArrancaVivo(){
  cadaTanto(pintaTickerVenta, 3800);
  cadaTanto(function(){
    var lista = rankOrdenado(), n = 2 + Math.floor(Math.random()*2);
    for(var i=0; i<n; i++){
      var d = lista[Math.floor(Math.random()*Math.min(lista.length, 20))];
      var antes = d.vol;
      d.vol = Math.round(deriva(d.vol, 15000, 260000, 6000));
      d.com = Math.round(d.vol*0.1);
      d.var = Math.round(((d.vol-antes)/Math.max(antes,1))*300*10)/10;
      var elVol = q('#rk-vol-'+d.id);
      if(elVol) animaCifra(elVol, antes, d.vol, eur, 900);
      var elCom = q('#rk-com-'+d.id); if(elCom) elCom.textContent = eur(d.com);
      var elPVol = q('#rk-pvol-'+d.id);
      if(elPVol) animaCifra(elPVol, antes, d.vol, eur, 900);
      var elPCom = q('#rk-pcom-'+d.id); if(elPCom) elPCom.textContent = eur(d.com);
      var fila = q('#rk-fila-'+d.id);
      if(fila){ fila.classList.add('rk-mueve'); setTimeout(function(f){ return function(){ f.classList.remove('rk-mueve'); }; }(fila), 700); }
    }
  }, 2500);
}

/* Reconocimiento real del navegador (SpeechRecognition). No hay ningún motor
   propio detrás: en Chrome el audio se procesa en los servidores de Google,

var VOZ = null;

var ORDENES = [

  {p:['contactos','contacto','leads','nuevo lead'],     v:'contactos', t:'Contactos'},

  {p:['academia','cursos','formación'],                 v:'academy',   t:'Academia'},
  {p:['presupuesto','presupuestos','propuesta'],        v:'quotes',    t:'Presupuestos'},
  {p:['automation','automatización','packs de automatización','metatok'], v:'automation', t:'Automation Packs'},
  {p:['packs','pack web','tres de'],                    v:'packs',     t:'Packs Web 3D'},
  {p:['embudo','embudos','pipeline'],                   v:'funnels',   t:'Embudos de Venta'},
  {p:['auditoría','auditorias','auditorías'],           v:'audits',    t:'Auditorías IA'},

  {p:['configuración','ajustes','sistema'],             v:'settings',  t:'Configuración'},
  {p:['entrevistas','talento','candidatos'],            v:'interviews',t:'Entrevistas y Talento'}
];

function interpretaVoz(texto){
  var t = String(texto || '').toLowerCase().trim();
  if(!t) return null;
  for(var i = 0; i < ORDENES.length; i++){
    for(var j = 0; j < ORDENES[i].p.length; j++){
      if(t.indexOf(ORDENES[i].p[j]) > -1) return ORDENES[i];
    }
  }
  return null;
}

function vozDisponible(){
  return typeof window !== 'undefined' &&
    !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}

function panelVoz(){
  var hay = vozDisponible();
  var historial = MC.historial.slice(0, 6).map(function(h){

        (!hay ? 'Tu navegador no admite reconocimiento de voz'
              : MC.escuchando ? 'Escuchando... di una orden' : 'Pulsa para hablar')+'</div>'+
      (MC.ultimo ? '<div class="vz-ultimo">«'+esc(MC.ultimo)+'»</div>' : '')+
      (!hay ? '<div class="nota" style="text-align:left">'+ic('alert',15)+
        '<span>El reconocimiento de voz funciona en Chrome, Edge y Safari. En Firefox no está '+
        'disponible: usa el menú lateral.</span></div>' : '')+
    '</div>'+

    '<div class="stack">'+
      '<div class="card"><div class="card-h" style="margin-bottom:12px"><div>'+
        '<h3 style="font-size:15px">Órdenes que entiende</h3>'+
        '<p>Di el nombre de la sección a la que quieres ir.</p></div></div>'+
        '<div class="vz-ordenes">'+ORDENES.slice(0, 10).map(function(o){
          return '<span class="chip">'+esc(o.p[0])+'</span>'; }).join('')+'</div></div>'+

      '<div class="card"><div class="card-h" style="margin-bottom:12px"><div>'+
        '<h3 style="font-size:15px">Últimas órdenes</h3>'+
        '<p>Lo que se ha entendido y lo que se ha hecho.</p></div></div>'+
        '<div class="stack" style="gap:9px">'+historial+'</div></div>'+

      '<div class="nota">'+ic('alert',15)+'<span><strong>Dónde se procesa tu voz.</strong> '+
        'El reconocimiento lo hace el navegador; en Chrome eso significa que el audio viaja a '+
        'los servidores de Google. Sirve para navegar por el panel, pero no dictes por aquí '+
        'datos personales de clientes.</span></div>'+
    '</div></div>';
}

function paraEscucha(){
  MC.escuchando = false;
  if(VOZ){ try { VOZ.stop(); } catch(e){} VOZ = null; }
}

function vozEventos(){
  var b = q('#vz-btn'); if(!b) return;
  b.onclick = function(){
    if(MC.escuchando){ paraEscucha(); renderApp(); return; }
    if(!vozDisponible()){ toast('Este navegador no admite reconocimiento de voz.'); return; }

    var Motor = window.SpeechRecognition || window.webkitSpeechRecognition;
    VOZ = new Motor();
    VOZ.lang = 'es-ES';
    VOZ.continuous = false;
    VOZ.interimResults = false;
    VOZ.maxAlternatives = 1;

    VOZ.onresult = function(e){
      var texto = e.results[0][0].transcript;
      MC.ultimo = texto;
      var orden = interpretaVoz(texto);
      if(orden){
        MC.historial.unshift({texto:texto, res:'Abriendo ' + orden.t, ok:true, ts:Date.now()});
        paraEscucha();
        S.view = orden.v;
        toast('Abriendo ' + orden.t);
        renderApp();
      } else {
        MC.historial.unshift({texto:texto, res:'No reconocida', ok:false, ts:Date.now()});
        paraEscucha();
        toast('No he entendido «' + texto + '». Prueba con el nombre de una sección.');
        renderApp();
      }
    };
    VOZ.onerror = function(e){
      paraEscucha();
      toast(e.error === 'not-allowed'
        ? 'Da permiso al micrófono en el candado de la barra de direcciones.'
        : 'No se ha podido escuchar: ' + e.error);
      renderApp();
    };
    VOZ.onend = function(){ if(MC.escuchando){ MC.escuchando = false; renderApp(); } };

    try { VOZ.start(); MC.escuchando = true; renderApp(); }
    catch(e){ paraEscucha(); toast('No se ha podido activar el micrófono.'); }
  };
}

function ctrCarteraEventos(){
  var b = q('#c-buscar');
  if(b) b.oninput = function(){ CTR.filtro = b.value;
    var t = q('.tbl tbody'); if(!t) return;
    clearTimeout(window.__ctrT);
    window.__ctrT = setTimeout(renderApp, 220); };

  if(q('#c-exp')) q('#c-exp').onclick = function(){
    if(typeof exportaContratos === 'function') exportaContratos();
    else toast('La exportación no está disponible.'); };

  qa('[data-c-est]').forEach(function(s){ s.onchange = function(){
    var c = CONTRATOS.find(function(x){ return x.id === s.dataset.cEst; });
    if(!c) return;
    var antes = c.est; c.est = s.value;
    if(c.est === 'Firmado' && !c.firmado) c.firmado = new Date().toLocaleDateString('es-ES');
    if(typeof auditar === 'function')
      auditar({n:c.cliente, id:c.id}, 'Contrato ' + c.est.toLowerCase(),
              c.id + ' · ' + antes + ' → ' + c.est);
    toast('Contrato ' + c.id + ': ' + c.est + '.');
    setTimeout(renderApp, 0); }; });

  qa('[data-c-wsp]').forEach(function(x){ x.onclick = function(){
    var c = CONTRATOS.find(function(y){ return y.id === x.dataset.cWsp; });
    enviaWhatsApp(c); }; });
  qa('[data-c-mail]').forEach(function(x){ x.onclick = function(){
    var c = CONTRATOS.find(function(y){ return y.id === x.dataset.cMail; });
    enviaCorreo(c); }; });
  qa('[data-c-firma]').forEach(function(x){ x.onclick = function(){
    var c = CONTRATOS.find(function(y){ return y.id === x.dataset.cFirma; });
    pideEnlaceFirma(c); }; });
}

/* Guarda el contrato en Supabase además de en la cartera de la pantalla. Sin
   esto, el enlace de firma no tendría a qué apuntar: la base de datos es la
   que guarda el token, no el navegador.

   Si no hay conexión, el contrato se queda solo en la cartera de la sesión y
   se avisa. Nunca se dice que está guardado si no lo está. */
function sbGuardaContrato(c){
  if(typeof sbConfigurado !== 'function' || !sbConfigurado()) return;
  var t = ctrTotales();
  var fila = {
    codigo: c.id, cliente: c.cliente, cif: CONTRATO.cif || '',
    domicilio: CONTRATO.dir || '', representante: CONTRATO.rep || '',
    email: CONTRATO.mail || '', telefono: CONTRATO.tel || '',
    servicio: CONTRATO.servicio || '', setup: t.base, mensual: t.mes,
    iva: t.tipoIva, inicio: CONTRATO.fecha || new Date().toISOString().slice(0,10),
    observaciones: CONTRATO.obs || '', estado: 'Borrador',
    gestor_id: (SB.sesion && SB.sesion.uid) || null,
    /* Los huecos del documento que no tienen columna propia. */
    datos_contrato: {
      ciudad: CONTRATO.ciudad || '', refPresu: CONTRATO.refPresu || '',
      iban: CONTRATO.iban || '', plazo: CONTRATO.plazo || '',
      anexo: CONTRATO.anexo || '', firmanteLabs: CONTRATO.firmanteLabs || '',
      dni: CONTRATO.dni || ''
    }
  };
  sbInsert('contratos', fila).then(function(r){
    if(r && r.ok) toast('Contrato ' + c.id + ' guardado en Supabase.');
    else toast('Guardado solo en esta sesión: ' + sbMensaje(r));
  }, function(){ toast('Guardado solo en esta sesión: sin conexión con Supabase.'); });
}

function contratoActual(){
  var t = ctrTotales();
  return {id: ctrCodigo(), cliente: CONTRATO.cliente || '[cliente]',

/* ======================= ENLACE DE FIRMA ================================
   Pide a Supabase un enlace de un solo uso para que el cliente complete sus
   datos y firme desde el móvil. El token lo genera la base de datos, no el
   navegador: así no se puede adivinar mirando el código de la página.
   ==================================================================== */
/* Llamada a una función de Postgres (RPC). Distinta de sbFuncion(), que va a
   la Edge Function: esto habla directamente con la base de datos. */
function sbRpc(fn, args){
  return sbConSesion(function(){
    return sbFetch('/rest/v1/rpc/' + fn, {method:'POST', body: args || {}});
  }).then(function(r){
    if(!r.ok) throw new Error(sbMensaje(r));
    /* Una función que devuelve TABLE llega como lista de una sola fila. */
    return Array.isArray(r.datos) ? r.datos[0] : r.datos;
  });
}

function pideEnlaceFirma(c){
  if(!c){ toast('No hay contrato seleccionado.'); return; }
  if(typeof sbConfigurado !== 'function' || !sbConfigurado()){
    CTR.enlace = {c:c, error:'sin-supabase'}; setTimeout(renderApp, 0); return;
  }
  toast('Generando el enlace...');
  sbRpc('nuevo_enlace_firma', {p_codigo: c.id})
    .then(function(r){
      var token = r && (r.token || r);
      if(!token || typeof token !== 'string') throw new Error('la base de datos no devolvió token');
      CTR.enlace = {c:c, url: baseFirma() + '#t=' + token};
      if(typeof auditar === 'function')
        auditar({n:c.cliente, id:c.id}, 'Enlace de firma emitido', c.id);
      setTimeout(renderApp, 0);
    })
    .catch(function(e){
      CTR.enlace = {c:c, error: (e && e.message) || 'error'};
      setTimeout(renderApp, 0);
    });
}

function baseFirma(){
  var p = window.location.pathname.replace(/[^/]*$/, '');
  return window.location.origin + p + 'firmar.html';
}

/* ==========================================================================
   DIAGNÓSTICO DE CONEXIÓN
   Cuando el acceso falla hay cinco causas posibles y desde fuera se parecen
   todas: configuración guardada mal en ESTE navegador, proyecto inalcanzable,
   clave rechazada, esquema sin crear, o cuenta que todavía no existe. Esto las
   separa una por una y dice cuál es, en vez de dejar a quien entra adivinando
   delante de un «credenciales incorrectas».
   ========================================================================== */

var DIAG = null;   // {pasos:[{t, estado, txt}], hecho:bool, reparable:bool}

/* Lo que hay guardado en ESTE navegador, tal cual, sin mezclarlo con los
   valores por defecto. Es lo que puede estar estropeando el acceso. */
function diagGuardado(){
  try{
    var g = JSON.parse(localStorage.getItem('labs24k.supabase') || 'null');
    return g && typeof g === 'object' ? g : null;
  }catch(e){ return null; }
}

/* Borra la configuración guardada y recarga. El panel vuelve al proyecto que
   viene de fábrica en el propio archivo. */
function diagRestablece(){
  try{
    localStorage.removeItem('labs24k.supabase');
    localStorage.removeItem('labs24k.sesion');
  }catch(e){}
  window.location.reload();
}

function sbDiagnostico(correo){
  DIAG = {pasos: [], hecho: false, reparable: false};
  var apunta = function(t, estado, txt){
    DIAG.pasos.push({t: t, estado: estado, txt: txt});
    renderLogin();
  };
  var acaba = function(){ DIAG.hecho = true; renderLogin(); };

  /* 1 · ¿La configuración de ESTE navegador es utilizable? ---------------- */
  if(!sbConfigurado()){
    var g = diagGuardado();
    var motivo;
    if(g && g.activo === false){
      motivo = 'Este navegador tiene la conexión con Supabase APAGADA. Es una '
        + 'preferencia guardada aquí, no un problema del servidor.';
    } else if(g && g.url && !/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(String(g.url).trim())){
      motivo = 'Este navegador tiene guardada una URL que no es válida: «' + g.url + '».';
    } else if(g && g.clave && String(g.clave).length <= 20){
      motivo = 'Este navegador tiene guardada una clave demasiado corta para ser válida.';
    } else {
      motivo = 'La configuración de conexión no es utilizable. URL: «'
        + (SB.url || '(vacía)') + '». Clave: '
        + (SB.clave ? String(SB.clave).slice(0, 18) + '…' : '(vacía)') + '.';
    }
    apunta('Configuración de este navegador', 'mal', motivo);
    DIAG.reparable = true;      // se arregla con el botón de restablecer
    return acaba();
  }
  apunta('Configuración', 'ok', SB.url);

  /* 2 · ¿Se llega al proyecto y la clave vale? --------------------------- */
  sbFetch('/auth/v1/settings', {conSesion: false}).then(function(r){
    if(r.estado === 0){
      apunta('Conexión con Supabase', 'mal',
        'El navegador no obtiene respuesta. Suele ser el proyecto en pausa, la URL '
        + 'mal escrita, la CSP del .htaccess apuntando a otro dominio, o falta de red. '
        + 'Desde aquí no se puede distinguir cuál de ellas es.');
      DIAG.reparable = true;
      return acaba();
    }
    if(r.estado === 401 || r.estado === 403){
      apunta('Clave publicable', 'mal',
        'Supabase rechaza la clave. Cópiala de nuevo en Project Settings → API keys.');
      DIAG.reparable = true;
      return acaba();
    }
    apunta('Conexión con Supabase', 'ok', 'El proyecto responde y acepta la clave.');

    /* 3 · ¿Están creadas las tablas? ------------------------------------ */
    return sbFetch('/rest/v1/perfiles?select=id&limit=1', {conSesion: false}).then(function(t){
      if(t.estado === 404 || (t.datos && t.datos.code === '42P01')){
        apunta('Tablas del panel', 'mal',
          'La tabla «perfiles» no existe: falta ejecutar 01-esquema.sql en el editor SQL.');
        return acaba();
      }
      apunta('Tablas del panel', 'ok', 'El esquema está creado.');

      /* 4 · ¿Contesta el servicio de acceso? ----------------------------- */
      var mail = normalizaMail(correo || RAIZ_MAIL);
      /* Se prueba con una contraseña imposible a propósito. Supabase responde
         igual exista o no la cuenta —y hace bien, así no se puede averiguar
         quién está dado de alta—, de modo que lo que se comprueba aquí es que
         el servicio contesta, no el resultado. */
      return sbFetch('/auth/v1/token?grant_type=password', {
        method: 'POST', conSesion: false,
        body: {email: mail, password: '-comprobacion-que-no-vale-'}
      }).then(function(a){
        if(a.estado === 400){
          apunta('Servicio de acceso', 'ok',
            'Responde correctamente. Si tu contraseña real tampoco entra, es que la '
            + 'cuenta ' + mail + ' aún no está creada: ejecuta 02-cuenta-raiz.sql.');
        } else if(a.estado === 422){
          apunta('Servicio de acceso', 'aviso',
            'El acceso por correo y contraseña está desactivado en Supabase '
            + '(Authentication → Providers → Email).');
        } else {
          apunta('Servicio de acceso', 'aviso',
            'Respuesta inesperada del servidor: ' + a.estado + '.');
        }
        acaba();
      });
    });
  }).catch(function(e){
    apunta('Diagnóstico', 'mal', (e && e.message) || 'Error inesperado.');
    DIAG.reparable = true;
    acaba();
  });
}

function diagHTML(){
  if(!DIAG) return '';
  var ico = {ok: ['check', 'dg-ok'], mal: ['alert', 'dg-mal'], aviso: ['alert', 'dg-aviso']};
  return '<div class="lg-diag">'
    + '<div class="lg-diag-t">' + ic('plug', 13) + ' Comprobación de la conexión</div>'
    + DIAG.pasos.map(function(p){
        var k = ico[p.estado] || ico.aviso;
        return '<div class="lg-diag-p ' + k[1] + '">' + ic(k[0], 14)
          + '<div><strong>' + esc(p.t) + '</strong>'
          + '<span>' + esc(p.txt) + '</span></div></div>';
      }).join('')
    + (DIAG.hecho ? '' : '<div class="lg-diag-p"><span class="dg-esp">Comprobando…</span></div>')
    + (DIAG.hecho && DIAG.reparable
        ? '<button type="button" class="lg-reset" id="lg-reset">' + ic('refresh', 14)
          + ' Restablecer la conexión y recargar</button>'
          + '<div class="dg-esp" style="margin-top:7px">Borra la configuración guardada en '
          + 'este navegador y vuelve a la que trae el archivo de fábrica.</div>'
        : '')
    + '</div>';
}

/* Sello de versión bajo la tarjeta. Sirve para saber de un vistazo si el
   navegador está sirviendo el archivo recién subido o uno de la caché: es la
   diferencia entre buscar un fallo que existe y uno que ya está arreglado. */
function selloVersion(){
  return '<div class="lg-sello">Versión ' + esc(typeof BUILD === 'string' ? BUILD : '—') + '</div>';
}

</script>
</body>
