  box-shadow:0 0 0 8px rgba(23,200,192,.14)}
.vz-estado{font-size:13px;color:var(--txt-2)}
.vz-ultimo{font-size:15px;color:#fff;font-style:italic;max-width:32ch}
.vz-ordenes{display:flex;flex-wrap:wrap;gap:7px}
.vz-h{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;
  background:var(--card-2);border:1px solid var(--line)}
.vz-h svg{flex:0 0 auto;margin-top:1px;color:var(--green)}
.vz-h-no svg{color:var(--amber)}

@media(prefers-reduced-motion:reduce){
  .vz-onda.on i{animation:none;height:24px}
  .vz-boton{transition:none}
}

/* ---------------------------- CONTRATO -------------------------------- */
.doc.pdf.contrato .ct-p{font-size:13px;line-height:1.75;color:#334155;margin:0 0 14px;
  text-align:justify}
.doc.pdf .hueco{background:#FEF3C7;color:#92400E;border-radius:4px;padding:1px 6px;
  font-style:italic;font-weight:600}

/* Subtítulo del contrato (la línea larga bajo el título) */
.doc.pdf .doc-sub{font-size:13.5px;line-height:1.55;color:#475569;font-weight:600;
  margin:0 0 20px;max-width:70ch}

/* Epígrafes sin número: REUNIDOS · EXPONEN · CLÁUSULAS · ANEXO I */
.doc.pdf .ct-hito{justify-content:center;text-align:center;letter-spacing:.2em;
  font-size:12.5px;color:#0F766E;border-top:1px solid #E2E8F0;border-bottom:1px solid #E2E8F0;
  padding:9px 0;margin:26px 0 16px}

/* Listas de las cláusulas segunda, tercera, sexta, séptima y novena */
.doc.pdf .ct-ul{margin:0 0 14px;padding-left:20px;list-style:disc}
.doc.pdf .ct-ul li{font-size:13px;line-height:1.7;color:#334155;margin-bottom:7px;
  text-align:justify}
.doc.pdf .ct-ul li::marker{color:#0F766E}

/* Tabla orientativa de inversión publicitaria (cláusula cuarta) */
.doc.pdf .ct-tabla{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:12.5px}
.doc.pdf .ct-tabla th{text-align:left;font-weight:700;color:#0F172A;background:#F1F5F9;
  border:1px solid #E2E8F0;padding:9px 11px}
.doc.pdf .ct-tabla td{border:1px solid #E2E8F0;padding:9px 11px;color:#334155;
  font-variant-numeric:tabular-nums}

/* Cuadro resumen del precio (se usa aquí y en el formulario) */
.sum-l{display:flex;justify-content:space-between;gap:16px;padding:11px 16px;font-size:13px;
  border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.sum-l:last-child{border-bottom:none}
.sum-l.tot{background:var(--card-2);font-size:16px;font-weight:800;color:var(--txt);
  border-top:2px solid var(--blue)}

/* Anexo I: empieza en página nueva al imprimir */
.doc.pdf .ct-anexo{margin-top:34px;padding-top:8px}

/* Enlace de firma copiable */
.copiable{background:var(--card-2);border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;overflow-wrap:anywhere}
.copiable code{font-size:12.5px;color:var(--blue);font-family:ui-monospace,SFMono-Regular,
  Menlo,Consolas,monospace}

@media print{
  .doc.pdf .ct-anexo{break-before:page}
  .doc.pdf .ct-ul li,.doc.pdf .ct-tabla tr,.doc.pdf .ct-p{break-inside:avoid}
}
.doc-sign{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:32px}
.doc.pdf .firma{height:56px;border-bottom:1px solid #94A3B8;margin:10px 0 7px}
.doc.pdf .doc-sign .k{color:#64748B}

@media(max-width:700px){
  .doc-sign{grid-template-columns:1fr}
  .pod{max-width:none}
}
</style>

/* --------------------------- LOGOTIPO TIPOGRÁFICO ----------------------- */
/* «Labs24K» con el degradado de marca. Va en SVG y no en HTML porque el
   recorte de degradado sobre texto (background-clip) se pierde al imprimir en
   varios navegadores, y estas letras acaban en propuestas y presupuestos. */
function marcaTexto(alto, claro){
  var id = 'mt' + (++_logoN);
  /* La caja se ajusta a la altura real de las letras: «Labs24K» no tiene
     ningún trazo descendente, así que recortar el hueco de abajo hace que el
     logotipo se alinee solo con el isotipo, sin cuadrar márgenes a mano. */
  var ancho = Math.round(alto * 5);
  /* textLength fija el ancho del logotipo: aunque el ordenador del cliente no
     tenga Roboto y caiga en Arial o en la fuente del sistema, la marca ocupa
     exactamente lo mismo y no se recorta ni baila. Es la diferencia entre un
     logotipo y un texto que casualmente pone el nombre. */
  return '<svg class="marca-txt" width="'+ancho+'" height="'+alto+'" viewBox="0 0 420 84" '+
    'role="img" aria-label="Labs24K">'+
    '<defs>'+_grad(id, claro, 0, 0, 420, 0)+'</defs>'+
    '<text x="4" y="76" fill="url(#'+id+')" font-size="96" font-weight="800" '+
      'textLength="412" lengthAdjust="spacingAndGlyphs" '+
      'font-family="Roboto,\'Segoe UI\',system-ui,-apple-system,'+
      'Helvetica,Arial,sans-serif">Labs24K</text></svg>';
}

/* ------------------------------ BLOQUE COMPLETO ------------------------- */
/* opc.lema  añade el lema debajo · opc.claro  versión para fondo claro
   opc.fila  isotipo y texto en horizontal (por defecto) o apilados */
function logotipo(alto, opc){
  opc = opc || {};
  var iso = logo(Math.round(alto * (opc.lema ? 1.05 : 1)), opc.claro);
  var txt = marcaTexto(Math.round(alto * 0.52), opc.claro);
  var lema = opc.lema
    ? '<div class="marca-lema'+(opc.claro?' claro':'')+'">'+esc(MARCA.lema)+'</div>' : '';
  return '<div class="marca'+(opc.apilado?' apilada':'')+'">'+
    iso + '<div class="marca-col">' + txt + lema + '</div></div>';
}

/* ------------------------------ UTILES ---------------------------------- */
function eur(n){ return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0,useGrouping:true}).format(n); }
function num(n){ return new Intl.NumberFormat('es-ES',{useGrouping:true}).format(n); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
/* Solo se acepta https://. Corta javascript: y data: si alguien manipula la
   configuracion guardada en el navegador. */
function urlSegura(u){
  u = String(u||'').trim();
  return /^https:\/\/[a-z0-9.-]+\.[a-z]{2,}([/?#].*)?$/i.test(u) ? u : '';
}
/* Para src de avatar: solo imagen en base64 o https://. Cualquier otra cosa
   (javascript:, texto suelto, marcado) se descarta antes de llegar al DOM. */
function avatarSeguro(u){
  u = String(u||'').trim();
  if(/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(u)) return u;
  return urlSegura(u);
}
function q(s){ return document.querySelector(s); }
function qa(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
/* los avisos se guardan aparte: renderApp() reescribe el body y los borraria */
var TOASTS = [];
function toast(msg){
  var t = document.createElement('div'); t.className='toast'; t.innerHTML = ic('check',16)+' '+esc(msg);
  t.style.display='flex'; t.style.alignItems='center'; t.style.gap='9px';
  TOASTS.push(t); document.body.appendChild(t);
  setTimeout(function(){
    t.remove();
    var i = TOASTS.indexOf(t); if(i>-1) TOASTS.splice(i,1);
  }, 3600);
}
function reponerToasts(){
  TOASTS.forEach(function(t, i){
    t.style.bottom = (20 + i*58) + 'px';
    document.body.appendChild(t);
  });
}
function delta(v){
  var up = v >= 0;
  return '<span class="delta '+(up?'up':'down')+'">'+ic(up?'arrowUp':'arrowDown',11)+(up?'+':'')+v+'%</span>';
}

/* ------------------------------ GRAFICOS SVG ---------------------------- */
function areaChart(data, opt){
  opt = opt || {}; var w = 100, h = opt.h || 34, pad = 2;
  var max = Math.max.apply(null,data), min = Math.min.apply(null,data);
  var rng = (max-min)||1, id = 'g'+Math.random().toString(36).slice(2,8);
  var col = opt.color || '#4ADE80';
  var pts = data.map(function(v,i){
    var x = (i/(data.length-1))*w;
    var y = h-pad-((v-min)/rng)*(h-pad*2);
    return [x,y];
  });
  var line = pts.map(function(p,i){ return (i?'L':'M')+p[0].toFixed(2)+' '+p[1].toFixed(2); }).join(' ');
  var area = line+' L'+w+' '+h+' L0 '+h+' Z';
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="width:100%;height:'+(opt.px||70)+'px">'+
    '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+col+'" stop-opacity=".38"/>'+
    '<stop offset="100%" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#'+id+')"/>'+
    '<path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="1.4" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>'+
    '</svg>';
}
function barChart(data, labels, opt){
  opt = opt||{}; var col = opt.color||'#FBBF24', h = opt.px||120;
  var max = Math.max.apply(null,data)||1;
  var bars = data.map(function(v,i){
    var pct = Math.max(4,(v/max)*100);
    return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0">'+
      '<div style="width:100%;height:'+h+'px;display:flex;align-items:flex-end">'+
      '<div title="'+esc(labels[i]+': '+num(v))+'" style="width:100%;height:'+pct.toFixed(1)+'%;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,'+col+',rgba(0,0,0,0));opacity:'+(0.55+0.45*(v/max)).toFixed(2)+'"></div></div>'+
      '<span style="font-size:10px;color:var(--txt-3)" class="trunc">'+esc(labels[i])+'</span></div>';
  }).join('');
  return '<div style="display:flex;align-items:flex-end;gap:6px">'+bars+'</div>';
}
function donut(pct, color, size, label){
  size = size||64; color = color||'#17C8C0';
  var r = 26, c = 2*Math.PI*r, off = c*(1-pct/100);
  return '<div style="position:relative;width:'+size+'px;height:'+size+'px">'+
    '<svg width="'+size+'" height="'+size+'" viewBox="0 0 64 64" style="transform:rotate(-90deg)">'+
    '<circle cx="32" cy="32" r="'+r+'" fill="none" stroke="rgba(148,163,184,.16)" stroke-width="7"/>'+
    '<circle cx="32" cy="32" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="7" stroke-linecap="round" '+
    'stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg>'+
    '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:'+(size/4.6).toFixed(0)+'px;font-weight:700;color:#fff">'+(label||pct+'%')+'</div></div>';
}
function progressRow(name, val, max, color, right){
  var pct = Math.min(100,(val/max)*100);
  return '<div class="rank-it"><div style="flex:1;min-width:0">'+
    '<div style="display:flex;justify-content:space-between;margin-bottom:6px">'+
    '<span class="nm trunc">'+esc(name)+'</span><span class="vl">'+esc(right!=null?right:num(val))+'</span></div>'+
    '<div class="bar"><i style="width:'+pct.toFixed(1)+'%;background:'+(color||'#17C8C0')+'"></i></div></div></div>';
}

function viewCalendar(v){
  var now = new Date(2026,8,1), y=2026, m=8;
  var first = new Date(y,m,1).getDay(); first = (first+6)%7;
  var days = new Date(y,m+1,0).getDate();
  var cells='';
  ['L','M','X','J','V','S','D'].forEach(function(d){ cells+='<div class="dow">'+d+'</div>'; });
  for(var i=0;i<first;i++) cells+='<div class="day out"></div>';
  for(var d=1;d<=days;d++){
    var evs = DB.appointments.filter(function(a){ return a.d===d; });
    var dots = evs.length ? '<div class="ev">'+evs.map(function(e){
      return '<i class="'+(e.k==='green'?'g':e.k==='amber'?'a':'')+'"></i>'; }).join('')+'</div>' : '';
    cells += '<div class="day'+(d===4?' today':'')+'">'+d+dots+'</div>';
  }

  var list = DB.appointments.map(function(a){
    return '<div class="card flat" style="padding:14px;display:flex;gap:13px;align-items:flex-start">'+
      '<div class="ico-box '+(a.k==='green'?'green':a.k==='amber'?'amber':a.k==='violet'?'violet':'blue')+'">'+ic('calendar',16)+'</div>'+
      '<div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:600;color:#fff">'+esc(a.t)+'</div>'+
      '<div class="tiny muted">'+esc(a.c)+' · '+esc(a.who)+'</div></div>'+
      '<div style="text-align:right"><div class="chip blue">'+esc(a.h)+'</div>'+
      '<div class="tiny muted" style="margin-top:5px">'+a.d+' sep</div></div></div>';
  }).join('');

  v.innerHTML =
  '<div class="grid g-cal">'+
    '<div class="card">'+
      '<div class="card-h"><div><h3>Septiembre 2026</h3><p>Citas, demos y barridos de zona</p></div>'+

/* ------------------------------ CALCULOS -------------------------------- */
function cursoById(id){ return CURSOS.filter(function(c){ return c.id===id; })[0] || CURSOS[0]; }
function cursoMin(c){ return c.L.reduce(function(a,l){ return a+l.m; },0); }
function cursoPct(c){
  if(!c.L.length) return 0;
  return Math.round(c.L.filter(function(l){ return l.ok; }).length / c.L.length * 100);
}
function academiaPct(){
  var t=0,d=0; CURSOS.forEach(function(c){ t+=c.L.length; d+=c.L.filter(function(l){ return l.ok; }).length; });
  return t?Math.round(d/t*100):0;
}
function puedeCrear(){ return S.role==='admin' || S.role==='manager'; }

/* --------------------------- EVENTOS ------------------------------------ */
function acadEventos(){
  qa('[data-atab]').forEach(function(b){ b.onclick=function(){
    ACAD.tab=b.dataset.atab; ACAD.corregido=null; renderApp(); }; });
  qa('[data-open]').forEach(function(b){ b.onclick=function(){
    ACAD.cur=Number(b.dataset.open); ACAD.les=0; ACAD.tab='player'; ACAD.quiz={}; ACAD.corregido=null; renderApp(); }; });
  qa('[data-les]').forEach(function(b){ b.onclick=function(){
    ACAD.les=Number(b.dataset.les); ACAD.quiz={}; ACAD.corregido=null; renderApp(); }; });
  qa('[data-dl]').forEach(function(b){ b.onclick=function(){
    descargaRecurso(b.dataset.nombre || 'Recurso del curso', b.dataset.ruta || ''); }; });
  qa('[data-up]').forEach(function(b){ b.onclick=function(){
    toast(b.dataset.up==='video'?'Vídeo subido al repositorio de la Academia.':'Recurso adjuntado al curso.'); }; });

  if(q('#play-video')) q('#play-video').onclick=function(){ toast('Reproduciendo la sesión oficial Labs24k.'); };

  var c = cursoById(ACAD.cur), l = c.L[ACAD.les];
  if(q('#les-ok')) q('#les-ok').onclick=function(){
    l.ok=!l.ok;
    if(l.ok && ACAD.les<c.L.length-1){ ACAD.les++; ACAD.quiz={}; ACAD.corregido=null; }
    toast(l.ok?'Lección completada. Progreso guardado.':'Lección marcada como pendiente.');
    renderApp();
  };
  if(q('#cur-ok')) q('#cur-ok').onclick=function(){
    c.L.forEach(function(x){ x.ok=true; });
    toast('Módulo "'+c.t+'" superado. Certificación actualizada al '+academiaPct()+'%.');
    renderApp();
  };

  qa('[data-q]').forEach(function(b){ b.onclick=function(){
    if(ACAD.corregido) return;
    var p=b.dataset.q.split('-'); ACAD.quiz[+p[0]]=+p[1]; renderApp(); }; });
  if(q('#q-corr')) q('#q-corr').onclick=function(){
    var qs=l.q||[];
    if(Object.keys(ACAD.quiz).length<qs.length){ toast('Responde a todas las preguntas antes de corregir.'); return; }
    var ac=0; qs.forEach(function(qq,i){ if(ACAD.quiz[i]===qq.ok) ac++; });
    var pct=Math.round(ac/qs.length*100);
    ACAD.corregido={aciertos:ac,total:qs.length,pct:pct};
    if(pct>=67){ l.ok=true; toast('Test superado: '+ac+' de '+qs.length+' correctas.'); }
    else toast('Test no superado: '+ac+' de '+qs.length+'. Repásalo y vuelve a intentarlo.');
    renderApp();
  };
  if(q('#q-reset')) q('#q-reset').onclick=function(){ ACAD.quiz={}; ACAD.corregido=null; renderApp(); };

  /* creador */
  var N = ACAD.nuevo;
  function sync(){ setTimeout(renderApp,0); }
  if(q('#n-t')) q('#n-t').onchange=function(){ N.t=this.value; };
  if(q('#n-d')) q('#n-d').onchange=function(){ N.d=this.value; };
  if(q('#n-cat')) q('#n-cat').onchange=function(){ N.cat=this.value; };
  if(q('#n-ins')) q('#n-ins').onchange=function(){ N.ins=this.value; };
  qa('[data-nl]').forEach(function(el){ el.onchange=function(){
    var p=el.dataset.nl.split('-'), i=+p[1];
    if(p[0]==='t') N.L[i].t=el.value;
    if(p[0]==='m') N.L[i].m=Number(el.value)||0;
    if(p[0]==='k') N.L[i].k=el.value;
    sync(); }; });
  qa('[data-nldel]').forEach(function(b){ b.onclick=function(){
    N.L.splice(+b.dataset.nldel,1); renderApp(); }; });
  if(q('#n-add')) q('#n-add').onclick=function(){
    N.L.push({t:'',m:15,k:'video'}); renderApp(); };
  if(q('#n-pub')) q('#n-pub').onclick=function(){
    N.t = q('#n-t').value.trim(); N.d = q('#n-d').value.trim(); N.ins = q('#n-ins').value.trim();
    if(!N.t){ toast('El curso necesita un título.'); return; }
    var L = N.L.filter(function(x){ return x.t.trim(); })
               .map(function(x){ return {t:x.t.trim(), m:Number(x.m)||10, k:x.k, ok:false}; });
    if(!L.length){ toast('Añade al menos una lección con título.'); return; }
    var id = Math.max.apply(null, CURSOS.map(function(c){ return c.id; }))+1;
    CURSOS.push({id:id, t:N.t, cat:N.cat, ins:N.ins||S.name, ico:'book', col:'blue',
      d:N.d||'Curso interno de la Universidad Comercial 24k.', L:L});
    ACAD.nuevo={t:'',d:'',cat:'Especialización',ins:'',L:[{t:'',m:15,k:'video'}]};
    ACAD.tab='catalog';
    toast('Curso publicado y visible para toda la red comercial.');
    renderApp();
  };
  qa('[data-cdel]').forEach(function(b){ b.onclick=function(){
    var id=Number(b.dataset.cdel);
    if(CURSOS.length<=1){ toast('La Academia debe mantener al menos un curso.'); return; }
    var i=CURSOS.map(function(c){ return c.id; }).indexOf(id);
    var t=CURSOS[i].t; CURSOS.splice(i,1);
    if(ACAD.cur===id) ACAD.cur=CURSOS[0].id;
    toast('Curso "'+t+'" retirado del catálogo.'); renderApp(); }; });
}

/* mueve un candidato de fase aplicando las reglas de negocio */
function mover(id, destino){
  var c = CAND.filter(function(x){ return x.id===id; })[0];
  if(!c || c.f===destino) return;
  var i = faseIdx(destino);
  if(i<0) return;
  if(destino==='contratado' && !c.punt){
    toast('Evalúa al candidato antes de darle el alta.');
    HR.sel=c.id; HR.modal='eval'; HR.punt={}; renderApp(); return;
  }
  var antes = c.f;
  c.f = destino;
  if(destino==='llamado' && faseIdx(antes)<faseIdx('llamado')) c.llam++;
  if(destino==='contratado' && !c.alta){
    c.alta = true;
    var rol = /jefe|directora/i.test(c.p) ? (/directora/i.test(c.p)?'Dirección Comercial':'Jefe de Equipo')
            : /back office/i.test(c.p) ? 'Back Office' : 'Gestión Comercial';
    DB.team.push({n:c.n, r:rol, t:c.tel, v:0, q:0, av:'#0FA8A2'});
    toast(c.n+' dado de alta como '+rol+'. Ya figura en la red comercial.');

    toast(c.n+' → '+fase(destino).t);

  renderApp();
}

      '<div class="field"><label class="f">Motivo del descarte</label>'+

  /* evaluación */

        '<button class="btn btn-g" id="ev-alta">'+ic('userPlus',15)+' Contratar y dar de alta</button></div>'+
    '</div>'+

/* ------------------------------ EVENTOS --------------------------------- */
function hrEventos(){
  /* --- arrastrar y soltar --- */
  qa('[data-card]').forEach(function(el){
    el.ondragstart=function(e){
      HR.drag=Number(el.dataset.card); el.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      try{ e.dataTransfer.setData('text/plain', el.dataset.card); }catch(_){}
    };
    el.ondragend=function(){ el.classList.remove('dragging'); HR.drag=null; HR.over=null;
      qa('.pcol').forEach(function(c){ c.classList.remove('over'); }); };
  });
  qa('[data-col]').forEach(function(col){
    col.ondragover=function(e){ e.preventDefault(); e.dataTransfer.dropEffect='move';
      col.classList.add('over'); };
    col.ondragleave=function(){ col.classList.remove('over'); };
    col.ondrop=function(e){
      e.preventDefault(); col.classList.remove('over');
      var id = HR.drag || Number(e.dataTransfer.getData('text/plain'));
      HR.drag=null; if(id) mover(id, col.dataset.col);
    };
  });

  /* --- flechas y acciones de tarjeta --- */
  qa('[data-next]').forEach(function(b){ b.onclick=function(ev){ ev.stopPropagation();
    var c=CAND.filter(function(x){ return x.id===Number(b.dataset.next); })[0];
    var i=faseIdx(c.f); if(i<FASES.length-1) mover(c.id, FASES[i+1].id); }; });
  qa('[data-prev]').forEach(function(b){ b.onclick=function(ev){ ev.stopPropagation();
    var c=CAND.filter(function(x){ return x.id===Number(b.dataset.prev); })[0];
    var i=faseIdx(c.f); if(i>0){ c.f=FASES[i-1].id; toast(c.n+' → '+FASES[i-1].t); renderApp(); } }; });
  qa('[data-call]').forEach(function(b){ b.onclick=function(ev){ ev.stopPropagation();
    HR.sel=Number(b.dataset.call); HR.modal='call'; renderApp(); }; });
  qa('[data-ev]').forEach(function(b){ b.onclick=function(ev){ ev.stopPropagation();
    HR.sel=Number(b.dataset.ev); HR.modal='eval';
    var c=CAND.filter(function(x){ return x.id===HR.sel; })[0];
    HR.punt={}; if(c.punt) c.punt.forEach(function(p,i){ HR.punt[i]=p; });
    renderApp(); }; });
  qa('[data-out]').forEach(function(b){ b.onclick=function(ev){ ev.stopPropagation();
    HR.sel=Number(b.dataset.out); HR.modal='out'; renderApp(); }; });
  qa('[data-back]').forEach(function(b){ b.onclick=function(){
    var i=DESC.map(function(d){ return d.id; }).indexOf(Number(b.dataset.back));
    var d=DESC.splice(i,1)[0];
    CAND.push({id:d.id, n:d.n, p:d.p, f:'seleccionado', tel:d.tel, mail:'candidato@labs24k.com',
      ev:S.name, exp:'Recuperado del histórico', punt:d.punt||null, notas:'', cita:'', llam:0});
    toast(d.n+' vuelve al pipeline en la fase 1.'); renderApp(); }; });

  if(q('#hr-new')) q('#hr-new').onclick=function(){
    HR.modal='new'; HR.form={n:'',p:PUESTOS[0],tel:'',mail:'',ev:EVALUADORES[0],exp:''}; renderApp(); };

  /* --- modales --- */
  qa('[data-close]').forEach(function(b){ b.onclick=function(){ HR.modal=null; renderApp(); }; });
  if(q('.ov')) q('.ov').onclick=function(e){ if(e.target===this){ HR.modal=null; renderApp(); } };

  if(q('#h-save')) q('#h-save').onclick=function(){
    var n=q('#h-n').value.trim();
    if(!n){ toast('Indica el nombre del candidato.'); return; }
    CAND.unshift({id:Math.max.apply(null,CAND.map(function(c){ return c.id; }))+1,
      n:n, p:q('#h-p').value, f:'seleccionado',
      tel:q('#h-tel').value.trim()||'+34 600 000 000',
      mail:q('#h-mail').value.trim()||'candidato@labs24k.com',
      ev:q('#h-ev').value, exp:q('#h-exp').value.trim()||'Pendiente de valorar en entrevista',
      punt:null, notas:'', cita:'', llam:0});
    HR.modal=null; toast(n+' incorporado al pipeline en la fase 1.'); renderApp();
  };

  if(q('#c-save')) q('#c-save').onclick=function(){
    var c=CAND.filter(function(x){ return x.id===HR.sel; })[0];
    var res=q('#c-res').value, f=q('#c-fecha').value;
    c.llam++;
    if(res==='Rechaza el puesto'){
      DESC.push({id:c.id, n:c.n, p:c.p, tel:c.tel, motivo:'Rechaza el puesto', punt:c.punt});
      CAND.splice(CAND.indexOf(c),1);
      HR.modal=null; toast(c.n+' rechaza el puesto. Pasa al histórico.'); renderApp(); return;
    }
    if(f){
      c.cita = f.split('-').reverse().join('/')+' · '+(q('#c-hora').value||'10:00');
      c.f='en_entrevista';
      toast('Llamada registrada y entrevista fijada para el '+c.cita+'.');
    } else {
      if(faseIdx(c.f)<faseIdx('llamado')) c.f='llamado';
      toast('Llamada registrada: '+res.toLowerCase()+'.');
    }
    HR.modal=null; renderApp();
  };

  if(q('#o-save')) q('#o-save').onclick=function(){
    var c=CAND.filter(function(x){ return x.id===HR.sel; })[0];
    DESC.push({id:c.id, n:c.n, p:c.p, tel:c.tel, motivo:q('#o-mot').value, punt:c.punt});
    CAND.splice(CAND.indexOf(c),1);
    HR.modal=null; toast(c.n+' descartado y archivado en el histórico.'); renderApp();
  };

  qa('[data-sc]').forEach(function(b){ b.onclick=function(){
    var p=b.dataset.sc.split('-'); HR.punt[+p[0]]=+p[1];
    if(q('#ev-notas')) CAND.filter(function(x){ return x.id===HR.sel; })[0].notas=q('#ev-notas').value;
    renderApp(); }; });

  function guarda(){
    var c=CAND.filter(function(x){ return x.id===HR.sel; })[0];
    var vals=CRITERIOS.map(function(_,i){ return HR.punt[i]||0; });
    if(q('#ev-notas')) c.notas=q('#ev-notas').value.trim();
    if(vals.every(function(x){ return x>0; })){
      c.punt=vals;
      if(faseIdx(c.f)<faseIdx('evaluado')) c.f='evaluado';
    }
    return c;
  }
  if(q('#ev-save')) q('#ev-save').onclick=function(){
    var c=guarda();
    if(!c.punt){ toast('Puntúa los cuatro criterios antes de guardar.'); return; }
    HR.modal=null; toast('Evaluación de '+c.n+' guardada: '+String(score10(c.punt)).replace('.',',')+' / 10.'); renderApp();
  };
  if(q('#ev-out')) q('#ev-out').onclick=function(){
    var c=guarda(); HR.modal='out'; renderApp();
  };
  if(q('#ev-alta')) q('#ev-alta').onclick=function(){
    var c=guarda();
    if(!c.punt){ toast('Completa la evaluación antes de dar de alta.'); return; }
    HR.modal=null; mover(c.id,'contratado');
  };
}

/* ==========================================================================
   CONTACTOS · leads y clientes con ficha individual · Labs Command Center 360
   Persistencia real en Supabase: contactos, contacto_eventos (actualizaciones
   y notas de seguimiento), contacto_comentarios (comentarios interactivos) y
   contacto_documentos (documentación, archivo en el bucket "documentos").
   Ver NO-SUBIR-supabase/07-contactos.sql para el esquema y las políticas RLS.
   ========================================================================== */
var ESTADOS_CT = ['Nuevo','Contactado','Cualificado','Propuesta enviada','Cliente','Perdido'];
var TABS_CT = [
  {k:'docs',    n:'Documentación',            i:'file'},
  {k:'spec',    n:'Especificaciones técnicas', i:'cog'},
  {k:'hist',    n:'Actualizaciones',          i:'clock'},
  {k:'coment',  n:'Comentarios',              i:'chat'}
];
var CT = {
  lista:[], cargando:false, cargado:false, error:'',
  filtro:'', tipoF:'', estadoF:'',
  det:null, tab:'docs', eventos:[], comentarios:[], documentos:[], subiendo:false,
  nuevoTexto:'', nuevoComentario:'', nuevo:null
};

function ctContactoPorId(id){ return CT.lista.filter(function(c){ return c.id===id; })[0] || null; }

function ctCarga(){
  if(CT.cargando) return;
  CT.cargando = true; CT.error = '';
  sbSelect('contactos', 'select=*&order=actualizado.desc').then(function(r){
    CT.cargando = false; CT.cargado = true;
    if(r && r.ok) CT.lista = r.datos || []; else CT.error = sbMensaje(r);
    renderApp();
  }, function(){ CT.cargando = false; CT.error = 'Sin conexión con Supabase.'; renderApp(); });
}

function ctCargaDetalle(id){
  Promise.all([
    sbSelect('contacto_eventos', 'contacto_id=eq.'+id+'&order=ts.desc'),
    sbSelect('contacto_comentarios', 'contacto_id=eq.'+id+'&order=ts.desc'),
    sbSelect('contacto_documentos', 'contacto_id=eq.'+id+'&order=ts.desc')
  ]).then(function(rs){
    if(rs[0] && rs[0].ok) CT.eventos = rs[0].datos || [];
    if(rs[1] && rs[1].ok) CT.comentarios = rs[1].datos || [];
    if(rs[2] && rs[2].ok) CT.documentos = rs[2].datos || [];
    renderApp();
  });
}

function ctAbre(id){
  CT.det = id; CT.tab = 'docs'; CT.eventos = []; CT.comentarios = []; CT.documentos = [];
  renderApp();
  ctCargaDetalle(id);
}
function ctCierra(){ CT.det = null; renderApp(); }

function ctNuevo(){
  CT.nuevo = {nombre:'', empresa:'', email:'', prefijo:'+34', telefono:'', origen:'', tipo:'lead'};
  renderApp();
}
function ctGuardaNuevo(){
  var n = CT.nuevo;
  if(!n || !n.nombre || n.nombre.trim().length < 2){
    toast('Escribe al menos el nombre del contacto.'); return; }
  var fila = {nombre:n.nombre.trim(), empresa:n.empresa||'', email:n.email||'',
    prefijo:n.prefijo||'+34', telefono:n.telefono||'', origen:n.origen||'', tipo:n.tipo||'lead',
    gestor_id:(SB.sesion && SB.sesion.uid) || null};
  sbInsert('contactos', fila).then(function(r){
    if(r && r.ok){ toast('Contacto creado.'); CT.nuevo = null; CT.cargado = false; ctCarga(); }
    else toast('No se ha podido crear el contacto: ' + sbMensaje(r));
  }, function(){ toast('Sin conexión con Supabase.'); });
}

/* Guarda un campo suelto de la ficha (estado, especificaciones...) sin tener
   que reenviar el resto del contacto. */
function ctGuardaCampo(id, campo, valor){
  var cambios = {}; cambios[campo] = valor;
  sbUpdate('contactos', 'id=eq.'+id, cambios).then(function(r){
    if(r && r.ok){
      var c = ctContactoPorId(id); if(c) c[campo] = valor;
      toast('Guardado.'); renderApp();
    } else toast('No se ha podido guardar: ' + sbMensaje(r));
  });
}

function ctAnadeEvento(){
  var id = CT.det, txt = String(CT.nuevoTexto || '').trim();
  if(!txt){ toast('Escribe una actualización antes de guardarla.'); return; }
  sbInsert('contacto_eventos', {contacto_id:id, autor_id:(SB.sesion && SB.sesion.uid) || null,
    tipo:'nota', texto:txt}).then(function(r){
    if(r && r.ok){ CT.nuevoTexto = ''; toast('Actualización registrada.'); ctCargaDetalle(id); }
    else toast('No se ha podido guardar: ' + sbMensaje(r));
  });
}
function ctAnadeComentario(){
  var id = CT.det, txt = String(CT.nuevoComentario || '').trim();
  if(!txt){ toast('Escribe un comentario antes de enviarlo.'); return; }
  sbInsert('contacto_comentarios', {contacto_id:id, autor_id:(SB.sesion && SB.sesion.uid) || null,
    texto:txt}).then(function(r){
    if(r && r.ok){ CT.nuevoComentario = ''; toast('Comentario añadido.'); ctCargaDetalle(id); }
    else toast('No se ha podido guardar: ' + sbMensaje(r));
  });
}

/* -------------------- DOCUMENTACIÓN · Supabase Storage ------------------- */
function ctSubeArchivo(file){
  var id = CT.det;
  if(!id || !file) return;
  if(file.size > 25*1024*1024){ toast('El archivo supera los 25 MB permitidos.'); return; }
  CT.subiendo = true; renderApp();
  var limpio = String(file.name || 'archivo').replace(/[^A-Za-z0-9.\-_]/g, '_');
  var ruta = 'contactos/' + id + '/' + Date.now() + '-' + limpio;
  sbConSesion(function(){
    return fetch(SB.url + '/storage/v1/object/' + BUCKET_DOCS + '/' + ruta, {
      method:'POST',
      headers:{'apikey':SB.clave, 'Authorization':'Bearer '+((SB.sesion||{}).access_token||SB.clave),
        'Content-Type': file.type || 'application/octet-stream'},
      body:file
    }).then(function(r){ return {ok:r.ok, estado:r.status}; },
            function(){ return {ok:false, estado:0}; });
  }).then(function(r){
    if(!r.ok){
      CT.subiendo = false; renderApp();
      toast(r.estado === 0 ? 'No se ha podido contactar con el almacén de archivos.'
                            : 'No se ha podido subir el archivo (código '+r.estado+').');
      return;
    }
    return sbInsert('contacto_documentos', {contacto_id:id, nombre:file.name, tipo:file.type||'',
      ruta:ruta, tamano_bytes:file.size, subido_por:(SB.sesion && SB.sesion.uid) || null})
      .then(function(ri){
        CT.subiendo = false;
        if(ri && ri.ok){ toast('Documento subido.'); ctCargaDetalle(id); }
        else { toast('El archivo se subió, pero no se pudo registrar: ' + sbMensaje(ri)); renderApp(); }
      });
  });
}
function ctBorraArchivo(docId){
  var id = CT.det;
  sbDelete('contacto_documentos', 'id=eq.'+docId).then(function(r){
    if(r && r.ok){ toast('Documento eliminado.'); ctCargaDetalle(id); }
    else toast('No se ha podido eliminar: ' + sbMensaje(r));
  });
}

function ctFichaHTML(){

/* ==========================================================================
   CENTRO DE DESCARGA DE DOSIERES · Repositorio documental corporativo
   Reutiliza el almacén "documentos" ya existente, bajo su propio prefijo de
   ruta (recursos/...) y sus propias políticas — no toca el módulo de
   Contactos ni el resto de expedientes que comparten el mismo bucket.
   ========================================================================== */
var DS = {
  cargado:false, cargando:false, error:null, lista:[],
  filtro:'', catF:'', subiendo:false,
  nuevo:null,           // {categoria, nombre, descripcion, tipo}
  panelDesc:null,       // id del recurso cuyo panel de descargas está abierto
  descargas:[], descargasCargando:false
};

function dsPuedeGestionar(){ return S.role==='admin' || S.role==='manager'; }

function dsCarga(){
  DS.cargando = true; DS.error = null;
  sbSelect('recursos', 'select=*&order=categoria.asc,creado.desc').then(function(r){
    DS.cargando = false; DS.cargado = true;
    if(r && r.ok){ DS.lista = r.datos || []; }
    else { DS.error = sbMensaje(r); DS.lista = []; }
    renderApp();
  });
}
function dsCategorias(){
  var s = [];
  DS.lista.forEach(function(r){ if(s.indexOf(r.categoria) < 0) s.push(r.categoria); });
  return s;
}
function dsNuevo(){ DS.nuevo = {categoria:'General', nombre:'', descripcion:'', tipo:'pdf'}; renderApp(); }

function dsGuardaNuevo(file){
  var n = DS.nuevo;
  if(!n || !n.nombre.trim()){ toast('Ponle un nombre al dosier antes de subirlo.'); return; }
  if(!file){ toast('Selecciona el archivo PDF o PPTX del dosier.'); return; }
  if(file.size > 25*1024*1024){ toast('El archivo supera los 25 MB permitidos.'); return; }

  DS.subiendo = true; renderApp();
  var limpio = String(file.name || 'archivo').replace(/[^A-Za-z0-9.\-_]/g, '_');
  var ruta = 'recursos/' + Date.now() + '-' + limpio;
  sbConSesion(function(){
    return fetch(SB.url + '/storage/v1/object/' + BUCKET_DOCS + '/' + ruta, {
      method:'POST',
      headers:{'apikey':SB.clave, 'Authorization':'Bearer '+((SB.sesion||{}).access_token||SB.clave),
        'Content-Type': file.type || 'application/octet-stream'},
      body:file
    }).then(function(r){ return {ok:r.ok, estado:r.status}; },
            function(){ return {ok:false, estado:0}; });
  }).then(function(r){
    if(!r.ok){
      DS.subiendo = false; renderApp();
      toast(r.estado === 0 ? 'No se ha podido contactar con el almacén de archivos.'
                            : 'No se ha podido subir el archivo (código '+r.estado+').');
      return;
    }
    return sbInsert('recursos', {
      categoria: n.categoria.trim() || 'General', nombre:n.nombre.trim(),
      descripcion:n.descripcion.trim(), tipo:n.tipo, ruta:ruta, tamano_bytes:file.size,
      subido_por:(SB.sesion && SB.sesion.uid) || null
    }).then(function(ri){
      DS.subiendo = false;
      if(ri && ri.ok){ DS.nuevo = null; toast('Dosier subido al centro de recursos.'); dsCarga(); }
      else { toast('El archivo se subió, pero no se pudo registrar: ' + sbMensaje(ri)); renderApp(); }
    });
  });
}
function dsBorra(id){
  sbDelete('recursos', 'id=eq.'+id).then(function(r){
    if(r && r.ok){ toast('Dosier retirado.'); dsCarga(); }
    else toast('No se ha podido eliminar: ' + sbMensaje(r));
  });
}

/* Descarga + registro de analítica: la descarga en sí nunca depende de que
   el registro se guarde — si el histórico falla, el archivo igualmente baja. */
function dsDescarga(r){
  var nombreArchivo = r.nombre.replace(/\.(pdf|pptx)$/i, '') + '.' + r.tipo;
  descargaDocumento(nombreArchivo, r.ruta);
  sbInsert('recursos_descargas', {recurso_id:r.id, usuario_id:(SB.sesion && SB.sesion.uid) || null});
}

function dsAbrePanelDescargas(id){
  DS.panelDesc = id; DS.descargas = []; DS.descargasCargando = true; renderApp();
  sbSelect('recursos_descargas', 'recurso_id=eq.'+id+'&order=ts.desc&limit=50').then(function(r){
    DS.descargasCargando = false;
    DS.descargas = (r && r.ok) ? (r.datos || []) : [];
    renderApp();

}

    q('#dsn-cancela').onclick = function(){ DS.nuevo = null; renderApp(); };
    q('#dsn-guarda').onclick = function(){
      var f = q('#dsn-file').files && q('#dsn-file').files[0];

/* ==========================================================================
   SISTEMA DE SOPORTE Y TICKETS · Escalado a dos niveles
   Nivel 1 (Responsable de Soporte) = rol manager. Nivel 2 (Responsable del
   Responsable) = rol admin. No se crea ningún rol nuevo: la jerarquía se
   apoya en los cuatro roles de fábrica que ya existen. La asignación
   automática y el escalado los decide la base de datos (10-soporte.sql),
   no el navegador — esta vista solo muestra y dispara lo que ya es real.
   No toca el widget de incidencias del panel de ayuda flotante (SOPORTE /
   TICKETS): ese sigue siendo una demo local, independiente de este módulo.
   ========================================================================== */
var SP = {
  cargado:false, cargando:false, error:null, lista:[],
  filtro:'', filtroEstado:'', filtroPrio:'',
  nuevo:null,          // {titulo, descripcion, categoria, prioridad}
  det:null,            // id de la incidencia abierta en la ficha
  eventos:[], eventosCargando:false,
  nuevoComentario:'', enviando:false
};
var SP_CATEGORIAS = ['Plataforma','Agentes IA','Facturación','Expedientes','Academia','Acceso y permisos','Otros'];
var SP_PRIORIDADES = [['baja','Baja'],['media','Media'],['alta','Alta'],['critica','Crítica']];
var SP_ESTADOS = [['abierto','Abierto'],['en_progreso','En progreso'],['escalado','Escalado'],['resuelto','Resuelto'],['cerrado','Cerrado']];

function spPuedeGestionar(){ return S.role==='admin' || S.role==='manager'; }
function spNombrePrio(p){ var f=SP_PRIORIDADES.filter(function(x){return x[0]===p;})[0]; return f?f[1]:p; }
function spNombreEstado(e){ var f=SP_ESTADOS.filter(function(x){return x[0]===e;})[0]; return f?f[1]:e; }
function spChipPrio(p){
  var cls = p==='critica'?'red':p==='alta'?'amber':p==='media'?'blue':'';
  return '<span class="chip'+(cls?' '+cls:'')+'">'+esc(spNombrePrio(p))+'</span>';
}
function spChipEstado(e){
  var cls = e==='escalado'?'red':e==='en_progreso'?'amber':e==='resuelto'?'green':e==='abierto'?'blue':'';
  return '<span class="chip'+(cls?' '+cls:'')+'">'+esc(spNombreEstado(e))+'</span>';
}
function spNombreUsuario(id){
  if(!id) return '—';
  var u = usuarioPorId(id);
  return u ? u.n : 'Miembro del equipo';
}

function spCarga(){
  SP.cargando = true; SP.error = null;
  sbSelect('tickets', 'select=*&order=creado.desc').then(function(r){
    SP.cargando = false; SP.cargado = true;
    if(r && r.ok){ SP.lista = r.datos || []; }
    else { SP.error = sbMensaje(r); SP.lista = []; }
    renderApp();
  });
}
function spNuevo(){
  SP.nuevo = {titulo:'', descripcion:'', categoria:SP_CATEGORIAS[0], prioridad:'media'};
  renderApp();
}
function spGuardaNuevo(){
  var n = SP.nuevo;
  if(!n.titulo.trim() || n.titulo.trim().length < 4){ toast('Ponle un título de al menos 4 caracteres.'); return; }
  if(!n.descripcion.trim() || n.descripcion.trim().length < 10){ toast('Describe la incidencia con algo más de detalle.'); return; }
  SP.enviando = true; renderApp();
  sbInsert('tickets', {
    titulo:n.titulo.trim(), descripcion:n.descripcion.trim(),
    categoria:n.categoria, prioridad:n.prioridad,
    creado_por:(SB.sesion && SB.sesion.uid) || null
  }).then(function(r){
    SP.enviando = false;
    if(r && r.ok){ SP.nuevo = null; toast('Incidencia registrada.'); spCarga(); }
    else { toast('No se ha podido registrar: ' + sbMensaje(r)); renderApp(); }
  });
}
function spAbre(id){
  SP.det = id; SP.eventos = []; SP.eventosCargando = true; SP.nuevoComentario = ''; renderApp();
  sbSelect('ticket_eventos', 'ticket_id=eq.'+id+'&order=creado.asc').then(function(r){
    SP.eventosCargando = false;
    SP.eventos = (r && r.ok) ? (r.datos || []) : [];
    renderApp();
  });
}
function spCierra(){ SP.det = null; SP.eventos = []; renderApp(); }
function spTicketPorId(id){
  return SP.lista.filter(function(t){ return t.id === id; })[0] ||
    (typeof SD !== 'undefined' ? SD.lista.filter(function(t){ return t.id === id; })[0] : null) || null;
}
/* Refresca ambas listas (la del panel personal y la mesa global) cuando
   una de las dos existe cargada, para que un cambio hecho desde una se
   vea al instante en la otra sin recargar la página. */
function spRefrescaListas(){
  if(SP.cargado) spCarga();
  if(typeof SD !== 'undefined' && SD.cargado) sdCarga();
}

function spCambiaEstado(id, estado){
  sbUpdate('tickets', 'id=eq.'+id, {estado:estado}).then(function(r){
    if(r && r.ok){ toast('Estado actualizado.'); spRefrescaListas(); spAbre(id); }
    else toast('No se ha podido cambiar el estado: ' + sbMensaje(r));
  });
}
function spEscala(id){
  sbRpc('escala_ticket', {p_id:id}).then(function(){
    toast('Incidencia escalada a Nivel 2.'); spRefrescaListas(); spAbre(id);
  }).catch(function(e){
    toast('No se ha podido escalar: ' + ((e && e.message) || 'error'));
  });
}
function spAnadeComentario(){
  var id = SP.det, txt = String(SP.nuevoComentario || '').trim();
  if(!txt){ toast('Escribe un comentario antes de enviarlo.'); return; }
  sbInsert('ticket_eventos', {ticket_id:id, autor_id:(SB.sesion && SB.sesion.uid) || null,
    tipo:'comentario', texto:txt}).then(function(r){
    if(r && r.ok){ SP.nuevoComentario = ''; spAbre(id); }
    else toast('No se ha podido enviar: ' + sbMensaje(r));
  });
}

  return '<div class="ov" data-ov="sp-nuevo"><div class="modal" style="max-width:480px">'+
    '<h3 style="margin:0 0 4px">Abrir incidencia</h3>'+

    '<div class="field"><label class="f">Título *</label><input class="inp" id="spn-titulo" value="'+esc(n.titulo)+'" placeholder="Resume el problema en una línea"></div>'+
    '<div class="grid g-2">'+
      '<div class="field"><label class="f">Categoría</label><select class="inp" id="spn-cat">'+

      '<div class="field"><label class="f">Prioridad</label><select class="inp" id="spn-prio">'+
        SP_PRIORIDADES.map(function(p){ return '<option value="'+p[0]+'"'+(n.prioridad===p[0]?' selected':'')+'>'+p[1]+'</option>'; }).join('')+'</select></div>'+
    '</div>'+
    '<div class="field"><label class="f">Descripción *</label>'+
      '<textarea class="inp" id="spn-desc" rows="5" placeholder="Qué ocurre, en qué módulo y qué esperabas que pasara.">'+esc(n.descripcion)+'</textarea></div>'+
    '<div class="row" style="gap:10px;justify-content:flex-end;margin-top:16px">'+
      '<button class="btn btn-s" id="spn-cancela"'+(SP.enviando?' disabled':'')+'>Cancelar</button>'+
      '<button class="btn btn-p" id="spn-guarda"'+(SP.enviando?' disabled':'')+'>'+
        (SP.enviando ? 'Enviando…' : (ic('send',15)+' Registrar incidencia'))+'</button></div>'+
  '</div></div>';
}

    var col = e.tipo==='escalado' ? 'red' : e.tipo==='cambio_estado' ? 'amber' : 'blue';

          (t.nivel_escalado < 2 ? '<button class="btn btn-s btn-xs" id="sp-escala">'+ic('arrowUp',13)+' Escalar a Nivel 2</button>' : '')+
        '</div>'
      ) : '')+
      '<div class="ay-sec" style="margin-top:0">Historial</div>'+timeline+
      '<div class="field" style="margin-top:14px"><label class="f">Añadir comentario</label>'+
        '<textarea class="inp" id="sp-com-txt" rows="3" placeholder="Escribe una actualización...">'+esc(SP.nuevoComentario)+'</textarea></div>'+
      '<button class="btn btn-p btn-xs" id="sp-com-add">'+ic('send',13)+' Enviar comentario</button>'+
    '</div>'+
    '<div class="ft-foot"><button class="btn btn-s" id="sp-cerrar">Cerrar</button></div>'+

}

    '<div class="row u-filtros">'+
      '<div class="search" style="flex:1;min-width:220px">'+ic('search',15)+

  if(SP.det){

/* ==========================================================================
   SOPORTE GLOBAL DE INCIDENCIAS · Mesa centralizada (/admin-support-desk)
   Reutiliza por completo la infraestructura de tickets de 10-soporte.sql
   (mismas tablas, mismas políticas, mismo escalado): no crea nada nuevo en
   la base salvo la vista de solo lectura tickets_panel (11-soporte-global.sql),
   que calcula el vencimiento de SLA a partir de la prioridad y la fecha de
   apertura reales. Reutiliza también la misma ficha de incidencia que la
   vista personal (spFichaHTML/spAbre/spCierra) para no duplicar ese código.
   Solo visible para quien gestiona soporte (admin y manager, Nivel 1 y 2):
   el resto de roles ya tiene su propia vista personal en /support.
   ========================================================================== */
var SD = {
  cargado:false, cargando:false, error:null, lista:[],
  filtro:'', filtroEstado:'', filtroPrio:'', soloVencidas:false
};

function sdCarga(){

  sbSelect('tickets_panel', 'select=*&order=creado.desc').then(function(r){
    SD.cargando = false; SD.cargado = true;
    if(r && r.ok){ SD.lista = r.datos || []; }
    else { SD.error = sbMensaje(r); SD.lista = []; }

  });
}

function viewAdminSupportDesk(v){

      '<td>'+spChipEstado(t.estado)+(t.nivel_escalado>0?' <span class="chip">N'+t.nivel_escalado+'</span>':'')+'</td>'+
      '<td class="tiny muted nowrap">'+esc(spNombreUsuario(t.asignado_a))+'</td>'+

        '<span class="chip red">'+ic('alert',11)+' '+t.horas_abierta+'h / '+t.sla_horas+'h</span>' :
        '<span class="tiny muted">'+t.horas_abierta+'h / '+t.sla_horas+'h</span>')+'</td>'+
      '<td style="text-align:right"><button class="btn btn-s btn-xs" data-sd-ver="'+t.id+'">'+ic('eye',12)+' Abrir</button></td>'+
    '</tr>';
  }).join('') || '<tr><td colspan="6" class="muted" style="text-align:center;padding:26px">'+

     SD.error ? 'No se ha podido cargar: '+esc(SD.error) :
     'Ninguna incidencia coincide con la búsqueda.')+'</td></tr>';

  v.innerHTML =
  '<div class="grid g-4" style="margin-bottom:16px">'+
    kpis.map(function(k){ return '<div class="card kpi"><div class="row" style="justify-content:space-between">'+
      '<div class="lbl">'+k[0]+'</div><div class="ico-box '+k[3]+'">'+ic(k[2],17)+'</div></div>'+
      '<div class="val">'+k[1]+'</div></div>'; }).join('')+
  '</div>'+
  '<div class="card">'+
    '<div class="card-h" style="margin:0 0 14px;flex-wrap:wrap">'+
      '<div><h3 style="font-size:18px">Soporte Global de Incidencias</h3>'+
        '<p>Todas las incidencias de todos los roles, con el plazo de SLA calculado por prioridad. '+
        'Crítica 4h · Alta 24h · Media 72h · Baja 7 días.</p></div>'+
    '</div>'+
    '<div class="row u-filtros">'+
      '<div class="search" style="flex:1;min-width:220px">'+ic('search',15)+
        '<input id="sd-find" placeholder="Buscar por título, categoría o descripción..." value="'+esc(SD.filtro)+'"></div>'+
      '<select class="inp u-sel" id="sd-fest"><option value="">Todos los estados</option>'+

/* ---------------------- persistencia y propagación ----------------------- */
function cfgCarga(){
  try {
    var raw = window.localStorage.getItem(CFG_CLAVE);
    if(raw){
      var d = JSON.parse(raw);
      ['marca','precios','urls','apis','seg','perms'].forEach(function(k){
        if(d[k]) for(var p in d[k]) if(CFG[k].hasOwnProperty(p)) CFG[k][p] = d[k][p];
      });
    }
  } catch(e){ /* modo incógnito o almacenamiento bloqueado: se usan los valores por defecto */ }
  cfgAplica();
}
function cfgGuarda(){
  cfgAplica();
  try {
    window.localStorage.setItem(CFG_CLAVE, JSON.stringify(CFG));
    return true;
  } catch(e){ return false; }
}
/* Propaga la configuración a los módulos que la consumen */
function cfgAplica(){
  var P = CFG.precios;
  PACKS3D[0].p = P.essential; PACKS3D[1].p = P.pro; PACKS3D[2].p = P.elite;
  ADDONS[0].p = P.vapi; ADDONS[1].p = P.wa; ADDONS[2].p = P.seo;
  PRE.iva = P.iva;
  PERM.estado = CFG.perms.estado.slice();
  PERM.hitos  = CFG.perms.hitos.slice();
  PERM.docs   = CFG.perms.docs.slice();
  PERM.notas  = CFG.perms.notas.slice();
  PERM.borrar = CFG.perms.borrar.slice();
  S.email = CFG.marca.email === CFG_DEFECTO.marca.email ? S.email : S.email;
}

/* ==========================================================================
   PANEL PRINCIPAL EN VIVO · Labs Command Center 360™
   Centro de mando con métricas en movimiento, radar de nodos y flujo de
   actividad. Todos los temporizadores se registran en TIMERS y se destruyen
   al salir de la vista (equivalente a la limpieza de useEffect).
   ========================================================================== */

var TIMERS = [];
function cadaTanto(fn, ms){ TIMERS.push(setInterval(fn, ms)); return fn; }
function paraTimers(){ TIMERS.forEach(clearInterval); TIMERS = []; }
function animacionReducida(){
  try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  catch(e){ return false; }
}

/* ---------------------- utilidades de movimiento ------------------------- */
/* Paseo aleatorio acotado: sube y baja como un dato real, sin dispararse. */
function deriva(valor, min, max, paso){
  var v = valor + (Math.random()-0.45)*paso;
  if(v < min) v = min + Math.random()*paso;
  if(v > max) v = max - Math.random()*paso;
  return v;
}
/* Cuenta atrás/arriba suave entre dos cifras */
function animaCifra(el, desde, hasta, fmt, ms){
  if(!el) return;
  if(animacionReducida()){ el.textContent = fmt(hasta); return; }
  var t0 = performance.now(); ms = ms || 700;
  function paso(t){
    var k = Math.min(1, (t-t0)/ms);
    var e = 1 - Math.pow(1-k, 3);                 // suavizado
    el.textContent = fmt(desde + (hasta-desde)*e);
    if(k < 1) requestAnimationFrame(paso);
  }
  requestAnimationFrame(paso);
}

function arrancaVivo(){
  pintaTrafico();
  for (var i=5; i>=0; i--) nuevaLinea(false, i*37);   // historial escalonado
  pintaMicrolog();
  LIVE.kpis.forEach(function(k){ pintaSpark(k); });

  /* 1. KPI: deriva orgánica cada 3,2 s */
  cadaTanto(function(){
    LIVE.kpis.forEach(function(k){
      var antes = k.v;
      k.v = deriva(k.v, k.min, k.max, k.paso);
      animaCifra(q('#kpi-'+k.id), antes, k.v, k.fmt, 800);
      pintaSpark(k);
    });
  }, 3200);

  /* 2. Latencia de los nodos cada 2,1 s */
  cadaTanto(function(){
    LIVE.nodos.forEach(function(n){
      n.ms = Math.round(deriva(n.ms, 8, 90, 9));
      var el = q('#ms-'+n.id);
      if(el){ el.textContent = n.ms + ' ms'; el.parentNode.parentNode.classList.add('late');
              setTimeout(function(){ el.parentNode.parentNode.classList.remove('late'); }, 400); }
    });
  }, 2100);

  /* 3. Tráfico: ventana móvil cada 1,8 s */
  cadaTanto(function(){
    LIVE.trafico.shift();
    var ult = LIVE.trafico[LIVE.trafico.length-1];
    LIVE.trafico.push(deriva(ult, 18, 96, 22));
    pintaTrafico();
  }, 1800);

  /* 4. Contadores de infraestructura cada 1,4 s */
  cadaTanto(function(){
    LIVE.peticiones += 3 + Math.floor(Math.random()*22);
    var p = q('#peticiones'); if(p) p.textContent = num(LIVE.peticiones);
    var a = q('#activas'); if(a) a.textContent = 3 + Math.floor(Math.random()*9);
    var c = q('#cola');    if(c) c.textContent = Math.floor(Math.random()*5);
  }, 1400);

  /* 5. Flujo de actividad cada 2,6 s */
  cadaTanto(function(){ nuevaLinea(true); }, 2600);

  /* 6. Micrologs sobre el radar cada 3,4 s */
  cadaTanto(pintaMicrolog, 3400);
}

function pintaSpark(k){
  var el = q('#spark-'+k.id);
  if(!el) return;
  /* histórico sembrado con recorrido propio: sin esto la curva nace recta */
  k.serie = k.serie || (function(){
    var s=[], x=k.v;
    for(var i=0;i<16;i++){ x = deriva(x, k.min, k.max, k.paso*1.4); s.push(x); }
    s[s.length-1] = k.v;
    return s;
  })();
  k.serie.shift(); k.serie.push(k.v);
  el.innerHTML = areaChart(k.serie, {px:34, h:22,
    color: k.c==='green'?'#4ADE80' : k.c==='blue'?'#17C8C0' : k.c==='violet'?'#818CF8' : '#FBBF24'});
}

function pintaTrafico(){
  var cont = q('#trafico');
  if(!cont) return;
  var max = Math.max.apply(null, LIVE.trafico);
  var med0 = LIVE.trafico.slice(0,14).reduce(function(a,b){ return a+b; },0)/14;
  var med1 = LIVE.trafico.slice(14).reduce(function(a,b){ return a+b; },0)/14;
  var d = ((med1-med0)/med0)*100;

  cont.innerHTML = LIVE.trafico.map(function(v,i){
    var h = Math.max(6, (v/max)*100);
    var reciente = i >= LIVE.trafico.length-3;
    return '<span class="tb'+(reciente?' hot':'')+'" style="height:'+h.toFixed(1)+'%" '+
      'title="'+Math.round(v)+' interacciones"></span>';
  }).join('');

  var dl = q('#tr-delta');
  if(dl){
    dl.className = 'chip ' + (d>=0 ? 'green' : 'red');
    dl.textContent = (d>=0?'+':'') + d.toFixed(1).replace('.',',') + '%';
  }
  var pk = q('#tr-pico');
  if(pk) pk.textContent = 'pico ' + Math.round(max) + ' int/min';
}

function nuevaLinea(animar, desfase){
  var cont = q('#consola');
  if(!cont) return;
  var f = frase(), intentos = 0;
  while(cont.firstChild && cont.firstChild.textContent.indexOf(f.t) > -1 && intentos++ < 6) f = frase();
  var div = document.createElement('div');
  div.className = 'cl ' + f.k + (animar && !animacionReducida() ? ' entra' : '');
  div.innerHTML = '<span class="hora">'+ahora(desfase)+'</span>'+
    '<span class="et">'+(f.k==='ok'?'CIERRE':f.k==='ia'?'AGENTE IA':'SISTEMA')+'</span>'+
    '<span class="tx">'+esc(f.t)+'</span>';
  cont.insertBefore(div, cont.firstChild);
  while(cont.children.length > 14) cont.removeChild(cont.lastChild);
}

function pintaMicrolog(){
  var cont = q('#microlog');
  if(!cont) return;
  var f = frase();
  var div = document.createElement('div');
  div.className = 'ml';
  div.textContent = f.t;
  cont.insertBefore(div, cont.firstChild);
  while(cont.children.length > 3) cont.removeChild(cont.lastChild);
}

    var p = 0;
    s.k.forEach(function(k){ if(t.indexOf(k) > -1) p += k.length; });
    if(p > puntos){ puntos = p; mejor = s; }
  });
  if(!mejor) return 'No he encontrado eso en la guía de la plataforma. Prueba con otras palabras (presupuesto, expediente, permisos, academia, entrevistas…) o abre una incidencia y lo revisa el equipo técnico.';
  return mejor.r.replace('{REL}', esc(cuentaActiva().rel));
}

    }, 620);
  }

    q('#ch-txt').onkeydown=function(e){ if(e.key==='Enter') envia(this.value); };

    toast('Incidencia '+id+' registrada con la relación '+cuentaActiva().rel+'.');
    renderApp();
  };
}

function copia(txt, msg){
  try {
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast(msg); },
        function(){ toast('Copia manualmente: '+txt); });
    } else toast('Copia manualmente: '+txt);
  } catch(e){ toast('Copia manualmente: '+txt); }
}

/* El directorio se llena desde Supabase al iniciar sesión. Aquí no hay

var USUARIOS = [];

var LOGIN = {mail:'', pass:'', error:'', vista:'acceso', ver:false};
var USU = {form:null, creado:null, filtro:''};

function usuarioPorMail(m){
  m = String(m||'').trim().toLowerCase();
  return USUARIOS.filter(function(u){ return u.mail.toLowerCase() === m; })[0] || null;
}
function entraComo(u){
  S.logged = true; S.name = u.n; S.phone = u.tel; S.email = u.mail; S.role = u.rol;
  S.view = 'dashboard';
  u.ult = 'ahora mismo';
  CUENTAS.forEach(function(c){ c.activa = false; });
  var c = CUENTAS.filter(function(c){ return c.mail === u.mail; })[0];
  if(!c){ CUENTAS.unshift({id:'cu-'+u.id, n:u.n, mail:u.mail, rel:u.rel, rol:u.rol, activa:true}); }
  else c.activa = true;
  renderApp();
}
function claveAleatoria(){
  var may='ABCDEFGHJKLMNPQRSTUVWXYZ', min='abcdefghijkmnopqrstuvwxyz', num='23456789', sig='!@#$%&*';
  function r(s){ return s.charAt(Math.floor(Math.random()*s.length)); }
  var p = r(may)+r(min)+r(min)+r(min)+r(num)+r(num)+r(sig)+r(may)+r(min)+r(num);
  return p.split('').sort(function(){ return Math.random()-0.5; }).join('');
}

/* El portal NO valida credenciales por su cuenta: no existe ninguna
   comprobación local ni ninguna contraseña dentro de este archivo. La
   verificación la hace Supabase, y esta función queda sustituida por la de
   _app14.js, que es la que habla con la base de datos. */
function loginEventos(){
  function intenta(){
    LOGIN.error = 'El acceso necesita conexión con la base de datos.';
    renderLogin();
  }

  if(q('#lg-form')) q('#lg-form').onsubmit = function(e){ e.preventDefault(); intenta(); };
  if(q('#lg-entrar')) q('#lg-entrar').onclick = function(e){ e.preventDefault(); intenta(); };
  if(q('#lg-ver')) q('#lg-ver').onclick = function(){
    LOGIN.mail=q('#lg-mail').value; LOGIN.pass=q('#lg-pass').value;
    LOGIN.ver = !LOGIN.ver; renderLogin(); };

  if(q('#lg-google')) q('#lg-google').onclick = function(){
    /* Lista blanca: solo entran los correos que el administrador ha autorizado. */
    var m = (q('#lg-mail').value || '').trim();
    if(!m){
      LOGIN.error = 'Escribe primero el correo de Google con el que quieres entrar. '+
        'En el sistema real esta selección la hace la ventana de Google.';
      renderLogin(); return;
    }
    var u = usuarioPorMail(m);
    if(!u || !u.google || u.est !== 'Activo'){
      LOGIN.error = 'Acceso no autorizado. Contacta con tu administrador.';
      renderLogin(); return;
    }
    LOGIN.error=''; entraComo(u);
  };

  if(q('#lg-olvido')) q('#lg-olvido').onclick = function(){
    LOGIN.error=''; LOGIN.vista='olvido'; renderLogin(); };
  if(q('#ol-volver')) q('#ol-volver').onclick = function(){
    LOGIN.error=''; LOGIN.vista='acceso'; renderLogin(); };
  if(q('#ol-env')) q('#ol-env').onclick = function(){
    var m=q('#ol-mail').value.trim();
    if(!m){ LOGIN.error='Escribe tu correo corporativo.'; renderLogin(); return; }
    LOGIN.error=''; LOGIN.vista='acceso'; renderLogin();
    toast('Si esa cuenta existe, el administrador ha recibido el aviso.');
  };
  if(q('#lg-help')) q('#lg-help').onclick = function(){
    SOPORTE.abierto = true; SOPORTE.vista='inicio'; renderLogin(); };
  hubEventos();
  if(q('#lg-mail') && !LOGIN.mail) q('#lg-mail').focus();
}

/* Permisos que trae cada rol de fábrica. Debe reflejar exactamente
   permisos_de_rol() en NO-SUBIR-supabase/10-soporte.sql. */
var PERM_ROL = {
  admin:      '*',
  manager:    ['presu.ver','presu.crear','presu.dto','funnel.ver','exp.ver','exp.estado','exp.hitos',
               'exp.docs','hr.ver','hr.mover','hr.contratar','com.llamadas','com.wsp','com.plant','sys.audit',
               'contactos.ver','contactos.crea','contactos.editar','contactos.notas','contactos.comentar','contactos.docs','contactos.borrar',
               'recursos.ver','recursos.subir','recursos.borrar',
               'soporte.ver','soporte.gestionar','soporte.escalar'],
  commercial: ['presu.ver','presu.crear','funnel.ver','exp.ver','exp.docs','com.llamadas','com.wsp',
               'contactos.ver','contactos.crea','contactos.editar','contactos.notas','contactos.comentar','contactos.docs',
               'recursos.ver',
               'soporte.ver'],
  backoffice: ['exp.ver','exp.estado','exp.hitos','exp.docs','exp.borrar','presu.ver','com.llamadas',
               'contactos.ver','contactos.editar','contactos.notas','contactos.comentar','contactos.docs','contactos.borrar',
               'recursos.ver',
               'soporte.ver']
};
function todasLasClaves(){
  var r = []; PERMISOS.forEach(function(g){ g.items.forEach(function(i){ r.push(i.k); }); }); return r;
}
function permisosDeRol(rol){
  var base = PERM_ROL[rol] === '*' ? todasLasClaves() : (PERM_ROL[rol] || []);
  var o = {}; todasLasClaves().forEach(function(k){ o[k] = base.indexOf(k) > -1; });
  return o;
}
/* Formato en el que la API espera los permisos: la lista de claves concedidas.
   Se envían como valores y no como nombres de campo porque el saneamiento del
   servidor rechaza las claves con punto (inyección por ruta anidada).
   Al conectar el panel con labs24k-api-blindada:
     PATCH /api/v1/admin/usuarios/:id  {permisos: permisosParaAPI(u)} */
function permisosParaAPI(u){
  return todasLasClaves().filter(function(k){ return !!u.perms[k]; });
}

/* ==========================================================================
   ROLES Y PERMISOS DINÁMICOS · /admin/roles
   Una plantilla no crea un quinto nivel de acceso: sigue apoyada en uno de
   los cuatro roles base (basado_en), que es lo que las políticas RLS usan
   para decidir "veo lo mío" o "lo veo todo". Lo que aporta la plantilla es
   una variación de permisos granulares y de módulos visibles sobre ese
   nivel base. Aplicarla a un usuario escribe rol, permisos y
   modulos_visibles en su ficha — un guardado puntual, igual que ya hace
   permisos_de_rol() al crear una cuenta, no una relación en vivo.
   Ver NO-SUBIR-supabase/08-roles-personalizados.sql para el esquema y RLS.
   ========================================================================== */
var RA = {lista:[], cargando:false, cargado:false, error:'', editando:null, aplicarA:''};

function raCarga(){
  if(RA.cargando) return;
  RA.cargando = true; RA.error = '';
  sbSelect('roles_personalizados', 'select=*&order=nombre.asc').then(function(r){
    RA.cargando = false; RA.cargado = true;
    if(r && r.ok) RA.lista = r.datos || []; else RA.error = sbMensaje(r);
    renderApp();
  }, function(){ RA.cargando = false; RA.error = 'Sin conexión con Supabase.'; renderApp(); });
}

function raNuevo(){
  RA.editando = {id:null, nombre:'', descripcion:'', basado_en:'commercial', permisos:{}, modulos_visibles:[]};
  renderApp();
}
function raEditar(id){
  var r = RA.lista.filter(function(x){ return x.id===id; })[0]; if(!r) return;
  RA.editando = {id:r.id, nombre:r.nombre, descripcion:r.descripcion||'',
    basado_en:r.basado_en, permisos:Object.assign({}, r.permisos||{}),
    modulos_visibles:(r.modulos_visibles||[]).slice()};
  renderApp();
}
function raClonar(id){
  var r = RA.lista.filter(function(x){ return x.id===id; })[0]; if(!r) return;
  RA.editando = {id:null, nombre:r.nombre+' (copia)', descripcion:r.descripcion||'',
    basado_en:r.basado_en, permisos:Object.assign({}, r.permisos||{}),
    modulos_visibles:(r.modulos_visibles||[]).slice()};

}
function raCierraEditor(){ RA.editando = null; renderApp(); }

function raGuarda(){
  var d = RA.editando;
  if(!d.nombre || d.nombre.trim().length < 2){ toast('Ponle un nombre a la plantilla.'); return; }
  var fila = {nombre:d.nombre.trim(), descripcion:d.descripcion||'', basado_en:d.basado_en,
    permisos:d.permisos, modulos_visibles:d.modulos_visibles};
  var accion = d.id
    ? sbUpdate('roles_personalizados', 'id=eq.'+d.id, fila)
    : sbInsert('roles_personalizados', Object.assign({creado_por:(SB.sesion&&SB.sesion.uid)||null}, fila));
  accion.then(function(r){
    if(r && r.ok){ toast('Plantilla guardada.'); RA.editando = null; RA.cargado = false; raCarga(); }
    else toast('No se ha podido guardar: ' + sbMensaje(r));
  }, function(){ toast('Sin conexión con Supabase.'); });
}
function raBorra(id){
  sbDelete('roles_personalizados', 'id=eq.'+id).then(function(r){
    if(r && r.ok){ toast('Plantilla eliminada.'); raCarga(); }
    else toast('No se ha podido eliminar: ' + sbMensaje(r));
  });
}

/* Aplicar = fijar el rol base, fusionar permisos_de_rol(basado_en) con las
   excepciones de la plantilla, y copiar los módulos visibles. Todo en un
   único guardado sobre la ficha del usuario. */
function raAplica(rolId, userId){
  if(!rolId || !userId){ toast('Elige una plantilla y un usuario.'); return; }
  var r = RA.lista.filter(function(x){ return x.id===rolId; })[0]; if(!r) return;
  var permisosBase = permisosDeRol(r.basado_en);
  var permisosFinal = Object.assign({}, permisosBase, r.permisos||{});
  sbUpdate('perfiles', 'id=eq.'+userId, {
    rol: r.basado_en, permisos: permisosFinal,
    modulos_visibles: (r.modulos_visibles&&r.modulos_visibles.length) ? r.modulos_visibles : null,
    rol_personalizado_id: r.id
  }).then(function(res){
    if(res && res.ok){ toast('Plantilla «'+r.nombre+'» aplicada.'); RA.aplicarA=''; }
    else toast('No se ha podido aplicar: ' + sbMensaje(res));
  }, function(){ toast('Sin conexión con Supabase.'); });
}

/* --------------------- TIEMPO RELATIVO AMIGABLE -------------------------- */
function haceRel(ms){
  if(!ms) return 'sin accesos';
  var d = Date.now() - ms, min = Math.floor(d/60000);
  if(min < 1)   return 'ahora mismo';
  if(min < 60)  return 'hace ' + min + ' min';
  var h = Math.floor(min/60);
  if(h < 24)    return 'hace ' + h + ' h';
  var dd = Math.floor(h/24);
  if(dd === 1)  return 'ayer · ' + new Date(ms).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  if(dd < 31)   return 'hace ' + dd + ' días';
  return new Date(ms).toLocaleDateString('es-ES');
}
function fechaHora(ms){
  return new Date(ms).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',
    hour:'2-digit',minute:'2-digit'});
}

/* ------------- REGISTRO DE ACCESO DE LA CUENTA DE RAÍZ ------------------- */
/* Espejo de lo que la API guarda en logs/root-access.log. Aquí no se puede
   conocer la IP —el navegador no la ve—, así que se muestra lo que sí hay:
   fecha, navegador y sistema. La IP la añade el servidor. */
var ACCESOS_RAIZ = [];
function navegadorActual(){
  var ua = navigator.userAgent || '';
  var nav = /Edg\//.test(ua) ? 'Edge' : /Chrome\//.test(ua) ? 'Chrome' :
            /Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : 'Navegador';
  var so  = /Windows/.test(ua) ? 'Windows' : /Mac OS/.test(ua) ? 'macOS' :
            /iPhone|iPad/.test(ua) ? 'iOS' : /Android/.test(ua) ? 'Android' :
            /Linux/.test(ua) ? 'Linux' : 'sistema desconocido';
  return nav + ' · ' + so;
}
function registraRaiz(evento){
  ACCESOS_RAIZ.unshift({evento:evento, ts:Date.now(), ua:navegadorActual()});
  if(ACCESOS_RAIZ.length > 60) ACCESOS_RAIZ.pop();
}
/* Se amplía entraComo para dejar rastro de las entradas de la cuenta raíz. */
function entraComo(u){
  S.logged = true; S.name = u.n; S.phone = u.tel; S.email = u.mail; S.role = u.rol;
  S.raiz = esRaiz(u); S.view = 'dashboard';
  u.ultMs = Date.now(); u.ult = 'ahora mismo';
  if(esRaiz(u)) registraRaiz('ENTRADA');
  CUENTAS.forEach(function(c){ c.activa = false; });
  var c = CUENTAS.filter(function(x){ return x.mail === u.mail; })[0];
  if(!c) CUENTAS.unshift({id:'cu-'+u.id, n:u.n, mail:u.mail, rel:u.rel, rol:u.rol, activa:true});
  else c.activa = true;
  renderApp();
}

/* ------------------- POLÍTICA DE CONTRASEÑAS CORPORATIVA ----------------- */
var CLAVE_MIN = 10;
function revisaClave(p){
  p = String(p||'');
  var f = [];
  if(p.length < CLAVE_MIN)     f.push('al menos ' + CLAVE_MIN + ' caracteres');
  if(!/[A-ZÁÉÍÓÚÑ]/.test(p))   f.push('una mayúscula');
  if(!/[a-záéíóúñ]/.test(p))   f.push('una minúscula');
  if(!/[0-9]/.test(p))         f.push('un número');
  if(!/[^A-Za-z0-9]/.test(p))  f.push('un símbolo');
  return f;
}

function normalizaUsuario(u, i){
  var p = String(u.n||'').trim().split(/\s+/);
  if(u.nom === undefined) u.nom = p.shift() || '';
  if(u.ape === undefined) u.ape = p.join(' ');
  u.n = (u.nom + ' ' + u.ape).trim();
  if(u.pre === undefined){
    var m = /^(\+\d{1,3})\s*(.*)$/.exec(String(u.tel||'').trim());
    u.pre = m ? m[1] : '+34';
    u.num = m ? m[2] : String(u.tel||'').trim();
  }
  u.tel   = (u.pre + ' ' + u.num).trim();
  if(u.ext    === undefined) u.ext = '';
  if(u.avatar === undefined) u.avatar = null;
  if(u.color  === undefined) u.color = AV_COL[(i||0) % AV_COL.length];
  if(u.perms  === undefined) u.perms = permisosDeRol(u.rol);
  if(u.pref   === undefined) u.pref = preferenciasPorDefecto();
  if(u.tok    === undefined) u.tok = tokenApi();
  if(u.dobleF === undefined) u.dobleF = (u.rol === 'admin');
  if(u.cambiar=== undefined) u.cambiar = false;
  if(u.ses    === undefined) u.ses = [];
  if(u.ultMs  === undefined) u.ultMs = null;
  u.ult = haceRel(u.ultMs);
  return u;
}

/* ============================== EVENTOS ================================== */
function eventosUsuarios(v){
  q('#u-find').onchange = function(){ USU.filtro = this.value; setTimeout(renderApp,0); };
  q('#u-frol').onchange = function(){ USU.rol = this.value; setTimeout(renderApp,0); };
  q('#u-fest').onchange = function(){ USU.est = this.value; setTimeout(renderApp,0); };
  if(q('#u-limpia')) q('#u-limpia').onclick = function(){
    USU.filtro=''; USU.rol=''; USU.est=''; renderApp(); };
  if(q('#u-exp'))  q('#u-exp').onclick  = exportaUsuarios;
  if(q('#au-exp')) q('#au-exp').onclick = exportaBitacora;

  qa('[data-cp]').forEach(function(b){ b.onclick = function(e){
    e.stopPropagation(); copia(b.dataset.cp, 'Copiado: '+b.dataset.cp); }; });

  q('#u-nuevo').onclick = function(){
    USU.form = {nom:'', ape:'', mail:'', pre:'+34', num:'', ext:'',
                rol:'commercial', rel:nuevoRelacion(), pass:claveFuerte(), google:true};
    renderApp(); };

  qa('[data-u-cerrar]').forEach(function(b){ b.onclick = function(){
    USU.form = null; USU.borrar = null; renderApp(); }; });
  qa('.ov').forEach(function(o){ o.onclick = function(e){
    if(e.target !== this) return;
    if(this.dataset.ov === 'detalle') USU.det = null;
    USU.form = null; USU.creado = null; USU.borrar = null; renderApp(); }; });

  /* --- alta --- */
  function leeAlta(){
    var F = USU.form; if(!F || !q('#nu-nom')) return;
    F.nom=q('#nu-nom').value; F.ape=q('#nu-ape').value; F.mail=q('#nu-mail').value;
    F.pre=q('#nu-pre').value; F.num=q('#nu-num').value; F.ext=q('#nu-ext').value;
    F.rol=q('#nu-rol').value; F.rel=q('#nu-rel').value; F.pass=q('#nu-pass').value;
  }
  if(q('#nu-rol'))      q('#nu-rol').onchange   = function(){ leeAlta(); setTimeout(renderApp,0); };
  if(q('#nu-pass'))     q('#nu-pass').onchange  = function(){ leeAlta(); setTimeout(renderApp,0); };
  if(q('#nu-rel-gen'))  q('#nu-rel-gen').onclick = function(){ leeAlta(); USU.form.rel=nuevoRelacion(); renderApp(); };
  if(q('#nu-pass-gen')) q('#nu-pass-gen').onclick= function(){ leeAlta(); USU.form.pass=claveFuerte(); renderApp(); };
  if(q('#nu-goo'))      q('#nu-goo').onclick     = function(){ leeAlta(); USU.form.google=!USU.form.google; renderApp(); };

  if(q('#nu-crear')) q('#nu-crear').onclick = function(){
    leeAlta();
    var F = USU.form;
    if(F.nom.trim().length < 2){ toast('Indica el nombre del usuario.'); return; }
    if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(F.mail.trim())){ toast('El correo no tiene un formato válido.'); return; }
    if(usuarioPorMail(F.mail)){ toast('Ya existe una cuenta con ese correo.'); return; }
    if(F.pre && !/^\+\d{1,3}$/.test(F.pre.trim())){ toast('El prefijo debe ser internacional, como +34.'); return; }
    var fal = revisaClave(F.pass);
    if(fal.length){ toast('La contraseña necesita '+fal.join(', ')+'.'); return; }

    var u = normalizaUsuario({
      id:'u'+Date.now().toString(36), nom:F.nom.trim(), ape:F.ape.trim(),
      n:(F.nom.trim()+' '+F.ape.trim()).trim(), mail:F.mail.trim().toLowerCase(),
      pre:(F.pre.trim()||'+34'), num:F.num.trim(), ext:F.ext.trim(), rol:F.rol, rel:F.rel,
      pass:F.pass, google:F.google, est:'Activo',
      alta:new Date().toLocaleDateString('es-ES'), ultMs:null, ses:[], cambiar:true
    }, USUARIOS.length);
    /* Con Supabase conectado, la identidad la crea la Edge Function: es la
       única que tiene la clave capaz de dar de alta en Auth. */
    sbAltaUsuario({nombre:u.nom, apellidos:u.ape, email:u.mail, prefijo:u.pre,
                   telefono:u.num, extension:u.ext, rol:u.rol, google:u.google,
                   password:u.pass})
    .then(function(r){
      if(!r.ok){ toast(r.mensaje); return; }
      if(r.usuario){ u = deFila(r.usuario, USUARIOS.length); u.pass = r.password; }
      USUARIOS.push(u);
      auditar(u, 'Cuenta creada', ROLES[u.rol].label+' · relación '+u.rel+
        (u.google ? ' · Google autorizado' : ' · solo contraseña'));
      USU.form = null; USU.creado = u; USU.aviso = 'Cuenta creada';
      renderApp();
      sbRecarga();
    });
  };

  if(q('#cr-ok')) q('#cr-ok').onclick = function(){
    toast(USU.creado.n+' · credenciales listas para entregar.'); USU.creado=null; renderApp(); };
  if(q('#cr-copiar')) q('#cr-copiar').onclick = function(){
    var c = USU.creado;
    copia('Acceso a Labs Command Center 360\nUsuario: '+c.mail+'\nContraseña: '+c.pass+
      '\nN.º de relación: '+c.rel+'\nRol: '+ROLES[c.rol].label, 'Credenciales copiadas.'); };

  /* --- acciones de fila --- */
  qa('[data-u-est]').forEach(function(s){ s.onchange = function(){
    var u = usuarioPorId(s.dataset.uEst), nuevo = s.value, ant = u.est;
    if(u.rol === 'admin' && nuevo !== 'Activo' && adminsActivos() <= 1){
      toast('No puedes dejar el sistema sin ningún administrador activo.');
      setTimeout(renderApp,0); return; }
    u.est = nuevo;
    if(nuevo !== 'Activo') u.ses = [];
    sbGuardaUsuario(u).then(function(r){
      if(!r.ok){ u.est = ant; toast(r.mensaje); setTimeout(renderApp,0); return; }
      auditar(u, nuevo==='Activo' ? 'Cuenta reactivada' :
                 nuevo==='Suspendido' ? 'Cuenta suspendida' : 'Cuenta dada de baja',
              'Estado anterior: '+ant+(nuevo!=='Activo' ? '. Sesiones activas cerradas.' : ''));
      toast(u.n+' · '+nuevo.toLowerCase()+'.');
      setTimeout(renderApp,0);
    }); }; });

  qa('[data-u-goo]').forEach(function(b){ b.onclick = function(){
    var u = usuarioPorId(b.dataset.uGoo);
    u.google = !u.google;
    sbGuardaUsuario(u).then(function(r){
      if(!r.ok){ u.google = !u.google; toast(r.mensaje); renderApp(); return; }
      auditar(u, u.google ? 'Google autorizado' : 'Google revocado',
        u.google ? 'Podrá entrar con su cuenta de Google corporativa.' : 'Solo podrá entrar con contraseña.');
      toast(u.google ? 'Google autorizado para '+u.n+'.' : 'Acceso con Google revocado para '+u.n+'.');
      renderApp();
    }); }; });

  qa('[data-u-clave]').forEach(function(b){ b.onclick = function(){
    var u = usuarioPorId(b.dataset.uClave);
    sbResetClave(u.id).then(function(r){
      if(!r.ok){ toast(r.mensaje); return; }
      u.pass = r.password || claveFuerte(); u.cambiar = true; u.ses = [];
      auditar(u, 'Contraseña restablecida', 'Deberá cambiarla en el próximo acceso. Sesiones cerradas.');
      USU.creado = u; USU.aviso = 'Contraseña restablecida'; renderApp();
    }); }; });

  qa('[data-u-del]').forEach(function(b){ b.onclick = function(){
    USU.borrar = usuarioPorId(b.dataset.uDel); renderApp(); }; });

  if(q('#del-si')) q('#del-si').onclick = function(){
    var u = USU.borrar;
    if(u.rol === 'admin'){ toast('La cuenta de administración no se puede eliminar.'); return; }
    sbBorraUsuario(u.id).then(function(r){
      if(!r.ok){ toast(r.mensaje); return; }
      USUARIOS.splice(USUARIOS.indexOf(u), 1);
      auditar(u, 'Cuenta eliminada', 'Relación '+u.rel+' · '+ROLES[u.rol].label);
      USU.borrar = null; toast('Cuenta de '+u.n+' eliminada.'); renderApp();
    }); };
  if(q('#del-baja')) q('#del-baja').onclick = function(){
    var u = USU.borrar, ant = u.est; u.est = 'Dado de baja'; u.ses = [];
    sbGuardaUsuario(u).then(function(r){
      if(!r.ok){ u.est = ant; toast(r.mensaje); renderApp(); return; }
      auditar(u, 'Cuenta dada de baja', 'Se conserva el historial; los accesos quedan revocados.');
      USU.borrar = null; toast(u.n+' · dado de baja.'); renderApp();
    }); };

  qa('[data-u-ver]').forEach(function(b){ b.onclick = function(){
    USU.det = b.dataset.uVer; USU.tab = 'info'; USU.verTok = false; renderApp(); }; });
}

var TABS_U = [

];

              ['V','Viernes'],['S','Sábado'],['D','Domingo']];
var AV_MAX = 2.5 * 1024 * 1024;

function clonUsuario(u){
  var c = {}; for(var k in u) if(Object.prototype.hasOwnProperty.call(u,k)) c[k] = u[k];
  c.perms = {}; for(var p in u.perms) c.perms[p] = u.perms[p];
  c.pref = JSON.parse(JSON.stringify(u.pref));
  c.ses  = u.ses.map(function(s){ var o={}; for(var x in s) o[x]=s[x]; return o; });
  return c;
}
function sw(id, on, etiqueta, nota){
  return '<div class="sw-row" data-sw="'+id+'">'+
    '<div style="flex:1;min-width:0"><div class="small" style="color:#fff">'+esc(etiqueta)+'</div>'+
    (nota ? '<div class="tiny muted" style="margin-top:2px">'+esc(nota)+'</div>' : '')+'</div>'+
    '<span class="sw'+(on?' on':'')+'"><i></i></span></div>';
}

      '<span class="tiny muted">Alta '+esc(u.alta)+' · último acceso '+esc(haceRel(u.ultMs))+'</span>'+

/* ---------------------- 2 · ROLES Y PERMISOS ---------------------------- */
function fichaPermisos(u){
  var base = permisosDeRol(u.rol), esAdmin = u.rol === 'admin', raiz = esRaiz(u);
  var excepciones = todasLasClaves().filter(function(k){ return !!u.perms[k] !== !!base[k]; }).length;

  var bloques = PERMISOS.map(function(g){
    return '<div class="pm-g"><div class="pm-gh">'+ic(g.ic,14)+'<span>'+esc(g.g)+'</span></div>'+
      g.items.map(function(it){
        var on = esAdmin ? true : !!u.perms[it.k];
        var exc = !esAdmin && on !== !!base[it.k];
        return '<div class="pm-i'+(esAdmin?' fijo':'')+'" data-perm="'+it.k+'">'+
          '<span class="sw'+(on?' on':'')+'"><i></i></span>'+
          '<div style="flex:1;min-width:0"><div class="small" style="color:#fff">'+esc(it.n)+
            (exc ? ' <span class="chip amber tiny-chip">excepción</span>' : '')+'</div>'+
          '<div class="tiny muted">'+esc(it.d)+'</div></div>'+
          '<span class="tiny mono" style="color:var(--txt-3);flex:0 0 auto">'+esc(it.k)+'</span></div>';
      }).join('')+'</div>';
  }).join('');

  return '<h4 class="ft-t">Rol y permisos granulares</h4>'+
  '<div class="grid g-2" style="margin-bottom:14px">'+
    '<div class="field"><label class="f">Rol asignado</label>'+
      (raiz
        ? '<input class="inp" value="Administrador · SYSTEM_ADMIN_ROOT" readonly>'+
          '<div class="tiny muted candado-nota">'+ic('shield',12)+
            '<span>'+esc(vetoRaiz(u,'rol'))+'</span></div>'
        : '<select class="inp" id="fp-rol">'+Object.keys(ROLES).map(function(k){
            return '<option value="'+k+'"'+(u.rol===k?' selected':'')+'>'+ROLES[k].label+'</option>'; }).join('')+
          '</select><div class="tiny muted" style="margin-top:6px">'+esc(ROLES[u.rol].desc)+'</div>')+'</div>'+
    '<div class="field"><label class="f">Permisos fuera del rol</label>'+
      '<div class="row" style="gap:9px"><span class="chip '+(excepciones?'amber':'green')+'" style="flex:0 0 auto">'+
        (excepciones ? excepciones+' excepción'+(excepciones>1?'es':'') : 'Sin excepciones')+'</span>'+
      '<button class="btn btn-s" id="fp-reset"'+(esAdmin?' disabled':'')+'>'+ic('refresh',13)+
        ' Restablecer al rol</button></div></div></div>'+
  (raiz
    ? '<div class="nota nota-root">'+ic('shield',15)+'<span>'+esc(vetoRaiz(u,'permisos'))+
      ' Es la garantía de que siempre queda alguien capaz de recuperar el sistema.</span></div>'
   : esAdmin
    ? '<div class="nota nota-v">'+ic('shield',15)+'<span>El rol Administrador tiene acceso total por definición. '+
      'Para limitar a esta persona, cámbiale el rol.</span></div>'
    : '<div class="nota">'+ic('alert',15)+'<span>Cambiar el rol reescribe los permisos con los de fábrica. '+
      'Ajusta después las excepciones que necesites.</span></div>')+
  '<div class="pm">'+bloques+'</div>';
}

      '<input class="inp" id="fl-des" value="'+esc(l.desvio)+'" placeholder="+34 600 000 000 o extensión"></div>'+
  '</div>'+
  sw('fl-grabar', l.grabar, 'Grabar las llamadas',
     'Se guarda el audio en el expediente del cliente. Avisa siempre al interlocutor.')+
