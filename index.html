<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Labs Command Center 360 - Oficina virtual SaaS de la red comercial de Labs24k.">
<meta name="theme-color" content="#0B0F19">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='6' y1='6' x2='58' y2='58' gradientUnits='userSpaceOnUse'><stop stop-color='%232DD4C4'/><stop offset='.55' stop-color='%2317C8C0'/><stop offset='1' stop-color='%231A7F9C'/></linearGradient></defs><rect width='64' height='64' rx='14' fill='%230B0F19'/><g stroke='url(%23g)' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round' fill='none'><path d='M12 20 L32 9 L44 16'/><path d='M52 24 V42 L43 47'/><path d='M32 55 L12 43 V26'/><path d='M20 41 h9 l4 4'/><path d='M39 20 V40'/></g><g fill='url(%23g)'><circle cx='20' cy='41' r='4.6'/><circle cx='39' cy='42' r='5'/><rect x='45' y='11' width='8' height='8' rx='2'/><rect x='55' y='21' width='5' height='5' rx='1.4' opacity='.75'/></g></svg>">
<title>Labs Command Center 360 | Labs24k</title>
<style>
/* ==========================================================================
   LABS COMMAND CENTER 360 - Hoja de estilos corporativa Labs24k
   Sin dependencias externas. Preparada para hosting compartido (Hostalia).
   ========================================================================== */
:root{
  /* Lienzo y superficies */
  --bg:#0B0F19;
  --panel:#0E1420;
  --card:#1F2937;
  --card-2:#111827;
  --line:#253044;
  --line-soft:rgba(148,163,184,.14);
  /* Texto */
  --txt:#F3F4F6;
  --txt-2:#9CA3AF;
  --txt-3:#6B7280;
  /* ---------------------------------------------------------------------
     MARCA LABS24K · tomada del logotipo oficial (labs24k_logotipo.pdf)
     Degradado original: #12B7B0 -> #1A7F9C (55%) -> #16324F
     --------------------------------------------------------------------- */
  --marca-1:#12B7B0;          /* turquesa · inicio del degradado */
  --marca-2:#1A7F9C;          /* azul medio · centro */
  --marca-3:#16324F;          /* marino · final */
  --marca-grad:linear-gradient(100deg,#12B7B0 0%,#1A7F9C 55%,#16324F 100%);
  /* Paradas del isotipo en pantalla: el degradado de marca subido de brillo
     para que el tramo final no se pierda contra el fondo oscuro. Al imprimir
     se sustituyen por los originales (ver @media print). */
  --iso-1:#2DD4C4;
  --iso-2:#17C8C0;
  --iso-3:#1A7F9C;
  /* Acento de interfaz: el turquesa de marca aclarado lo justo para leerse
     sobre el fondo oscuro (9,17:1 frente a 7,68:1 del original). El marino
     solo se usa como superficie: sobre el fondo da 1,46:1. */
  --blue:#17C8C0;
  --blue-d:#0E9C96;
  --cyan:#0FA8A2;
  --sobre-acento:#04231F;     /* texto sobre botón turquesa: 7,95:1 */
  /* Estado. El verde se separa del turquesa de marca para que «correcto» no
     se confunda con «acento». */
  --green:#4ADE80;
  --amber:#FBBF24;
  --red:#F87171;
  --violet:#818CF8;
  --r:16px;
  --r-sm:10px;
  --sidebar:272px;
  --shadow:0 10px 30px -12px rgba(0,0,0,.75);
  --glow:0 0 0 1px rgba(23,200,192,.30), 0 8px 26px -14px rgba(18,183,176,.85);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--blue);text-decoration:none}
svg{display:block}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#253044;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#31435E}

/* ---------- LOGIN ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(1000px 600px at 15% 0%,rgba(23,200,192,.16),transparent 60%),
             radial-gradient(900px 600px at 100% 100%,rgba(74,222,128,.12),transparent 60%),var(--bg)}
.login-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);
  border-radius:22px;padding:34px;box-shadow:var(--shadow)}
.login-card h1{font-size:26px;margin:0 0 4px;letter-spacing:.14em}
.login-card .sub{color:var(--txt-2);font-size:13px;margin:0 0 26px}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.role-opt{border:1px solid var(--line);background:var(--card-2);border-radius:var(--r-sm);
  padding:12px;text-align:left;transition:.16s}
.role-opt:hover{border-color:rgba(23,200,192,.5)}
.role-opt.on{border-color:var(--blue);background:rgba(23,200,192,.12);box-shadow:0 0 0 1px var(--blue) inset}
.role-opt strong{display:block;font-size:13px;color:#fff}
.role-opt span{font-size:11px;color:var(--txt-3)}

/* ---------- LAYOUT ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);flex:0 0 var(--sidebar);background:var(--panel);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh}
.brand{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  justify-content:center}
.badge-role{font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:4px 8px;border-radius:6px;
  background:rgba(23,200,192,.14);color:#99F6E4;border:1px solid rgba(23,200,192,.3);white-space:nowrap}
.nav{flex:1;overflow-y:auto;padding:14px 12px}
.nav-sec{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt-3);
  padding:14px 12px 6px}
.nav-item{width:100%;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;
  color:var(--txt-2);font-size:13.5px;font-weight:500;transition:.15s;text-align:left;margin-bottom:2px}
.nav-item:hover{background:rgba(148,163,184,.08);color:#E2E8F0}
.nav-item.on{background:var(--blue);color:#fff;box-shadow:0 8px 20px -8px rgba(23,200,192,.9)}
.nav-item .dot{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;
  border-radius:20px;padding:1px 7px}
.nav-item.on .dot{background:rgba(255,255,255,.25)}
.user-card{border-top:1px solid var(--line);padding:14px;background:rgba(15,23,42,.5);
  display:flex;align-items:center;gap:11px}
.avatar{width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:rgba(23,200,192,.18);
  border:1px solid rgba(23,200,192,.35);color:#99F6E4;font-weight:700;display:flex;
  align-items:center;justify-content:center}
.user-card .nm{font-size:13px;font-weight:600;color:#fff}
.user-card .ph{font-size:11.5px;color:var(--txt-2)}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:62px;border-bottom:1px solid var(--line);background:rgba(17,24,39,.86);
  backdrop-filter:blur(8px);padding:0 24px;display:flex;align-items:center;gap:16px;
  position:sticky;top:0;z-index:20}
.topbar h2{font-size:16px;font-weight:600;color:#fff;margin:0}
.topbar .crumb{font-size:11px;color:var(--txt-3)}
.spacer{flex:1}
.pill-live{font-size:11px;color:#86EFAC;background:rgba(8,51,68,.4);border:1px solid rgba(14,116,144,.6);
  padding:5px 11px;border-radius:20px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.blip{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blip 1.6s infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
.search{display:flex;align-items:center;gap:8px;background:var(--card-2);border:1px solid var(--line);
  border-radius:10px;padding:7px 12px;width:280px;color:var(--txt-3)}
.search input{background:none;border:none;outline:none;width:100%;font-size:13px}
.icon-btn{width:34px;height:34px;border-radius:10px;background:var(--card-2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--txt-2);transition:.15s;position:relative}
.icon-btn:hover{color:#fff;border-color:#31435E}
.icon-btn .n{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:9px;
  font-weight:700;border-radius:10px;padding:1px 5px}
.burger{display:none}
.content{padding:24px;flex:1}
.view{max-width:1480px;margin:0 auto;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- PRIMITIVAS ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.flat{background:rgba(30,41,59,.6)}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-h h3{margin:0;font-size:14.5px;font-weight:600;color:#fff}
.card-h h3 svg{display:inline-block;vertical-align:-3px;margin-right:5px}
.card-h p{margin:3px 0 0;font-size:12px;color:var(--txt-3)}
.chip{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--line-soft);
  background:var(--card-2);color:var(--txt-2);white-space:nowrap}
.chip.blue{background:rgba(23,200,192,.12);color:#99F6E4;border-color:rgba(23,200,192,.32)}
.chip.green{background:rgba(74,222,128,.12);color:#86EFAC;border-color:rgba(74,222,128,.32)}
.chip.amber{background:rgba(251,191,36,.12);color:#FDE68A;border-color:rgba(251,191,36,.32)}
.chip.red{background:rgba(248,113,113,.12);color:#FCA5A5;border-color:rgba(248,113,113,.32)}
.chip.violet{background:rgba(129,140,248,.12);color:#C7D2FE;border-color:rgba(129,140,248,.32)}
.btn{padding:9px 16px;border-radius:11px;font-size:12.5px;font-weight:600;display:inline-flex;
  align-items:center;gap:8px;transition:.15s;white-space:nowrap}
.btn-p{background:var(--blue);color:#fff;box-shadow:0 8px 18px -8px rgba(23,200,192,.9)}
.btn-p:hover{background:#0FA8A2}
.btn-g{background:var(--green);color:#04231A;box-shadow:0 8px 18px -8px rgba(74,222,128,.9)}
.btn-g:hover{background:#22C55E;color:#fff}
.btn-s{background:#1F2937;color:#CBD5E1;border:1px solid var(--line)}
.btn-s:hover{background:#273244;color:#fff}
.btn-xs{padding:6px 11px;border-radius:9px;font-size:11.5px;font-weight:600}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-hero{grid-template-columns:1.15fr 1fr 1fr}
.g-21{grid-template-columns:2fr 1fr}
.g-cal{grid-template-columns:1.3fr 1fr}
.g-sideR{grid-template-columns:1fr 380px}
.g-sideL{grid-template-columns:340px 1fr}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--txt-3)}
.small{font-size:12px}
.tiny{font-size:11px}
.up{color:#86EFAC}
.down{color:#FCA5A5}
.delta{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:4px}
.delta.up{background:rgba(74,222,128,.14)}
.delta.down{background:rgba(248,113,113,.14)}

/* formularios */
label.f{display:block;font-size:11.5px;font-weight:500;color:var(--txt-2);margin-bottom:6px}
.inp{width:100%;background:var(--card-2);border:1px solid #29354a;border-radius:11px;
  padding:10px 13px;font-size:13px;outline:none;transition:.15s}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,200,192,.14)}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%2394A3B8' stroke-width='2'><path d='M3 5l4 4 4-4'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:34px}
.field{margin-bottom:14px}

/* tablas */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--txt-3);font-weight:600;padding:11px 14px;background:rgba(15,23,42,.6);
  border-bottom:1px solid var(--line)}
.tbl td{padding:13px 14px;font-size:13px;border-bottom:1px solid rgba(31,41,55,.7)}
.tbl tbody tr:hover{background:rgba(148,163,184,.05)}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl .w{color:#fff;font-weight:500}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}

/* barras de progreso */
.bar{height:6px;border-radius:6px;background:rgba(148,163,184,.14);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--blue);transition:width .5s}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}
.legend div{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--txt-2)}
.legend i{width:8px;height:8px;border-radius:3px;display:block}
.stackbar{display:flex;height:9px;border-radius:6px;overflow:hidden;background:rgba(148,163,184,.1)}
.stackbar i{display:block;height:100%}

/* KPI */
.kpi .lbl{font-size:12px;color:var(--txt-2);display:flex;align-items:center;gap:7px}
.kpi .val{font-size:29px;font-weight:700;color:#fff;letter-spacing:-.02em;margin:8px 0 2px}
.ico-box{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line-soft);background:var(--card-2)}
.ico-box.blue{background:rgba(23,200,192,.14);color:#99F6E4;border-color:rgba(23,200,192,.3)}
.ico-box.green{background:rgba(74,222,128,.14);color:#86EFAC;border-color:rgba(74,222,128,.3)}
.ico-box.violet{background:rgba(129,140,248,.14);color:#C7D2FE;border-color:rgba(129,140,248,.3)}
.ico-box.amber{background:rgba(251,191,36,.14);color:#FDE68A;border-color:rgba(251,191,36,.3)}
.ico-box.cyan{background:rgba(15,168,162,.14);color:#5EEAD4;border-color:rgba(15,168,162,.3)}
.ico-box.red{background:rgba(248,113,113,.14);color:#FCA5A5;border-color:rgba(248,113,113,.3)}

/* listas rank */
.rank{display:flex;flex-direction:column;gap:14px}
.rank-it{display:flex;align-items:center;gap:12px}
.rank-it .nm{font-size:12.5px;color:#E2E8F0}
.rank-it .vl{margin-left:auto;font-size:12px;color:var(--txt-2);font-weight:600}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl:before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:1px;background:var(--line)}
.tl-it{position:relative;padding-bottom:16px}
.tl-it:last-child{padding-bottom:0}
.tl-it:before{content:'';position:absolute;left:-19px;top:5px;width:9px;height:9px;border-radius:50%;
  background:var(--blue);box-shadow:0 0 0 3px rgba(23,200,192,.18)}
.tl-it.g:before{background:var(--green);box-shadow:0 0 0 3px rgba(74,222,128,.18)}
.tl-it.a:before{background:var(--amber);box-shadow:0 0 0 3px rgba(251,191,36,.18)}

/* embudo kanban */
.kan{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.kan-col{background:rgba(15,23,42,.6);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:190px}
.kan-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:12px;
  font-weight:600;color:#E2E8F0}
.kan-card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;
  transition:.15s;cursor:pointer}
.kan-card:hover{border-color:rgba(23,200,192,.5);transform:translateY(-1px)}
.kan-card .t{font-size:12.5px;color:#fff;font-weight:500;margin-bottom:5px}

/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:10.5px;text-transform:uppercase;color:var(--txt-3);text-align:center;padding:4px 0;letter-spacing:.06em}
.cal .day{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--card-2);
  padding:6px;font-size:12px;color:var(--txt-2);position:relative;transition:.15s}
.cal .day:hover{border-color:rgba(23,200,192,.5)}
.cal .day.out{opacity:.28}
.cal .day.today{border-color:var(--blue);background:rgba(23,200,192,.12);color:#fff;font-weight:600}
.cal .day .ev{position:absolute;left:6px;right:6px;bottom:6px;display:flex;gap:3px}
.cal .day .ev i{width:5px;height:5px;border-radius:50%;background:var(--blue);display:block}
.cal .day .ev i.g{background:var(--green)}
.cal .day .ev i.a{background:var(--amber)}

/* academia */
.prog-ring{position:relative;width:64px;height:64px}
.mod-card{background:rgba(30,41,59,.6);border:1px solid var(--line);border-radius:var(--r);padding:18px;
  display:flex;flex-direction:column;justify-content:space-between;transition:.16s}
.mod-card:hover{border-color:rgba(23,200,192,.5);transform:translateY(-2px)}

/* documento presupuesto */
.doc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px}
.doc-h{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);
  padding-bottom:18px;margin-bottom:18px}
.doc-line{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px dashed rgba(148,163,184,.16);font-size:13px}
.doc-total{display:flex;justify-content:space-between;align-items:center;background:var(--card-2);
  border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px}

/* toast */
.toast{position:fixed;right:20px;bottom:20px;z-index:100;background:var(--card);
  border:1px solid rgba(74,222,128,.4);border-left:3px solid var(--green);border-radius:12px;
  padding:13px 17px;font-size:13px;color:#D1FAE5;box-shadow:var(--shadow);animation:slide .25s ease}
@keyframes slide{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* modal */
.ov{position:fixed;inset:0;background:rgba(2,6,16,.72);backdrop-filter:blur(3px);z-index:90;
  display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s}
.modal{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:24px;box-shadow:var(--shadow);max-height:88vh;overflow-y:auto}

/* responsive */
@media(max-width:1300px){.g-hero{grid-template-columns:1fr 1fr}.g-hero>.card:first-child{grid-column:1/-1}}
@media(max-width:1200px){.g-4{grid-template-columns:repeat(2,1fr)}
  .g-sideR,.g-sideL,.g-21,.g-cal{grid-template-columns:1fr}}
@media(max-width:1024px){
  .sidebar{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:.25s}
  .sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.7)}
  .burger{display:flex}
  .search{display:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:55}
}
@media(max-width:860px){
  .g-3,.g-2,.g-hero{grid-template-columns:1fr}
  .content{padding:16px}
  .kpi .val{font-size:24px}
  .doc{padding:18px}
}
@media(max-width:600px){
  .g-4{grid-template-columns:1fr}
  .topbar{padding:0 14px}
  .topbar h2{font-size:14px}
  .role-grid{grid-template-columns:1fr}
}

/* =========================================================================
   MARCA · bloque de logotipo
   ====================================================================== */
.marca{display:flex;align-items:center;gap:12px;min-width:0}
.marca.apilada{flex-direction:column;gap:10px;text-align:center}
.marca-col{display:flex;flex-direction:column;gap:3px;min-width:0}
.marca-txt{display:block;flex:0 0 auto}
.marca-lema{font-size:10px;letter-spacing:.08em;color:var(--txt-3);font-style:italic}
.marca-lema.claro{color:#0F766E}
.iso{flex:0 0 auto}

/* En la barra lateral el logotipo manda: sin subtítulo compitiendo con él. */
.brand .bw .marca-txt{margin-bottom:1px}
.login-marca{display:flex;justify-content:center;margin:14px 0 2px}

/* Al imprimir, el isotipo recupera los colores exactos del logotipo oficial:
   sobre papel blanco el marino sí se lee, y es el que corresponde. */
@media print{
  :root{ --iso-1:#12B7B0; --iso-2:#1A7F9C; --iso-3:#16324F; }
  .marca-lema{color:#0F766E!important}
}

/* ==========================================================================
   MODULO DE PRESUPUESTOS: catalogo, documento formal y hoja de ruta
   ========================================================================== */
.pack-list{padding-right:2px}
.pack{background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:13px;
  margin-bottom:9px;cursor:pointer;transition:.15s}
.pack:hover{border-color:#31435E}
.pack.on{border-color:var(--blue);background:rgba(8,145,178,.22);box-shadow:0 8px 22px -14px rgba(23,200,192,.9)}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:.94em;letter-spacing:.01em}
.btn.on-tab{background:var(--blue);color:#fff;border-color:var(--blue)}
.rec{color:#86EFAC}

/* ---------- DOCUMENTO ---------- */
/* HOJA EN BLANCO
   El documento es papel, no interfaz: se ve igual en pantalla que impreso.
   En lugar de repintar cada elemento, se redefinen los colores del sistema
   solo dentro del documento, así todo lo que hay dentro —tablas, chips,
   isotipo, gráficos— cambia de una vez y no queda nada heredado del modo
   oscuro. */
.doc.pdf{
  --bg:#FFFFFF; --panel:#FFFFFF; --card:#FFFFFF; --card-2:#F8FAFC;
  --line:#E2E8F0; --line-soft:#E7EDF4;
  --txt:#0F172A; --txt-2:#475569; --txt-3:#64748B;
  --blue:#0F766E; --blue-d:#115E59; --cyan:#0E9C96;
  --green:#047857; --amber:#B45309; --red:#B91C1C; --violet:#5B21B6;
  --iso-1:#12B7B0; --iso-2:#1A7F9C; --iso-3:#16324F;
  --shadow:0 10px 34px -20px rgba(15,23,42,.45);
  background:#FFFFFF;
  color:#0F172A;
  border:1px solid #E2E8F0;
  border-radius:var(--r);
  padding:34px;
  box-shadow:var(--shadow);
}
.doc.pdf .muted{color:#64748B}
.doc.pdf .w,.doc.pdf strong,.doc.pdf h1,.doc.pdf h2,.doc.pdf h3,.doc.pdf h4{color:#0F172A}
.doc.pdf .tbl th{color:#475569;background:#F8FAFC}
.doc.pdf .tbl td{border-color:#E2E8F0}
.doc.pdf .chip{border-color:#CBD5E1}
.doc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding-bottom:16px;border-bottom:2px solid var(--blue)}
.doc-brand{font-size:20px;font-weight:800;letter-spacing:.14em;color:var(--blue)}
.doc-brand span{color:var(--txt)}
.doc-kicker{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}
.doc-title{font-size:22px;line-height:1.25;font-weight:700;color:var(--txt);margin:22px 0 6px;
  text-wrap:balance;max-width:62ch}
.doc-lead{font-size:13px;color:var(--txt-2);max-width:72ch;margin:0 0 18px}
.doc-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:14px 0;margin:16px 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.doc-meta .k,.doc-parties .k,.doc-sign .k{display:block;font-size:10px;text-transform:uppercase;
  letter-spacing:.09em;color:var(--txt-3);margin-bottom:4px}
.doc-meta .v{font-size:13px;font-weight:600;color:var(--txt)}
.doc-parties{display:grid;grid-template-columns:1fr 1fr;gap:16px;background:var(--card-2);
  border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:20px}
.doc-parties .v.big{font-size:15px;font-weight:700;color:var(--txt)}
.doc-parties .tel{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
  color:var(--blue);margin:3px 0 2px}
.doc-hero{text-align:center;border:1px solid rgba(23,200,192,.4);border-radius:14px;padding:20px;
  margin:6px 0 24px;background:linear-gradient(180deg,rgba(23,200,192,.14),rgba(23,200,192,0))}
.doc-hero .amount{font-size:36px;font-weight:800;color:var(--txt);letter-spacing:-.02em;margin:6px 0 4px;
  font-variant-numeric:tabular-nums}
.doc-sec{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;color:var(--txt-2);margin:26px 0 12px}
.doc-sec .n{width:22px;height:22px;border-radius:6px;background:var(--blue);color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:12px;letter-spacing:0}
.doc-tbl td{vertical-align:top}
.doc-tbl td,.doc-tbl th{font-variant-numeric:tabular-nums}
.doc-sum{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.doc-sum .l{display:flex;justify-content:space-between;gap:16px;padding:11px 16px;font-size:13px;
  border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.doc-sum .l:last-child{border-bottom:none}
.doc-sum .l.tot{background:var(--card-2);font-size:16px;font-weight:800;color:var(--txt);
  border-top:2px solid var(--blue)}
.doc-box{background:var(--card-2);border:1px solid var(--line);border-left:3px solid var(--blue);
  border-radius:10px;padding:15px;margin-bottom:16px}
.doc-box .bt{font-size:12.5px;font-weight:700;color:var(--txt);margin-bottom:8px}
.doc-box .li{font-size:12.5px;color:var(--txt-2);margin-bottom:5px}
.doc-note{font-size:11.5px;color:var(--txt-3);line-height:1.6;padding:12px 0;border-top:1px dashed var(--line)}
.doc-why{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.doc-why>div{text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px}
.doc-why .ok{color:var(--green);display:flex;justify-content:center;margin-bottom:8px}
.doc-why .t{font-size:12.5px;font-weight:700;color:var(--txt);margin-bottom:4px}
.doc-sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin:28px 0 10px}
.doc-sign .line{height:34px;border-bottom:1px solid var(--txt-3);margin:6px 0 8px}
.doc-sign .v{font-size:13px;font-weight:600;color:var(--txt)}
.doc-foot{font-size:10.5px;color:var(--txt-3);text-align:center;padding-top:14px;
  border-top:1px solid var(--line);margin-top:16px;line-height:1.6}

/* ---------- HOJA DE RUTA ---------- */
.week{background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:16px}
.week .wh{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.week .wn{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:var(--blue);color:#fff;
  font-weight:800;display:flex;align-items:center;justify-content:center}
.week .wt{font-size:14px;font-weight:700;color:var(--txt)}
.week .wl{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--txt-2);margin:8px 0}
.week .wl svg{flex:0 0 auto;color:var(--green);margin-top:2px}
.week .wr{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;
  font-weight:600;color:var(--blue)}

@media(max-width:1000px){
  .doc-meta,.doc-why{grid-template-columns:repeat(2,1fr)}
  .doc-parties,.doc-sign{grid-template-columns:1fr}
}
@media(max-width:600px){
  .doc.pdf{padding:18px}
  .doc-meta,.doc-why{grid-template-columns:1fr}
  .doc-hero .amount{font-size:27px}
  .doc-title{font-size:18px}
}

/* ==========================================================================
   IMPRESION / EXPORTACION A PDF: solo el documento, sobre papel blanco
   ========================================================================== */
@media print{
  @page{size:A4;margin:12mm}
  :root{
    --bg:#fff; --panel:#fff; --card:#fff; --card-2:#F8FAFC; --line:#D9E0EA;
    --line-soft:#E5EAF1; --txt:#0B0F19; --txt-2:#475569; --txt-3:#64748B;
  }
  html,body{background:#fff!important;color:#0B0F19!important}
  .app{display:block}
  .main,.content,.view{display:block;padding:0!important;margin:0!important;max-width:none}
  .stack,.grid{display:block!important}
  /* se declara despues para ganar a las reglas de display anteriores */
  .sidebar,.topbar,.toast,.scrim,.no-print,.no-print *{display:none!important}
  .doc.pdf{border:none!important;border-radius:0;padding:0!important;background:#fff!important;
    box-shadow:none;break-inside:auto}
  .doc-hero{background:#ECFEFF!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc-sec .n,.week .wn{background:#17C8C0!important;color:#fff!important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc-top{border-bottom-color:#17C8C0!important}
  .doc-sum .l.tot{background:#F1F5F9!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tbl th{background:#F1F5F9!important;color:#31435E!important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .chip{border-color:#CBD5E1!important;background:#F8FAFC!important;color:#31435E!important}
  .doc-sec,.doc-sign,.doc-why,.doc-box,.week,tr{break-inside:avoid}
  .doc-sec{break-after:avoid}
  .doc-why{display:grid!important;grid-template-columns:repeat(4,1fr)!important;gap:10px}
  .doc-sign,.doc-parties{display:grid!important;grid-template-columns:1fr 1fr!important}
  .doc-meta{display:grid!important;grid-template-columns:repeat(2,1fr)!important;gap:10px 24px}
  /* compactado para que la propuesta entre en el minimo de paginas */
  body{font-size:12px}
  .doc-title{font-size:19px;margin:16px 0 4px}
  .doc-hero{padding:14px;margin:4px 0 16px}
  .doc-hero .amount{font-size:30px}
  .doc-sec{margin:18px 0 9px}
  .tbl td{padding:9px 10px}
  .tbl th{padding:8px 10px}
  .doc-sum .l{padding:8px 12px}
  .doc-sign{margin:20px 0 8px}
  /* texto blanco del tema oscuro: en papel debe ser tinta */
  .doc .w,.doc-tbl .w,.tbl .w{color:#0B0F19!important}
  .rec{color:#047857!important}
  a{color:#0F766E!important;text-decoration:none}
}

/* Cabecera de marca de los documentos: isotipo y logotipo alineados por su
   eje óptico, con el mismo aire arriba y abajo. */
.doc-brand-row{display:flex;align-items:center;gap:15px}
.doc-brand-row .marca-txt{display:block;margin-bottom:3px}
.doc-brand-row > div{display:flex;flex-direction:column;justify-content:center;min-width:0}

/* Los controles que viven dentro de la hoja (quitar línea, etc.) también son
   claros: en papel blanco un botón oscuro canta. */
.doc.pdf .btn-s{background:#F1F5F9;color:#475569;border:1px solid #CBD5E1}
.doc.pdf .btn-s:hover{background:#E2E8F0;color:#0F172A}
.doc.pdf .rec{color:#047857}
.doc.pdf .doc-parties{background:#F8FAFC;border:1px solid #E2E8F0}
.doc.pdf .doc-hero{background:#F0FDFA;border-color:#99F6E4}
.doc.pdf .doc-sec .n{background:#0F766E;color:#fff}
.doc.pdf .tel{color:#0F766E}

/* ==========================================================================
   ACADEMIA / LMS
   ========================================================================== */
.lms-tabs{display:flex;gap:4px;background:var(--card-2);border:1px solid var(--line);
  border-radius:13px;padding:5px}
.lms-tab{padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--txt-2);
  transition:.15s;white-space:nowrap}
.lms-tab:hover{color:#fff}
.lms-tab.on{background:var(--blue);color:#fff;box-shadow:0 6px 16px -8px rgba(23,200,192,.9)}

.course{background:rgba(30,41,59,.6);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;display:flex;flex-direction:column;transition:.16s}
.course:hover{border-color:rgba(23,200,192,.5);transform:translateY(-2px)}
.course .bar{margin-top:auto}

/* reproductor */
.player-video{position:relative;aspect-ratio:16/9;border-radius:14px;border:1px solid var(--line);
  cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(700px 340px at 50% 40%,rgba(23,200,192,.20),transparent 70%),var(--card-2)}
.player-video:before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(148,163,184,.035) 22px 44px)}
.pv-btn{width:74px;height:74px;border-radius:50%;background:var(--blue);color:#fff;display:flex;
  align-items:center;justify-content:center;box-shadow:0 18px 44px -12px rgba(23,200,192,.95);
  transition:.18s;position:relative}
.player-video:hover .pv-btn{transform:scale(1.09)}
.pv-cap{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--txt-3)}
.player-file{text-align:center;padding:38px 20px;border:1px dashed rgba(148,163,184,.28);
  border-radius:14px;background:var(--card-2)}
.player-file .ico-box{margin:0 auto}

/* temario */
.lessons{display:flex;flex-direction:column;gap:7px;max-height:430px;overflow-y:auto;padding-right:3px}
.lesson{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px;
  border-radius:12px;background:var(--card-2);border:1px solid var(--line);transition:.15s}
.lesson:hover{border-color:#31435E}
.lesson.on{border-color:var(--blue);background:rgba(8,145,178,.24)}
.lesson.done .ln{background:rgba(74,222,128,.16);color:#86EFAC;border-color:rgba(74,222,128,.4)}
.lesson .lt{display:block;font-size:12.5px;font-weight:600;color:#E2E8F0;margin-bottom:2px}
.lesson .tiny{display:flex;align-items:center;gap:4px}
.lesson .lk{color:var(--txt-3);flex:0 0 auto}
.ln{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:rgba(23,200,192,.14);
  border:1px solid rgba(23,200,192,.32);color:#99F6E4;font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center}

/* test */
.quiz{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--card-2)}
.qq{margin-bottom:16px}
.qt{font-size:13px;font-weight:600;color:#E2E8F0;margin-bottom:9px}
.qo{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 13px;
  border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--txt-2);
  font-size:12.5px;margin-bottom:7px;transition:.15s}
.qo:hover{border-color:#31435E;color:#E2E8F0}
.qo .dot{width:14px;height:14px;flex:0 0 14px;border-radius:50%;border:2px solid var(--txt-3)}
.qo.sel{border-color:var(--blue);color:#fff}
.qo.sel .dot{border-color:var(--blue);background:var(--blue);box-shadow:inset 0 0 0 2px var(--card)}
.qo.ok{border-color:rgba(74,222,128,.55);background:rgba(74,222,128,.12);color:#A7F3D0}
.qo.ok .dot{border-color:var(--green);background:var(--green)}
.qo.ko{border-color:rgba(248,113,113,.55);background:rgba(248,113,113,.1);color:#FCA5A5}
.qo.ko .dot{border-color:var(--red);background:var(--red)}

@media(max-width:860px){
  .lms-tabs{width:100%;overflow-x:auto}
  .lms-tab{flex:1 0 auto}
}

/* ==========================================================================
   IDENTIDAD DE MARCA · EXPEDIENTES · TALENTO
   ========================================================================== */
:root{
  --brand-teal:#22B8CF;      /* turquesa del isotipo */
  --brand-deep:#0E4B5A;      /* turquesa oscuro del degradado */
}
.logo-mark{width:38px;height:38px;flex:0 0 38px;object-fit:contain;display:block}
.login-logo{width:96px;height:96px;object-fit:contain;margin:0 auto 14px;display:block;
  filter:drop-shadow(0 14px 34px rgba(34,184,207,.32))}
.login-tag{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;text-align:center;
  margin:0 0 20px;color:var(--txt-2);font-style:italic}
.login-tag .c{color:var(--brand-teal)}
.doc-brand-row{display:flex;align-items:center;gap:10px}
.doc-logo{width:36px;height:36px;object-fit:contain}

/* ---------- EXPEDIENTES ---------- */
.exp{background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:14px;
  cursor:pointer;transition:.15s}
.exp:hover{border-color:#31435E}
.exp.on{border-color:var(--blue);background:rgba(8,145,178,.24);
  box-shadow:0 8px 22px -14px rgba(23,200,192,.9)}

.hitos{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.hito{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:13px;
  border-radius:12px;background:var(--card-2);border:1px solid var(--line);text-align:left;
  transition:.15s;min-width:0}
.hito:not(:disabled):hover{border-color:#31435E}
.hito:disabled{cursor:default;opacity:.75}
.hito .hn{width:24px;height:24px;border-radius:8px;background:rgba(148,163,184,.12);
  border:1px solid var(--line);color:var(--txt-3);font-size:11.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.hito .ht{font-size:12px;font-weight:600;color:#CBD5E1;line-height:1.35}
.hito.done{background:rgba(74,222,128,.09);border-color:rgba(74,222,128,.32)}
.hito.done .hn{background:rgba(74,222,128,.18);border-color:rgba(74,222,128,.45);color:#86EFAC}
.hito.done .ht{color:#E2E8F0}
.hito.cur{border-color:var(--blue);background:rgba(8,145,178,.22)}
.hito.cur .hn{background:rgba(23,200,192,.2);border-color:rgba(23,200,192,.5);color:#99F6E4}

.docf{display:flex;align-items:center;gap:11px;padding:12px;border-radius:12px;
  background:var(--card-2);border:1px solid var(--line)}
.notes{display:flex;flex-direction:column;gap:9px;max-height:340px;overflow-y:auto;padding-right:3px}
.note{background:var(--card-2);border:1px solid var(--line);border-left:3px solid var(--blue);
  border-radius:11px;padding:12px}

/* ---------- TALENTO ---------- */
.cand{background:rgba(30,41,59,.6);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;transition:.16s}
.cand:hover{border-color:rgba(23,200,192,.5);transform:translateY(-2px)}
.score{width:38px;height:34px;border-radius:9px;background:var(--card-2);border:1px solid var(--line);
  color:var(--txt-2);font-size:13px;font-weight:700;transition:.14s}
.score:hover{border-color:#31435E;color:#fff}
.score.on{background:var(--blue);border-color:var(--blue);color:#fff}

@media(max-width:1100px){ .hitos{grid-template-columns:repeat(2,1fr)} }
@media(max-width:600px){ .hitos{grid-template-columns:1fr} }

/* etiqueta de rol en la barra superior */
.topbar .badge-role{display:flex;align-items:center;gap:6px;padding:6px 11px;font-size:10.5px}
@media(max-width:700px){ .topbar .badge-role{display:none} }

/* ==========================================================================
   PIPELINE KANBAN DE RECLUTAMIENTO
   ========================================================================== */
.pipe{display:grid;grid-template-columns:repeat(6,minmax(212px,1fr));gap:12px;
  overflow-x:auto;padding-bottom:8px;align-items:start}
.pcol{background:rgba(15,23,42,.6);border:1px solid var(--line);border-radius:16px;padding:11px;
  min-height:420px;transition:.15s}
.pcol.over{border-color:var(--blue);background:rgba(8,145,178,.2);
  box-shadow:inset 0 0 0 1px var(--blue)}
.pch{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;
  border:1px solid;border-radius:10px;font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;margin-bottom:11px}
.pcount{background:var(--card-2);border:1px solid var(--line);color:var(--txt-2);
  border-radius:20px;padding:1px 8px;font-size:11px;letter-spacing:0}
.pbody{display:flex;flex-direction:column;gap:9px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;
  cursor:grab;transition:.15s}
.pcard:hover{border-color:rgba(23,200,192,.55);transform:translateY(-1px)}
.pcard:active{cursor:grabbing}
.pcard.dragging{opacity:.45;border-style:dashed}
.pmeta{display:flex;flex-direction:column;gap:5px;padding-top:9px;border-top:1px solid var(--line)}
.pmeta div{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--txt-2)}
.pact{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:10px}
.pbtn{width:28px;height:26px;border-radius:8px;background:var(--card-2);border:1px solid var(--line);
  color:var(--txt-2);display:flex;align-items:center;justify-content:center;transition:.14s}
.pbtn:hover:not(:disabled){color:#fff;border-color:#31435E}
.pbtn.go{color:#99F6E4;border-color:rgba(23,200,192,.4);background:rgba(23,200,192,.12)}
.pbtn.go:hover:not(:disabled){background:var(--blue);color:#fff}
.pbtn:disabled{opacity:.3;cursor:default}
.pempty{height:96px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);
  border-radius:12px;color:var(--txt-3);font-size:11px}

@media(max-width:1400px){ .pipe{grid-template-columns:repeat(6,212px)} }
@media(max-width:600px){ .pipe{grid-template-columns:repeat(6,86vw);gap:10px} }

/* ==========================================================================
   PACKS WEB 3D
   ========================================================================== */
.p3{background:var(--card-2);border:1px solid var(--line);border-radius:16px;padding:18px;
  cursor:pointer;transition:.16s;display:flex;flex-direction:column}
.p3:hover{border-color:#31435E;transform:translateY(-2px)}
.p3.on{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 10%,var(--card-2));
  box-shadow:0 0 0 1px var(--pc) inset,0 14px 34px -20px var(--pc)}
.p3price{font-size:26px;font-weight:800;color:var(--pc);letter-spacing:-.02em;margin-bottom:14px;
  font-variant-numeric:tabular-nums}
.p3price span{font-size:12px;font-weight:500;color:var(--txt-3);letter-spacing:0}
.p3list{list-style:none;margin:0 0 auto;padding:0;display:flex;flex-direction:column;gap:8px}
.p3list li{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--txt-2);line-height:1.45}
.p3list li span{color:var(--green);flex:0 0 auto;margin-top:1px}
.p3foot{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);text-align:center;
  font-size:11px;font-weight:600;color:var(--txt-3);display:flex;align-items:center;
  justify-content:center;gap:6px}
.p3.on .p3foot{color:var(--pc)}

.addon{display:flex;align-items:center;gap:12px;padding:13px;border-radius:13px;
  background:var(--card-2);border:1px solid var(--line);cursor:pointer;transition:.15s}
.addon:hover{border-color:#31435E}
.addon.on{border-color:var(--green);background:rgba(74,222,128,.09)}
.addon .tick{width:22px;height:22px;flex:0 0 22px;border-radius:7px;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:#04231A}
.addon.on .tick{background:var(--green);border-color:var(--green)}

.sticky{position:sticky;top:78px}
.argu{margin-top:14px;background:rgba(8,145,178,.22);border:1px solid rgba(23,200,192,.32);
  border-radius:12px;padding:13px}
.argu p{margin:7px 0 0;font-size:11.5px;line-height:1.55;color:#CBD5E1;font-style:italic}

@media(max-width:1200px){ .sticky{position:static} }

/* prestaciones del pack: dos columnas alineadas a la izquierda, tambien en papel */
.doc-feats{grid-template-columns:repeat(2,1fr)!important;text-align:left}
.doc-feats>div{text-align:left}
@media print{ .doc-feats{grid-template-columns:repeat(2,1fr)!important} }
@media(max-width:700px){ .doc-feats{grid-template-columns:1fr!important} }

/* enlaces que se comportan como botones */
a.btn{text-decoration:none}
a.btn.btn-g{color:#04231A}
a.btn.btn-g:hover{color:#fff}

/* ---------- CENTRO DE CONFIGURACION ---------- */
.cfg-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;
  border-radius:11px;font-size:12.5px;font-weight:600;color:var(--txt-2);transition:.15s}
.cfg-item:hover{background:rgba(148,163,184,.08);color:#E2E8F0}
.cfg-item.on{background:var(--blue);color:#fff;box-shadow:0 8px 20px -10px rgba(23,200,192,.9)}
.perm{width:30px;height:28px;border-radius:8px;background:var(--card-2);border:1px solid var(--line);
  color:#04231A;display:inline-flex;align-items:center;justify-content:center;transition:.14s}
.perm:hover{border-color:#31435E}
.perm.on{background:var(--green);border-color:var(--green)}

/* ==========================================================================
   MARCA VECTORIAL Y ACENTO CIAN
   ========================================================================== */
.iso{display:block;flex:0 0 auto;filter:drop-shadow(0 0 10px rgba(23,200,192,.28))}
.login-logo{display:flex;justify-content:center;margin-bottom:14px}
.login-logo .iso{filter:drop-shadow(0 14px 34px rgba(23,200,192,.42))}
.doc-logo{display:inline-flex}
.doc-brand{color:var(--blue)}

/* botón de perfil de la cabecera */
.perfil{display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:10px;
  background:rgba(23,200,192,.09);border:1px solid rgba(23,200,192,.3);color:#99F6E4;
  font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
  transition:.15s;white-space:nowrap}
.perfil:hover{background:rgba(23,200,192,.16);border-color:var(--blue);color:#fff}
@media(max-width:820px){ .perfil span{display:none} }

/* los contadores del menú dejan de ser rojos: son avisos, no errores */
.nav-item .dot{background:rgba(23,200,192,.18);color:#5EEAD4;border:1px solid rgba(23,200,192,.4)}
.nav-item.on .dot{background:rgba(255,255,255,.22);color:#fff;border-color:transparent}
.icon-btn .n{background:var(--blue);color:#062A33}

/* resplandor cian en los elementos activos */
.nav-item.on{box-shadow:var(--glow)}
.btn-p{box-shadow:0 8px 20px -10px rgba(23,200,192,.9)}
.btn-p,.lms-tab.on,.pv-btn{color:#062A33}
.btn-p:hover{color:#062A33}
.card:hover{border-color:rgba(23,200,192,.22)}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,200,192,.16)}

/* en papel el cian se oscurece para que tenga contraste */
@media print{
  .iso{filter:none}
  .doc-brand,.doc-kicker,.doc-parties .tel,.week .wr{color:#0F766E!important}
  .doc-sec .n,.week .wn{background:#0F766E!important}
  .doc-top{border-bottom-color:#0F766E!important}
  .doc-sum .l.tot{border-top-color:#0F766E!important}
  .doc-hero{background:#ECFEFF!important;border-color:#99F6E4!important}
}

/* ==========================================================================
   PANEL EN VIVO · cristal oscuro, pulsos y radar
   ========================================================================== */
.glass{position:relative;background:linear-gradient(160deg,rgba(30,41,59,.92),rgba(15,23,42,.86));
  border:1px solid rgba(148,163,184,.13);backdrop-filter:blur(9px);
  box-shadow:0 18px 44px -28px rgba(0,0,0,.9), 0 0 0 1px rgba(23,200,192,.04)}
.glass:after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,rgba(23,200,192,.07),transparent 42%)}
.glass>*{position:relative;z-index:1}

/* --- barra de nodos --- */
.nodos{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.nodo{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:14px;
  background:linear-gradient(160deg,rgba(30,41,59,.9),rgba(15,23,42,.85));
  border:1px solid var(--line);transition:border-color .3s}
.nodo.late{border-color:var(--nc)}
.halo{position:relative;width:12px;height:12px;flex:0 0 12px;display:flex;align-items:center;justify-content:center}
.halo:before{content:'';position:absolute;width:12px;height:12px;border-radius:50%;
  background:var(--nc);opacity:.35;animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}
.punto{width:7px;height:7px;border-radius:50%;background:var(--nc);position:relative;z-index:1}
@keyframes ping{75%,100%{transform:scale(2.4);opacity:0}}
.pulso{width:7px;height:7px;border-radius:50%;background:var(--nc,#4ADE80);
  animation:latido 1.9s ease-in-out infinite}
@keyframes latido{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}

/* --- KPI --- */
.kpi .val.tick{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .spark{margin:10px -2px -4px}

/* --- radar --- */
.radar-wrap{position:relative;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.radar{width:190px;height:190px;flex:0 0 190px}
.barrido{transform-origin:100px 100px;animation:gira 4.5s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.onda{animation:onda 2.6s ease-out infinite}
@keyframes onda{0%{r:7;opacity:.9}100%{r:46;opacity:0}}
.nodo-r{animation:parpadeo 3.2s ease-in-out infinite}
.nodo-r:nth-of-type(2){animation-delay:.9s}
.nodo-r:nth-of-type(3){animation-delay:1.8s}
@keyframes parpadeo{0%,100%{opacity:1}50%{opacity:.28}}
.microlog{flex:1;min-width:170px;display:flex;flex-direction:column;gap:7px}
.ml{font-size:11px;color:var(--txt-2);background:var(--card-2);border:1px solid var(--line);
  border-left:2px solid var(--green);border-radius:9px;padding:8px 10px;
  animation:aparece .45s ease}
.ml:nth-child(2){opacity:.72}
.ml:nth-child(3){opacity:.45}
@keyframes aparece{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* --- trafico --- */
.trafico{display:flex;align-items:flex-end;gap:3px;height:132px}
.tb{flex:1;min-width:0;border-radius:3px 3px 1px 1px;
  background:linear-gradient(180deg,#17C8C0,rgba(23,200,192,.12));
  transition:height .55s cubic-bezier(.4,0,.2,1),background .3s}
.tb.hot{background:linear-gradient(180deg,#4ADE80,rgba(74,222,128,.14))}
.tb:hover{background:linear-gradient(180deg,#99F6E4,rgba(147,197,253,.2))}

/* --- consola --- */
.consola{max-height:268px;overflow-y:auto;padding:0 18px 18px;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.cl{display:flex;gap:9px;align-items:flex-start;padding:7px 0;
  border-bottom:1px solid rgba(31,41,55,.7);font-size:11.5px;line-height:1.45}
.cl.entra{animation:entraLinea .4s ease}
@keyframes entraLinea{from{opacity:0;transform:translateX(-10px);background:rgba(74,222,128,.1)}
  to{opacity:1;transform:none;background:transparent}}
.cl .hora{color:var(--txt-3);flex:0 0 auto}
.cl .et{flex:0 0 62px;font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:2px 0;
  border-radius:4px;text-align:center}
.cl.ok .et{background:rgba(74,222,128,.16);color:#86EFAC}
.cl.ia .et{background:rgba(129,140,248,.16);color:#C7D2FE}
.cl.net .et{background:rgba(23,200,192,.16);color:#99F6E4}
.cl .tx{color:#CBD5E1;flex:1;min-width:0}

@media(max-width:1100px){ .nodos{grid-template-columns:repeat(2,1fr)} }
@media(max-width:600px){
  .nodos{grid-template-columns:1fr}
  .radar{width:150px;height:150px;flex:0 0 150px;margin:0 auto}
  .trafico{height:104px}
}

/* Respeta la preferencia del sistema de reducir el movimiento */
@media (prefers-reduced-motion: reduce){
  .barrido,.onda,.nodo-r,.halo:before,.pulso,.blip{animation:none!important}
  .ml,.cl.entra{animation:none!important}
  .tb{transition:none}
}

/* ==========================================================================
   ACCIONES RÁPIDAS DE CABECERA · MENÚS · PANEL DE AYUDA
   ========================================================================== */
.hub{display:flex;align-items:center;gap:8px}
.hb{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--card-2);border:1px solid var(--line);color:var(--txt-2);transition:.15s;position:relative}
.hb:hover{color:#fff;border-color:#31435E;transform:translateY(-1px)}
.hb.violeta{background:rgba(129,140,248,.16);border-color:rgba(129,140,248,.38);color:#C7D2FE}
.hb.verde{background:rgba(74,222,128,.16);border-color:rgba(74,222,128,.38);color:#86EFAC}
.hb.ayuda{background:rgba(23,200,192,.16);border-color:rgba(23,200,192,.4);color:#99F6E4}
.hb.ia{width:auto;border-radius:20px;padding:0 15px;gap:7px;font-size:12px;font-weight:700;
  background:linear-gradient(120deg,#0E9C96,#17C8C0);border:none;color:#062A33;
  box-shadow:0 8px 22px -10px rgba(23,200,192,.95)}
.hb.ia:hover{filter:brightness(1.1)}
.hb.cuenta{padding:0;overflow:hidden}
.hb .n{position:absolute;top:-4px;right:-4px;background:var(--blue);color:#062A33;font-size:9px;
  font-weight:800;border-radius:10px;padding:1px 5px}
.ava{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(140deg,#0F766E,#17C8C0);color:#062A33;font-weight:800;font-size:13px}
.ava.g{width:42px;height:42px;font-size:17px;flex:0 0 42px}
.ava.sm{width:26px;height:26px;font-size:11px;flex:0 0 26px}

/* menús flotantes */
.pop{position:absolute;top:56px;z-index:70;width:290px;background:var(--card);
  border:1px solid var(--line);border-radius:15px;padding:8px;box-shadow:var(--shadow);
  animation:popIn .16s ease}
.pop-idioma{right:96px;width:232px}
.pop-cuenta{right:70px}
@keyframes popIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.pop-h{display:flex;gap:11px;align-items:center;padding:10px;border-radius:11px;
  background:var(--card-2);margin-bottom:8px}
.pop-h .pn{font-size:13.5px;font-weight:700;color:#fff}
.pop-h .pm{font-size:11.5px;color:var(--txt-2)}
.pop-h .prel{font-size:10.5px;color:#99F6E4;display:flex;align-items:center;gap:5px;margin-top:4px}
.pop-t{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--txt-3);padding:9px 10px 5px}
.pop-it{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border-radius:10px;
  font-size:12.5px;color:var(--txt-2);transition:.14s;text-align:left}
.pop-it:hover{background:rgba(148,163,184,.09);color:#fff}
.pop-it.on{background:rgba(23,200,192,.12);color:#99F6E4}
.pop-sep{height:1px;background:var(--line);margin:8px 4px}
.pop-roles{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:0 6px 4px}
.rol-b{padding:7px;border-radius:9px;font-size:11px;font-weight:600;background:var(--card-2);
  border:1px solid var(--line);color:var(--txt-2);transition:.14s}
.rol-b:hover{color:#fff;border-color:#31435E}
.rol-b.on{background:var(--blue);border-color:var(--blue);color:#062A33}
.pop-n{font-size:10.5px;color:var(--txt-3);padding:8px 10px 4px;line-height:1.5;border-top:1px solid var(--line);margin-top:6px}

/* panel lateral de ayuda */
.drawer-ov{position:fixed;inset:0;background:rgba(2,6,16,.66);backdrop-filter:blur(3px);z-index:80;
  animation:fade .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:432px;z-index:81;
  background:linear-gradient(180deg,#131C2B,#0F1622);border-left:1px solid var(--line);
  display:flex;flex-direction:column;box-shadow:-30px 0 60px -30px rgba(0,0,0,.9);
  animation:entraD .26s cubic-bezier(.4,0,.2,1)}
@keyframes entraD{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.drawer-h{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer-b{flex:1;overflow-y:auto;padding:20px}
.drawer-f{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:13px 20px;border-top:1px solid var(--line);background:var(--card-2)}
.rel-chip{display:flex;align-items:center;gap:7px;font-size:11px;color:#99F6E4;
  background:rgba(23,200,192,.1);border:1px solid rgba(23,200,192,.3);border-radius:20px;padding:5px 11px}
.rel-chip strong{font-family:ui-monospace,Menlo,Consolas,monospace}
.cop{color:#99F6E4;opacity:.7;display:flex}
.cop:hover{opacity:1}

/* asistente */
.asis{text-align:center;padding:22px 18px;border-radius:16px;border:1px solid rgba(23,200,192,.22);
  background:radial-gradient(420px 180px at 50% 0%,rgba(23,200,192,.14),transparent 70%),var(--card-2);
  margin-bottom:18px}
.asis-av{position:relative;width:66px;height:66px;margin:0 auto;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#062A33;
  background:linear-gradient(140deg,#0E9C96,#5EEAD4);box-shadow:0 10px 30px -12px rgba(23,200,192,.9)}
.asis-av.sm{width:38px;height:38px;flex:0 0 38px;margin:0}
.anillo{position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(23,200,192,.45);
  animation:anillo 2.6s ease-out infinite}
@keyframes anillo{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.asis-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.prem{border:1px solid rgba(251,191,36,.3);background:rgba(251,191,36,.07);border-radius:13px;
  padding:14px;margin-bottom:6px}
.ay-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--txt-3);
  margin:20px 0 10px}
.ay-link,.tk{display:flex;align-items:center;gap:11px;width:100%;padding:12px;border-radius:12px;
  background:var(--card-2);border:1px solid var(--line);color:var(--txt-2);margin-bottom:8px;transition:.14s}
.ay-link:hover,.tk:hover{border-color:rgba(23,200,192,.4);transform:translateX(2px)}

/* chat */
.chat-hd{display:flex;align-items:center;gap:11px;padding-bottom:14px;border-bottom:1px solid var(--line);
  margin-bottom:14px}
.chat{display:flex;flex-direction:column;gap:11px;max-height:min(46vh,360px);overflow-y:auto;padding-right:4px}
.msg{display:flex;gap:8px;align-items:flex-end}
.msg.yo{justify-content:flex-end}
.mav{width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;background:linear-gradient(140deg,#0E9C96,#5EEAD4);color:#062A33}
.bur{max-width:82%;padding:11px 13px;border-radius:14px;font-size:12.5px;line-height:1.55}
.msg.ia .bur{background:var(--card-2);border:1px solid var(--line);color:#CBD5E1;border-bottom-left-radius:5px}
.msg.yo .bur{background:var(--blue);color:#062A33;font-weight:500;border-bottom-right-radius:5px}
.bur strong{color:#fff}
.msg.ia .bur strong{color:#99F6E4}
.bur.esc{display:flex;gap:4px;padding:14px}
.bur.esc i{width:6px;height:6px;border-radius:50%;background:var(--txt-3);animation:esc 1.1s infinite}
.bur.esc i:nth-child(2){animation-delay:.16s}
.bur.esc i:nth-child(3){animation-delay:.32s}
@keyframes esc{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.sug{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.sug-b{font-size:11px;padding:7px 11px;border-radius:20px;background:var(--card-2);
  border:1px solid var(--line);color:var(--txt-2);transition:.14s;text-align:left}
.sug-b:hover{border-color:var(--blue);color:#99F6E4}
.chat-in{display:flex;gap:8px;margin-top:14px}
.chat-in .inp{flex:1}
.zoom-url{font-size:11.5px;color:#99F6E4;background:var(--card);border:1px solid var(--line);
  border-radius:9px;padding:9px;word-break:break-all}

@media(max-width:520px){
  .drawer{max-width:100%}
  .pop{right:12px!important;left:12px;width:auto}
  .hb.ia span{display:none}
  .hb.ia{width:36px;padding:0;border-radius:50%}
}

/* la cabecera no debe comprimir ni solapar los botones */
.topbar{gap:12px}
.hub,.hb{flex:0 0 auto}
.topbar .search{flex:0 1 280px;min-width:0}
@media(max-width:1500px){ .topbar .pill-live{display:none} }
@media(max-width:1180px){ .topbar .search{display:none} }

/* En pantallas estrechas la fila de accesos de la cabecera desbordaba unos
   píxeles y hacía que toda la página se pudiera arrastrar en horizontal. Se
   permite que envuelva y se recorta el aire entre botones. */
@media(max-width:520px){
  .hub{flex-wrap:wrap;justify-content:flex-end;gap:6px;min-width:0}
  .topbar{flex-wrap:wrap;row-gap:8px}
}

/* ==========================================================================
   PORTAL DE ACCESO PRIVADO Y GESTIÓN DE USUARIOS
   ========================================================================== */
/* En columna: la tarjeta, el distintivo de conexion y el boton de
   comprobacion se apilan y quedan centrados. En fila se colocaban al lado de
   la tarjeta y se salian por la derecha. */
.login-wrap{position:relative;min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(900px 520px at 50% -8%,rgba(23,200,192,.14),transparent 62%),
             radial-gradient(700px 480px at 100% 100%,rgba(14,116,144,.16),transparent 60%),var(--bg)}
.login-card{width:100%;max-width:430px;background:linear-gradient(165deg,rgba(31,41,55,.94),rgba(17,24,39,.92));
  border:1px solid rgba(148,163,184,.14);border-radius:22px;padding:34px 32px 26px;
  backdrop-filter:blur(12px);box-shadow:0 30px 70px -34px rgba(0,0,0,.95),0 0 0 1px rgba(23,200,192,.06)}
.login-card h1{font-size:25px;margin:0 0 5px;letter-spacing:.15em;font-weight:800;color:var(--blue)}
.login-card h1 span{color:var(--txt)}

.lg-form{display:block;margin-top:22px}
.lg-inp{position:relative;display:flex;align-items:center}
.lg-inp>svg{position:absolute;left:13px;color:var(--txt-3);pointer-events:none}
.lg-inp .inp{padding-left:38px;padding-right:38px}
.lg-ojo{position:absolute;right:11px;color:var(--txt-3);display:flex}
.lg-ojo:hover{color:var(--blue)}
.lg-btn{width:100%;justify-content:center;margin-top:6px;padding:12px}
.lg-err{display:flex;gap:9px;align-items:flex-start;background:rgba(248,113,113,.1);
  border:1px solid rgba(248,113,113,.35);border-radius:11px;padding:11px 13px;margin-bottom:14px;
  font-size:12px;color:#FCA5A5;line-height:1.5;animation:sacude .3s}
.lg-err svg{flex:0 0 auto;margin-top:1px}
@keyframes sacude{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.lg-sep{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--txt-3);font-size:11px}
.lg-sep:before,.lg-sep:after{content:'';flex:1;height:1px;background:var(--line)}
.lg-google{width:100%;justify-content:center;gap:10px;background:#fff;color:#3c4043;
  font-weight:600;padding:12px;border:1px solid #dadce0}
.lg-google:hover{background:#f5f6f7;box-shadow:0 2px 8px rgba(0,0,0,.28)}
.lg-link{display:block;width:100%;text-align:center;margin-top:14px;font-size:12px;
  color:var(--txt-2);background:none;border:none}
.lg-link:hover{color:var(--blue);text-decoration:underline}
.lg-cerrado{display:flex;gap:9px;align-items:flex-start;margin-top:22px;padding-top:16px;
  border-top:1px solid var(--line);font-size:11px;color:var(--txt-3);line-height:1.55}
.lg-cerrado svg{flex:0 0 auto;margin-top:1px;color:var(--blue)}
.lg-ayuda{position:absolute;top:22px;right:22px;display:flex;align-items:center;gap:8px;
  padding:9px 14px;border-radius:22px;background:rgba(23,200,192,.1);
  border:1px solid rgba(23,200,192,.3);color:#99F6E4;font-size:12px;font-weight:600;transition:.15s}
.lg-ayuda:hover{background:rgba(23,200,192,.18);color:#fff}
.lg-demo{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:11px;color:var(--txt-3)}
.lg-demo .lg-link{display:inline;width:auto;margin:0;color:var(--blue)}

/* credenciales generadas */
.cred{background:var(--card-2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cr{display:flex;justify-content:space-between;gap:14px;padding:11px 14px;font-size:12.5px;
  border-bottom:1px solid var(--line)}
.cr:last-child{border-bottom:none}
.cr span{color:var(--txt-3)}
.cr strong{color:#fff;text-align:right;word-break:break-all}

@media(max-width:520px){
  .login-card{padding:26px 20px 20px}
  .lg-ayuda span{display:none}
  .lg-ayuda{padding:9px}
}

/* el eslogan solo aparece en el portal y al pie de los documentos */
.login-lema{font-size:12px;font-style:italic;color:var(--blue);text-align:center;margin:0 0 4px;
  letter-spacing:.01em}
.login-tag{font-size:10px;letter-spacing:.11em;text-transform:uppercase;text-align:center;
  color:var(--txt-3);margin:0 0 4px;font-style:normal}
.doc-foot .lema{color:var(--blue);font-style:italic;letter-spacing:.02em}
@media print{ .doc-foot .lema{color:#0F766E!important} }

/* Pie del portal: solo informa del estado de la conexión. No hay ningún
   acceso rápido ni entrada de demostración. */
.lg-pie{display:flex;justify-content:center;margin-top:18px;min-height:30px;
  width:100%;max-width:430px}

/* ------------------ COMPROBACIÓN DE LA CONEXIÓN ---------------------- */
.lg-probar{width:100%;max-width:430px;margin-top:12px;padding:9px;background:none;
  border:1px dashed var(--line);border-radius:10px;color:var(--txt-3);font:inherit;
  font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.lg-probar:hover{color:var(--blue);border-color:rgba(23,200,192,.45)}
.lg-diag{width:100%;max-width:430px;margin-top:14px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:14px;text-align:left}
.lg-diag-t{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--txt-3);
  padding-bottom:10px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.lg-diag-p{display:flex;gap:9px;align-items:flex-start;padding:9px 0;
  border-bottom:1px solid var(--line)}
.lg-diag-p:last-child{border-bottom:none;padding-bottom:0}
.lg-diag-p svg{flex:0 0 auto;margin-top:1px}
.lg-diag-p strong{display:block;font-size:12.5px;color:#fff;font-weight:600;margin-bottom:2px}
.lg-diag-p span{display:block;font-size:11.5px;color:var(--txt-2);line-height:1.55}
.lg-diag-p.dg-ok svg{color:var(--green)}
.lg-diag-p.dg-mal svg{color:var(--red)}
.lg-diag-p.dg-mal strong{color:#FCA5A5}
.lg-diag-p.dg-aviso svg{color:var(--amber)}
.dg-esp{font-size:11.5px;color:var(--txt-3);font-style:italic}

.lg-reset{width:100%;margin-top:12px;padding:10px;font:inherit;font-size:12.5px;
  font-weight:600;color:#04231F;background:var(--blue);border:none;border-radius:9px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.lg-reset:hover{background:var(--blue-d)}
.lg-sello{width:100%;max-width:430px;margin-top:10px;text-align:center;font-size:10.5px;
  color:var(--txt-3);letter-spacing:.06em}

/* =========================================================================
   PANEL DE USUARIOS Y ACCESOS · tabla, ficha lateral y controles
   ====================================================================== */
.g-5{grid-template-columns:repeat(5,1fr)}
.nowrap{white-space:nowrap}
.req{color:var(--red)}
.tiny-chip{padding:2px 7px;font-size:10px;vertical-align:middle}

/* --- avatares --- */
.av{border-radius:50%;object-fit:cover;flex:0 0 auto;border:1px solid var(--line);display:block}
.av-txt{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;
  letter-spacing:.4px;border:none}

/* --- botón de copia en línea --- */
.cp{background:none;border:none;color:var(--txt-3);cursor:pointer;padding:2px;border-radius:5px;
  display:inline-flex;align-items:center;flex:0 0 auto}
.cp:hover{color:var(--blue);background:rgba(23,200,192,.12)}

/* --- filtros de la cabecera --- */
.u-filtros{gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.u-sel{width:auto;min-width:165px;flex:0 0 auto}

/* --- tabla --- */
.u-fila.apagada td{opacity:.62}
.sel-est{background:var(--card-2);border:1px solid var(--line);border-radius:20px;color:var(--txt-2);
  font-size:11px;padding:4px 8px;cursor:pointer;font-family:inherit}
.sel-est.ok{background:rgba(74,222,128,.12);color:#86EFAC;border-color:rgba(74,222,128,.32)}
.sel-est.wr{background:rgba(251,191,36,.12);color:#FDE68A;border-color:rgba(251,191,36,.32)}
.sel-est.ko{background:rgba(248,113,113,.12);color:#FCA5A5;border-color:rgba(248,113,113,.32)}
.sel-est:focus{outline:2px solid var(--blue);outline-offset:1px}

/* --- avisos de validación --- */
.aviso-ok{color:#86EFAC}
.aviso-ko{color:#FDE68A}

/* --- bitácora de auditoría --- */
.au-lista{display:flex;flex-direction:column;gap:11px}
.au{display:flex;gap:11px;align-items:flex-start;padding-left:2px}
.au-p{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:0 0 auto;margin-top:6px;
  box-shadow:0 0 0 3px rgba(23,200,192,.14)}

/* =========================== FICHA DE USUARIO ========================== */
.modal.ficha{max-width:1020px;width:100%;padding:0;display:flex;flex-direction:column;
  max-height:92vh;overflow:hidden}
.ft-head{display:flex;justify-content:space-between;align-items:center;gap:14px;
  padding:16px 20px;border-bottom:1px solid var(--line);flex:0 0 auto}
.ft-body{display:grid;grid-template-columns:236px 1fr;min-height:0;flex:1 1 auto}
.ft-side{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;
  gap:3px;background:var(--card-2);overflow-y:auto}
.ft-nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;border:none;
  background:none;color:var(--txt-2);font-size:12.5px;font-family:inherit;cursor:pointer;
  text-align:left;width:100%}
.ft-nav span{flex:1;min-width:0}
.ft-nav:hover{background:rgba(255,255,255,.04);color:var(--txt)}
.ft-nav.on{background:rgba(23,200,192,.12);color:#99F6E4;box-shadow:inset 2px 0 0 var(--blue)}
.ft-main{padding:20px 22px;overflow-y:auto;min-width:0}
.ft-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  padding:14px 20px;border-top:1px solid var(--line);flex:0 0 auto;background:var(--card-2)}
.ft-t{margin:0 0 14px;font-size:13px;color:#fff;font-weight:600;letter-spacing:.2px}

/* --- foto de perfil --- */
.ft-av{gap:16px;align-items:center;margin-bottom:20px}
.av-big{position:relative;width:88px;height:88px;flex:0 0 auto}
.av-big img,.av-big span{width:88px;height:88px;border-radius:50%;object-fit:cover;display:flex;
  align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:700}
.av-cam{position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;
  background:var(--blue);color:#04222A;display:flex;align-items:center;justify-content:center;
  cursor:pointer;border:2px solid var(--panel)}

/* --- interruptores --- */
.sw-row{display:flex;align-items:center;gap:14px;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;background:var(--card-2);cursor:pointer;margin-bottom:8px}
.sw-row:hover{border-color:rgba(23,200,192,.35)}
.sw{width:38px;height:21px;border-radius:20px;background:#374151;position:relative;flex:0 0 auto;
  transition:background .18s;display:inline-block}
.sw i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#9CA3AF;
  transition:left .18s,background .18s}
.sw.on{background:rgba(23,200,192,.35)}
.sw.on i{left:19px;background:var(--blue)}

/* --- matriz de permisos --- */
.pm{display:flex;flex-direction:column;gap:16px;margin-top:14px}
.pm-g{border:1px solid var(--line);border-radius:11px;overflow:hidden}
.pm-gh{display:flex;align-items:center;gap:9px;padding:10px 13px;background:var(--card-2);
  border-bottom:1px solid var(--line);font-size:12px;color:#99F6E4;font-weight:600}
.pm-i{display:flex;align-items:center;gap:13px;padding:11px 13px;cursor:pointer;
  border-bottom:1px solid rgba(37,48,68,.55)}
.pm-i:last-child{border-bottom:none}
.pm-i:hover{background:rgba(255,255,255,.03)}
.pm-i.fijo{cursor:not-allowed;opacity:.75}

/* --- notas --- */
.nota{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:10px;
  background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.28);color:#FDE68A;
  font-size:11.5px;line-height:1.6;margin-top:14px}
.nota-v{background:rgba(23,200,192,.08);border-color:rgba(23,200,192,.28);color:#99F6E4}
.nota svg{flex:0 0 auto;margin-top:1px}

/* --- días laborables --- */
.dias{display:flex;gap:7px;flex-wrap:wrap}
.dia{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--card-2);
  color:var(--txt-2);font-weight:600;font-size:12px;cursor:pointer;font-family:inherit}
.dia.on{background:rgba(23,200,192,.16);border-color:rgba(23,200,192,.45);color:#99F6E4}

/* --- sesiones --- */
.ses{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--card-2)}

.btn-r{background:var(--red);color:#2A0B0B;box-shadow:0 8px 18px -8px rgba(248,113,113,.9)}
.btn-r:hover{background:#EF4444;color:#fff}

/* --- Super Administrador de raíz --- */
.chip.root{background:linear-gradient(135deg,rgba(129,140,248,.22),rgba(23,200,192,.18));
  color:#DDD6FE;border-color:rgba(167,139,250,.45);font-weight:700;letter-spacing:.5px;
  display:inline-flex;align-items:center;gap:4px}
.card-root{border-left:3px solid var(--violet);
  background:linear-gradient(180deg,rgba(129,140,248,.07),transparent 55%)}
.raiz-aviso{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;
  background:rgba(251,191,36,.09);border:1px solid rgba(251,191,36,.3);color:#FDE68A;
  font-size:11.5px;line-height:1.6;flex:1 1 300px}
.raiz-aviso svg{flex:0 0 auto;margin-top:1px}
.raiz-aviso strong{color:#FCD34D}
.nota-root{background:rgba(129,140,248,.1);border-color:rgba(129,140,248,.35);color:#DDD6FE}
.candado{color:var(--violet);display:inline-flex;align-items:center;padding:0 4px;cursor:help}

@media(max-width:1200px){.g-5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:860px){
  .g-5{grid-template-columns:repeat(2,1fr)}
  .ft-body{grid-template-columns:1fr}
  .ft-side{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);
    padding:9px 10px}
  .ft-nav{width:auto;white-space:nowrap;flex:0 0 auto}
  .ft-nav.on{box-shadow:inset 0 -2px 0 var(--blue)}
  .modal.ficha{max-height:94vh}
}
@media(max-width:600px){
  .g-5{grid-template-columns:1fr}
  .ft-nav span{display:none}
  .ft-nav{padding:10px 13px}
  .u-sel{width:100%}
  .pm-i .mono{display:none}          /* la clave técnica sobra en pantalla pequeña */
  .ft-main{padding:16px 14px}
  .ft-av{flex-direction:column;align-items:flex-start}
}
@media(prefers-reduced-motion:reduce){.sw,.sw i{transition:none}}
.candado-nota{display:flex;gap:7px;align-items:flex-start;margin-top:6px;line-height:1.55}
.candado-nota svg{flex:0 0 auto;margin-top:1px;color:var(--violet)}

/* ---------------- Conexión con Supabase ---------------- */
.sb-pill{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:20px;
  font-size:11.5px;margin:0 auto 12px;border:1px solid var(--line);background:var(--card-2);
  color:var(--txt-2)}
.sb-pill svg{flex:0 0 auto}
.sb-pill.sb-ok{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.32);color:#86EFAC}
.sb-pill.sb-demo{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.3);color:#FDE68A}
.sb-pill.sb-espera{background:rgba(23,200,192,.1);border-color:rgba(23,200,192,.3);color:#99F6E4}
.login-wrap .sb-pill{display:flex;width:fit-content}

.sb-estado{display:flex;align-items:center;gap:14px;padding:15px!important;flex-wrap:wrap}
.sb-estado.green{border-color:rgba(74,222,128,.4)}
.sb-estado.amber{border-color:rgba(251,191,36,.4)}
.sb-estado.red{border-color:rgba(248,113,113,.4)}

.pasos{display:flex;flex-direction:column;gap:10px}
.paso{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;background:var(--card-2)}
.paso-n{width:24px;height:24px;border-radius:50%;background:rgba(23,200,192,.15);color:#99F6E4;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:0 0 auto}

/* ------------------- Informe de auditoría (ventana) ------------------- */
.ov-informe{align-items:flex-start;padding:0;overflow-y:auto}
.inf-caja{width:100%;max-width:900px;margin:0 auto;padding:0 0 40px}
.inf-barra{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;
  align-items:center;gap:14px;flex-wrap:wrap;padding:13px 18px;background:var(--panel);
  border-bottom:1px solid var(--line)}
.inf-cuerpo{padding:20px 18px 0}
.inf-hero{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0 26px}
.inf-hero-c{border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;
  background:var(--card-2)}
.inf-hero-c .k{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--txt-3);margin-bottom:3px}
.inf-hero-v{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 3px;color:var(--txt)}
.inf-100{font-size:14px;font-weight:600;color:var(--txt-3)}
.inf-bar{height:9px;border-radius:6px;background:var(--card-2);overflow:hidden;
  border:1px solid var(--line)}
.inf-bar i{display:block;height:100%;border-radius:6px}
.inf-num{font-size:17px;font-weight:800}
.inf-tbl td{padding:11px 8px}
.inf-rec{display:flex;gap:13px;align-items:flex-start;border:1px solid var(--line);
  border-radius:12px;padding:14px;margin-bottom:10px;background:var(--card-2)}
.inf-rec-n{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#04222A;
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.inf-rec-t{font-weight:700;color:#fff;margin-bottom:3px}
.inf-rec-d{color:var(--txt-2);font-size:13px;line-height:1.55}
.inf-nota{color:var(--txt-2);font-size:13px;line-height:1.65;background:var(--card-2);
  border:1px solid var(--line);border-radius:10px;padding:14px}

@media(max-width:700px){ .inf-hero{grid-template-columns:1fr} }

/* Al imprimir el informe, la página es SOLO el informe. */
@media print{
  body.con-informe .sidebar,
  body.con-informe .topbar,
  body.con-informe .content,
  body.con-informe .toast,
  body.con-informe .inf-barra{display:none!important}
  body.con-informe .ov-informe{position:static;background:none;padding:0;display:block;
    overflow:visible}
  body.con-informe .inf-caja{max-width:none;padding:0}
  body.con-informe .inf-cuerpo{padding:0}
  .inf-bar{border:1px solid #CBD5E1}
  .inf-rec,.inf-hero-c,.inf-nota{background:#fff!important;border-color:#CBD5E1!important}
  .inf-rec-t{color:#0F172A!important}
  .inf-rec-n{background:#0F766E!important;color:#fff!important}
}

/* =========================================================================
   RANKING · MISSION CONTROL · CONTROL POR VOZ · CONTRATOS
   ====================================================================== */

/* ---------------------------- PODIO ---------------------------------- */
.card-podio{padding-bottom:0;overflow:hidden}
.podio{display:flex;align-items:flex-end;justify-content:center;gap:16px;
  margin-top:22px;flex-wrap:wrap}
.pod{flex:1 1 180px;max-width:240px;text-align:center;padding:18px 14px 0;
  border:1px solid var(--line);border-radius:14px 14px 0 0;background:var(--card-2);
  position:relative;display:flex;flex-direction:column;align-items:center;gap:5px}
.pod-1{border-color:rgba(23,200,192,.5);
  background:linear-gradient(180deg,rgba(23,200,192,.12),var(--card-2) 70%)}
.pod-2{border-color:rgba(148,163,184,.35)}
.pod-3{border-color:rgba(180,83,9,.35)}
.pod-medalla{position:absolute;top:-13px;left:50%;transform:translateX(-50%);
  width:26px;height:26px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:800;color:#04231F;background:#94A3B8;
  border:2px solid var(--panel)}
.pod-1 .pod-medalla{background:var(--blue)}
.pod-3 .pod-medalla{background:#B45309;color:#fff}
.pod-av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:#fff;font-weight:700;font-size:18px;margin-top:6px}
.pod-n{font-weight:600;color:#fff;font-size:13.5px;line-height:1.3}
.pod-vol{font-size:20px;font-weight:800;color:var(--txt);letter-spacing:-.01em;margin-top:4px}
.pod-barra{width:100%;margin-top:12px;border-radius:8px 8px 0 0;background:rgba(23,200,192,.16)}
.pod-1 .pod-barra{height:56px;background:rgba(23,200,192,.3)}
.pod-2 .pod-barra{height:38px}
.pod-3 .pod-barra{height:26px}

.rk-pos{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
  border-radius:8px;background:var(--card-2);border:1px solid var(--line);
  font-size:12px;font-weight:700;color:var(--txt-2)}
.rk-pos.top{background:rgba(23,200,192,.15);border-color:rgba(23,200,192,.4);color:#99F6E4}

/* Sala de Ranking Gamificada: medallas de verdad en vez de un dígito en un
   círculo de color, indicador de tendencia, y un flash breve cuando una
   fila se mueve en directo. */
.pod-medalla-emoji{background:none!important;border:none!important;font-size:22px;top:-20px}
.rk-trend{font-size:12px}
.rk-ticker{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.rk-mueve{animation:rkFlash 700ms ease}
@keyframes rkFlash{0%{background:rgba(23,200,192,.16)}100%{background:transparent}}
@media (prefers-reduced-motion: reduce){ .rk-mueve{animation:none} }

/* ------------------------ MISSION CONTROL ---------------------------- */
.ag-rejilla{gap:14px}
.ag{display:flex;flex-direction:column}
.ag-off{opacity:.82;border-style:dashed}
.ag-acciones{display:flex;flex-direction:column;gap:8px;padding-top:11px;
  border-top:1px solid var(--line);min-height:52px}
.ag-acc{display:flex;gap:9px;align-items:flex-start}
.ag-punto{width:6px;height:6px;border-radius:50%;background:var(--blue);flex:0 0 auto;
  margin-top:5px;box-shadow:0 0 0 3px rgba(23,200,192,.14)}

/* ------------------------- CONTROL POR VOZ --------------------------- */
.vz-card{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:34px 22px;text-align:center;min-height:340px}
.vz-onda{display:flex;align-items:center;justify-content:center;gap:5px;height:56px}
.vz-onda i{width:5px;height:12px;border-radius:3px;background:var(--line);display:block}
.vz-onda.on i{background:var(--blue);animation:vzsalta 1s ease-in-out infinite}
@keyframes vzsalta{0%,100%{height:10px}50%{height:44px}}
.vz-boton{width:92px;height:92px;border-radius:50%;border:1px solid var(--line);
  background:var(--card-2);color:var(--txt-2);cursor:pointer;display:flex;
  align-items:center;justify-content:center;transition:transform .15s}
.vz-boton:hover:not(:disabled){transform:scale(1.04);color:var(--blue);
  border-color:rgba(23,200,192,.5)}
.vz-boton:disabled{opacity:.45;cursor:not-allowed}
.vz-boton.on{background:var(--blue);color:#04231F;border-color:var(--blue);
